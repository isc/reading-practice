<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabou</title>
    <script src="exit-guard.js"></script>
    <style>
      /* Pop art, case de BD : du papier crème couvert de trames de points,
         des couleurs franches cernées de noir, et des onomatopées qui
         éclatent à chaque coup. Les points sont vivants : une onde les gonfle
         quand on trouve un mot, et une carte se change en une autre en se
         dissolvant dans sa trame. */

      @font-face {
        font-family: "Bangers";
        src: url("Bangers-Regular.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Luckiest Guy";
        src: url("LuckiestGuy-Regular.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Lexend";
        src: url("Lexend-Variable.woff2") format("woff2");
        font-weight: 300 700;
        font-display: swap;
      }

      :root {
        --ink: #15131a;
        --paper: #fff6e0;
        --yellow: #ffd60a;
        --red: #ff2d3f;
        --blue: #2365ff;
        --green: #22c76a;
        --cyan: #18b6ee;
        --pop: "Bangers", "Impact", sans-serif;
        --bold: "Luckiest Guy", "Arial Black", sans-serif;
        --text: "Lexend", "Arial", sans-serif;
        --line: 3px solid var(--ink);
        --shadow: 5px 5px 0 var(--ink);
        --dots: radial-gradient(rgba(21, 19, 26, 0.16) 28%, transparent 31%);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--text);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      .hidden {
        display: none !important;
      }

      /* La trame de fond, dessinée sur un canevas (voir HalftoneField). */
      #field {
        height: 100%;
        inset: 0;
        pointer-events: none;
        position: fixed;
        width: 100%;
        z-index: 0;
      }

      #confetti {
        height: 100%;
        inset: 0;
        pointer-events: none;
        position: fixed;
        width: 100%;
        z-index: 40;
      }

      .screen {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        max-width: 520px;
        padding: max(14px, env(safe-area-inset-top)) 14px
          max(14px, env(safe-area-inset-bottom));
        position: relative;
        z-index: 1;
      }

      /* --- Éléments communs ------------------------------------------- */
      .panel {
        background: #fff;
        border: var(--line);
        border-radius: 6px;
        box-shadow: var(--shadow);
        position: relative;
      }

      .caption {
        background: var(--yellow);
        border: var(--line);
        display: inline-block;
        font-family: var(--pop);
        font-size: 1.15rem;
        letter-spacing: 0.06em;
        line-height: 1;
        padding: 5px 9px 3px;
      }

      .btn {
        align-items: center;
        background: var(--yellow);
        border: var(--line);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--ink);
        color: var(--ink);
        cursor: pointer;
        display: flex;
        font-family: var(--bold);
        font-size: 1.35rem;
        gap: 10px;
        justify-content: center;
        line-height: 1;
        min-height: 60px;
        text-transform: uppercase;
        padding: 14px 16px 10px;
        touch-action: manipulation;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }

      .btn svg {
        flex: none;
        height: 1.4em;
        margin-top: -4px;
        width: 1.4em;
      }

      .btn:active:not(:disabled) {
        box-shadow: 1px 1px 0 var(--ink);
        transform: translate(3px, 3px);
      }

      .btn:disabled {
        cursor: default;
        opacity: 0.45;
      }

      @media (hover: hover) {
        .btn:hover:not(:disabled) {
          box-shadow: 6px 6px 0 var(--ink);
          transform: translate(-2px, -2px);
        }
      }

      .home-link {
        align-self: center;
        color: var(--ink);
        font-family: var(--pop);
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        padding: 10px 16px;
        text-decoration: none;
      }

      .burst-shape {
        stroke: var(--ink);
        stroke-linejoin: round;
      }

      /* --- Accueil ---------------------------------------------------- */
      .welcome {
        gap: 14px;
        justify-content: center;
      }

      .cover {
        align-self: center;
        height: 150px;
        position: relative;
        width: 300px;
      }

      .cover svg {
        height: 100%;
        left: 0;
        overflow: visible;
        position: absolute;
        top: 0;
        width: 100%;
      }

      .title-text {
        fill: var(--yellow);
        font-family: var(--bold);
        font-size: 74px;
        paint-order: stroke;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 10px;
      }

      .title-shadow {
        fill: var(--ink);
        font-family: var(--bold);
        font-size: 74px;
      }

      .rules {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr;
        list-style: none;
      }

      .rules li {
        align-items: center;
        display: flex;
        flex-direction: column;
        font-size: 0.95rem;
        font-weight: 600;
        gap: 6px;
        line-height: 1.25;
        padding: 10px 8px;
        text-align: center;
      }

      .rules li:nth-child(1) {
        transform: rotate(-1.2deg);
      }

      .rules li:nth-child(4) {
        transform: rotate(1deg);
      }

      .rules svg {
        height: 34px;
        width: 34px;
      }

      .settings {
        display: grid;
        gap: 12px;
        padding: 10px 12px 14px;
      }

      .setting {
        display: grid;
        gap: 6px;
      }

      .setting-label {
        font-family: var(--pop);
        font-size: 1.2rem;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      .choices {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
      }

      .choice {
        background: #fff;
        border: var(--line);
        border-radius: 6px;
        color: var(--ink);
        cursor: pointer;
        font-family: var(--bold);
        font-size: 1.15rem;
        line-height: 1;
        min-height: 50px;
        padding: 8px 4px 4px;
        text-transform: uppercase;
        touch-action: manipulation;
        transition: transform 0.12s;
      }

      .choice.selected {
        background-color: var(--yellow);
        background-image: var(--dots);
        background-size: 7px 7px;
        box-shadow: 3px 3px 0 var(--ink);
        transform: translate(-2px, -2px) rotate(-2deg);
      }

      .start {
        font-size: 1.6rem;
        min-height: 70px;
      }

      /* --- Partie ----------------------------------------------------- */
      .game {
        gap: 12px;
      }

      .top-bar {
        align-items: center;
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr auto 1fr;
      }

      .team-score {
        align-items: center;
        display: flex;
        flex-direction: column;
        padding: 6px 4px 4px;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }

      .team-score:not(.active) {
        box-shadow: 2px 2px 0 var(--ink);
        color: #8a8794;
      }

      .team-score .name {
        font-family: var(--pop);
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        line-height: 1;
      }

      .team-score .points {
        font-family: var(--bold);
        font-size: 2.3rem;
        line-height: 1;
        margin-top: 4px;
      }

      .team-score.team1 .points {
        color: var(--red);
      }

      .team-score.team2 .points {
        color: var(--blue);
      }

      .team-score.active {
        transform: rotate(-2deg) scale(1.04);
      }

      .team-score.team2.active {
        transform: rotate(2deg) scale(1.04);
      }

      .team-score.active.team1 {
        background: #ffe1e3;
      }

      .team-score.active.team2 {
        background: #dfe8ff;
      }

      .float-point {
        font-family: var(--bold);
        font-size: 1.6rem;
        left: 78%;
        pointer-events: none;
        position: absolute;
        top: 46%;
      }

      .timer {
        height: 88px;
        position: relative;
        width: 88px;
      }

      .timer svg {
        height: 100%;
        inset: 0;
        overflow: visible;
        position: absolute;
        width: 100%;
      }

      .timer .burst-shape {
        fill: var(--yellow);
        transition: fill 0.2s;
      }

      .timer-value {
        align-items: center;
        display: flex;
        font-family: var(--bold);
        font-size: 2rem;
        font-variant-numeric: tabular-nums;
        inset: 0;
        justify-content: center;
        line-height: 1;
        padding-top: 6px;
        position: absolute;
      }

      .timer.urgent .burst-shape {
        fill: var(--red);
      }

      .timer.urgent .timer-value {
        color: #fff;
      }

      .card-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
      }

      .card {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .card-top {
        align-items: center;
        background-color: var(--yellow);
        background-image: var(--dots);
        background-size: 9px 9px;
        border-bottom: var(--line);
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
        padding: 30px 12px 14px;
        position: relative;
      }

      .card-top .caption {
        background: #fff;
        border-width: 0 3px 3px 0;
        left: 0;
        position: absolute;
        top: 0;
      }

      .word {
        font-family: var(--bold);
        font-size: 3.2rem;
        line-height: 1.05;
        padding-top: 0.12em;
        text-align: center;
        text-shadow: 3px 3px 0 #fff;
        white-space: nowrap;
      }

      .card-bottom {
        background-color: var(--red);
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.22) 28%,
          transparent 31%
        );
        background-size: 9px 9px;
        padding: 10px 14px 14px;
      }

      .forbidden {
        align-items: center;
        background: var(--ink);
        color: #fff;
        display: flex;
        gap: 6px;
        margin: 0 auto 10px;
        width: fit-content;
      }

      .forbidden svg {
        height: 1.1em;
        margin-top: -3px;
        width: 1.1em;
      }

      .taboo-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        list-style: none;
      }

      .taboo-list li {
        background: #fff;
        border: var(--line);
        border-radius: 4px;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.2;
        padding: 6px 8px;
        text-align: center;
      }

      .taboo-list li:nth-child(odd) {
        transform: rotate(-0.8deg);
      }

      .taboo-list li:nth-child(even) {
        transform: rotate(0.7deg);
      }

      /* Le fondu en trame, et les onomatopées : par-dessus la carte. */
      .wipe {
        border-radius: 3px;
        height: calc(100% - 6px);
        left: 3px;
        pointer-events: none;
        position: absolute;
        top: 3px;
        width: calc(100% - 6px);
      }

      .pause-cover {
        align-items: center;
        background-color: #fff;
        background-image: var(--dots);
        background-size: 9px 9px;
        border: var(--line);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        inset: 0;
        justify-content: center;
        position: absolute;
      }

      .pause-cover svg {
        height: 96px;
        width: 96px;
      }

      .pause-cover .caption {
        font-size: 2rem;
      }

      .sfx-layer {
        inset: -20px;
        pointer-events: none;
        position: absolute;
        z-index: 5;
      }

      .sfx {
        left: 50%;
        position: absolute;
        top: 38%;
        width: 270px;
      }

      .sfx svg {
        display: block;
        overflow: visible;
        width: 100%;
      }

      .sfx-text {
        font-family: var(--pop);
        letter-spacing: 2px;
        paint-order: stroke;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 9px;
      }

      .actions {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr;
      }

      .action {
        font-size: 1.3rem;
      }

      .action.found,
      .action.taboo {
        min-height: 74px;
      }

      .action.found {
        background: var(--green);
      }

      .action.taboo {
        background: var(--red);
        color: #fff;
      }

      .action.skip {
        background: var(--cyan);
      }

      .action.pause {
        background: #fff;
      }

      .action .pts {
        font-size: 0.85em;
        opacity: 0.85;
      }

      /* --- Fin de tour, fin de partie ---------------------------------- */
      .result {
        gap: 18px;
        justify-content: center;
      }

      .result-burst {
        align-self: center;
        width: 300px;
      }

      .result-burst svg {
        display: block;
        overflow: visible;
        width: 100%;
      }

      .result-panel {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px 14px 20px;
      }

      .result-title {
        font-family: var(--bold);
        font-size: 1.7rem;
        line-height: 1.1;
        padding-top: 4px;
        text-align: center;
        text-transform: uppercase;
      }

      .result-title .team-chip {
        padding: 4px 10px 0;
      }

      /* Les couleurs d'équipe, partout où elles apparaissent. */
      .t1,
      .t2 {
        color: #fff;
      }

      .t1 {
        background: var(--red);
      }

      .t2 {
        background: var(--blue);
      }

      .team-chip {
        border: var(--line);
        border-radius: 6px;
        display: inline-block;
        text-shadow: 2px 2px 0 var(--ink);
      }

      .round-points {
        font-family: var(--bold);
        font-size: 3.4rem;
        line-height: 1;
        padding-top: 6px;
      }

      .scoreboard {
        align-items: center;
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr auto 1fr;
        width: 100%;
      }

      .scoreboard .side {
        align-items: center;
        border: var(--line);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        padding: 8px 4px 4px;
      }

      .scoreboard .side span {
        font-family: var(--pop);
        font-size: 1.05rem;
        letter-spacing: 0.05em;
      }

      .scoreboard .side strong {
        font-family: var(--bold);
        font-size: 2.6rem;
        font-weight: normal;
        line-height: 1;
        padding-top: 4px;
        text-shadow: 3px 3px 0 var(--ink);
      }

      .scoreboard .vs {
        font-family: var(--pop);
        font-size: 1.6rem;
      }

      .next-team,
      .replay {
        align-self: stretch;
        font-size: 1.5rem;
        min-height: 70px;
      }

      @media (max-height: 700px) {
        .cover {
          height: 120px;
        }

        .rules li {
          font-size: 0.85rem;
          padding: 8px 6px;
        }

        .rules svg {
          height: 26px;
          width: 26px;
        }

        .timer {
          height: 76px;
          width: 76px;
        }

        .action.found,
        .action.taboo {
          min-height: 64px;
        }

        .btn {
          min-height: 54px;
        }

        .taboo-list li {
          font-size: 1.05rem;
          padding: 4px 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn,
        .choice,
        .team-score {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>

    <!-- Accueil -->
    <main class="screen welcome welcome-screen">
      <h1 class="cover" aria-label="Tabou !">
        <svg viewBox="0 0 300 150" aria-hidden="true">
          <polygon
            class="burst-shape"
            id="coverBurst"
            fill="#ff2d3f"
            stroke-width="4"
          />
          <text
            class="title-shadow"
            x="156"
            y="108"
            text-anchor="middle"
            transform="rotate(-5 150 75)"
          >
            TABOU !
          </text>
          <text
            class="title-text"
            x="150"
            y="102"
            text-anchor="middle"
            transform="rotate(-5 150 75)"
          >
            TABOU !
          </text>
        </svg>
      </h1>

      <ul class="rules">
        <li class="panel">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path
              d="M6 8h28a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H17l-8 7v-7H6a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z"
              fill="#ffd60a"
              stroke="#15131a"
              stroke-width="3"
              stroke-linejoin="round"
            />
            <circle cx="13" cy="18" r="2.4" fill="#15131a" />
            <circle cx="20" cy="18" r="2.4" fill="#15131a" />
            <circle cx="27" cy="18" r="2.4" fill="#15131a" />
          </svg>
          Fais deviner le mot à ton équipe.
        </li>
        <li class="panel">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle
              cx="20"
              cy="20"
              r="15"
              fill="#fff"
              stroke="#ff2d3f"
              stroke-width="6"
            />
            <path d="M9.5 9.5l21 21" stroke="#ff2d3f" stroke-width="6" />
          </svg>
          Sans dire les mots interdits !
        </li>
        <li class="panel">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <rect
              x="3"
              y="7"
              width="34"
              height="26"
              rx="4"
              fill="#22c76a"
              stroke="#15131a"
              stroke-width="3"
            />
            <path
              d="M11 20.5l6 6 12-13"
              fill="none"
              stroke="#15131a"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Mot trouvé : +1<br />Mot interdit dit : −1
        </li>
        <li class="panel">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle
              cx="13"
              cy="20"
              r="10"
              fill="#ff2d3f"
              stroke="#15131a"
              stroke-width="3"
            />
            <circle
              cx="27"
              cy="20"
              r="10"
              fill="#2365ff"
              stroke="#15131a"
              stroke-width="3"
            />
          </svg>
          Les équipes jouent chacune leur tour.
        </li>
      </ul>

      <div class="panel settings">
        <div class="setting">
          <span class="setting-label">Durée d'un tour</span>
          <div class="choices" id="durationChoices"></div>
        </div>
        <div class="setting">
          <span class="setting-label">Points pour gagner</span>
          <div class="choices" id="targetChoices"></div>
        </div>
      </div>

      <button class="btn start" id="startBtn" disabled>Chargement…</button>
      <a class="home-link" href="index.html">← Retour aux jeux</a>
    </main>

    <!-- Partie -->
    <main class="screen game game-screen hidden">
      <div class="top-bar">
        <div class="panel team-score team1" id="scoreTeam1">
          <div class="name">Équipe 1</div>
          <div class="points">0</div>
        </div>
        <div class="timer" id="timer">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon class="burst-shape" id="timerBurst" stroke-width="3.5" />
          </svg>
          <div class="timer-value" id="timerValue">60</div>
        </div>
        <div class="panel team-score team2" id="scoreTeam2">
          <div class="name">Équipe 2</div>
          <div class="points">0</div>
        </div>
      </div>

      <div class="card-wrap" id="cardWrap">
        <article class="panel card" id="card">
          <div class="card-top">
            <span class="caption">Fais deviner</span>
            <div class="word" id="word"></div>
          </div>
          <div class="card-bottom">
            <div class="caption forbidden">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle
                  cx="10"
                  cy="10"
                  r="7.5"
                  fill="none"
                  stroke="#ff2d3f"
                  stroke-width="3"
                />
                <path
                  d="M4.7 4.7l10.6 10.6"
                  stroke="#ff2d3f"
                  stroke-width="3"
                />
              </svg>
              Mots interdits
            </div>
            <ul class="taboo-list" id="tabooList"></ul>
          </div>
        </article>
        <canvas class="wipe" id="wipe" aria-hidden="true"></canvas>
        <div class="pause-cover hidden" id="pauseCover">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <circle
              cx="48"
              cy="48"
              r="42"
              fill="#ffd60a"
              stroke="#15131a"
              stroke-width="5"
            />
            <rect x="32" y="28" width="11" height="40" rx="2" fill="#15131a" />
            <rect x="53" y="28" width="11" height="40" rx="2" fill="#15131a" />
          </svg>
          <span class="caption">Pause</span>
        </div>
        <div class="sfx-layer" id="sfxLayer" aria-hidden="true"></div>
      </div>

      <div class="actions">
        <button class="btn action found" id="foundBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 12.5l5.5 5.5L20 6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="3.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Trouvé <span class="pts">+1</span>
        </button>
        <button class="btn action taboo" id="tabooBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="12"
              cy="12"
              r="8.5"
              fill="none"

            <rect

          </svg>
          <svg
            viewBox="0 0 24 24"

            <path

    <!-- Fin de tour -->
    <main class="screen result round-end hidden">

      <div class="panel result-panel">

    <!-- Fin de partie -->
    <main class="screen result game-end hidden">

      <div class="panel result-panel">
        <div class="result-title" id="winnerTitle"></div>

        <svg viewBox="0 0 24 24" aria-hidden="true">

            d="M19 12a7 7 0 1 1-2.1-5"

          />
          <path
            d="M18.5 2.5v5h-5"

    <canvas id="confetti"></canvas>

    <script src="voix.js"></script>
    <script>
      const DURATIONS = [30, 60, 90]
      const TARGETS = [5, 10, 15]

      const INK = "#15131a"
      const COLORS = {
        red: "#ff2d3f",
        blue: "#2365ff",
        yellow: "#ffd60a",
        green: "#22c76a",
        cyan: "#18b6ee",
      }
      const TEAM_COLORS = [COLORS.red, COLORS.blue]

      // Les onomatopées : on pioche au hasard, sans redire la même deux fois
      // de suite.
      const SFX = {
        found: ["BING !", "YES !", "TCHAC !", "WOUAH !", "SUPER !", "BRAVO !"],
        taboo: ["BZZZT !", "OUPS !", "AÏE !", "PAF !"],
        skip: ["ZIOU !", "HOP !", "FIOUU !"],
      }

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches

      let cards = []
      let deck = [] // indices restants, mélangés
      let currentCard = null
      let duration = 60
      let target = 10
      let scores = [0, 0] // index 0 = équipe 1
      let currentTeam = 0
      let roundPoints = 0
      let timeLeft = 60
      let timer = null
      let running = false

      const $ = (id) => document.getElementById(id)

      const welcomeScreen = document.querySelector(".welcome-screen")
      const gameScreen = document.querySelector(".game-screen")
      const roundEndScreen = document.querySelector(".round-end")
      const gameEndScreen = document.querySelector(".game-end")

      const PLAY_ICON = $("playIcon").outerHTML.replace(
        ' id="playIcon" class="hidden"',
        "",
      )

      const teamName = (team) => (team === 0 ? "Équipe 1" : "Équipe 2")
      const teamChip = (team) =>
        `<span class="team-chip t${team + 1}">${teamName(team)}</span>`

      function show(screen) {
        for (const s of [
          welcomeScreen,
          gameScreen,
          roundEndScreen,
          gameEndScreen,
        ]) {
          s.classList.toggle("hidden", s !== screen)
        }
      }

      function pick(list) {
        let word
        do word = list[Math.floor(Math.random() * list.length)]
        while (list.length > 1 && word === pick.last)
        pick.last = word
        return word
      }

      // --- Éclats (étoiles à pointes irrégulières) ------------------------
      // Une étoile dans un ovale de centre (cx, cy) et de rayons (rx, ry),
      // pointes plus ou moins longues comme dans une case de BD.
      function burstPoints(cx, cy, rx, ry, spikes, depth = 0.72) {
        const points = []
        for (let i = 0; i < spikes * 2; i++) {
          const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2
          const r =
            i % 2
              ? depth * (0.92 + Math.random() * 0.12)
              : 0.86 + Math.random() * 0.22
          points.push(
            (cx + Math.cos(angle) * rx * r).toFixed(1) +
              "," +
              (cy + Math.sin(angle) * ry * r).toFixed(1),
          )
        }
        return points.join(" ")
      }

      // Un éclat avec son texte, en SVG : contour noir, ombre décalée.
      function burstSvg(text, color) {
        const size = Math.min(64, 480 / text.length)
        const shape = burstPoints(150, 95, 140, 88, 13, 0.7)
        const inner = burstPoints(150, 95, 108, 64, 13, 0.78)
        const tilt = (Math.random() * 10 - 5).toFixed(1)
        return `<svg viewBox="0 0 300 190">
          <polygon points="${shape}" fill="${INK}" transform="translate(7 7)" />
          <polygon class="burst-shape" points="${shape}" fill="${color}" stroke-width="5" />
          <polygon points="${inner}" fill="${COLORS.yellow}" opacity="0.9" />
          <text class="sfx-text" x="150" y="${95 + size * 0.36}" text-anchor="middle"
            font-size="${size}" fill="#fff"
            transform="rotate(${tilt} 150 95)">${text}</text>
        </svg>`
      }

      $("coverBurst").setAttribute(
        "points",
        burstPoints(150, 75, 140, 68, 15, 0.74),
      )
      $("timerBurst").setAttribute(
        "points",
        burstPoints(50, 50, 48, 48, 12, 0.8),
      )

      // Une onomatopée qui éclate par-dessus la carte puis s'efface.
      function popSfx(text, color, duration = 720) {
        const layer = $("sfxLayer")
        const el = document.createElement("div")
        el.className = "sfx"
        el.innerHTML = burstSvg(text, color)
        layer.replaceChildren(el)
        const tilt = Math.random() * 16 - 8
        const frames = reduceMotion
          ? [
              { opacity: 0, transform: "translate(-50%, -50%)" },
              { opacity: 1, offset: 0.15 },
              { opacity: 1, offset: 0.75 },
              { opacity: 0, transform: "translate(-50%, -50%)" },
            ]
          : [
              {
                opacity: 0,
                transform: `translate(-50%, -50%) scale(0.2) rotate(${tilt - 25}deg)`,
              },
              {
                opacity: 1,
                transform: `translate(-50%, -50%) scale(1.15) rotate(${tilt}deg)`,
                offset: 0.18,
              },
              {
                opacity: 1,
                transform: `translate(-50%, -50%) scale(1) rotate(${tilt}deg)`,
                offset: 0.32,
              },
              {
                opacity: 1,
                transform: `translate(-50%, -50%) scale(1.02) rotate(${tilt}deg)`,
                offset: 0.75,
              },
              {
                opacity: 0,
                transform: `translate(-50%, -50%) scale(1.25) rotate(${tilt + 4}deg)`,
              },
            ]
        el.animate(frames, {
          duration,
          easing: "ease-out",
          fill: "forwards",
        }).onfinish = () => el.remove()
      }

      // --- La trame de fond : des points qui réagissent -----------------
      // Une trame de points comme sur une page de BD imprimée, plus gros en
      // bas. Une onde peut la traverser (trouvé, tabou, passer) : les points
      // gonflent et prennent la couleur du coup au passage de l'onde. La trame
      // au repos est dessinée une fois sur un canevas caché ; pendant une onde,
      // on la recopie puis on ne redessine que les points sur l'anneau.
      const field = (() => {
        const canvas = $("field")
        const ctx = canvas.getContext("2d")
        const still = document.createElement("canvas")
        const stillCtx = still.getContext("2d")
        const STEP = 16
        const RING = 60 // demi-épaisseur de l'onde, en px
        let width = 0
        let height = 0
        let dpr = 1
        let dots = []
        let tint = TEAM_COLORS[0]
        let waves = []
        let frame = null

        function resize() {
          const newDpr = Math.min(2, window.devicePixelRatio || 1)
          if (
            window.innerWidth === width &&
            window.innerHeight === height &&
            newDpr === dpr
          )
            return
          width = window.innerWidth
          height = window.innerHeight
          dpr = newDpr
          for (const [c, cx] of [
            [canvas, ctx],
            [still, stillCtx],
          ]) {
            c.width = width * dpr
            c.height = height * dpr
            cx.setTransform(dpr, 0, 0, dpr, 0, 0)
          }
          dots = []
          // Trame inclinée à 45° : une rangée sur deux est décalée.
          for (let row = 0, y = 0; y < height + STEP; row++, y += STEP * 0.5) {
            const gradient = Math.min(1, y / height)
            const base = 0.6 + gradient * gradient * 4.4
            for (let x = row % 2 ? STEP / 2 : 0; x < width + STEP; x += STEP) {
              dots.push({ x, y, base })
            }
          }
          paintStill()
        }

        function paintStill() {
          stillCtx.clearRect(0, 0, width, height)
          stillCtx.globalAlpha = 0.2
          stillCtx.fillStyle = tint
          stillCtx.beginPath()
          for (const d of dots) {
            stillCtx.moveTo(d.x + d.base, d.y)
            stillCtx.arc(d.x, d.y, d.base, 0, Math.PI * 2)
          }
          stillCtx.fill()
          if (!frame) draw(performance.now())
        }

        function draw(now) {
          ctx.clearRect(0, 0, width, height)
          ctx.drawImage(still, 0, 0, width, height)
          for (let i = waves.length - 1; i >= 0; i--) {
            if (now - waves[i].start >= waves[i].life) waves.splice(i, 1)
          }
          for (const w of waves) {
            const age = (now - w.start) / w.life
            const radius = age * w.reach
            const fade = 1 - age
            const inner = Math.max(0, radius - RING) ** 2
            const outer = (radius + RING) ** 2
            ctx.fillStyle = w.color
            ctx.beginPath()
            for (const d of dots) {
              const dx = d.x - w.x
              const dy = d.y - w.y
              const dist2 = dx * dx + dy * dy
              if (dist2 < inner || dist2 > outer) continue
              const near = 1 - Math.abs(Math.sqrt(dist2) - radius) / RING
              const bump = near * near * fade
              if (bump < 0.12) continue
              const r = d.base + bump * 5
              ctx.moveTo(d.x + r, d.y)
              ctx.arc(d.x, d.y, r, 0, Math.PI * 2)
            }
            ctx.fill()
          }
          frame = waves.length ? requestAnimationFrame(draw) : null
        }

        function wave(x, y, color) {
          if (reduceMotion) return
          waves.push({
            x,
            y,
            color,
            start: performance.now(),
            life: 1100,
            reach: Math.hypot(width, height),
          })
          if (!frame) frame = requestAnimationFrame(draw)
        }

        function setTint(color) {
          tint = color
          paintStill()
        }

        // Safari envoie des rafales de resize quand sa barre d'outils bouge.
        let pending = null
        window.addEventListener("resize", () => {
          if (!pending) {
            pending = requestAnimationFrame(() => {
              pending = null
              resize()
            })
          }
        })
        resize()
        return { wave, setTint }
      })()

      // Une onde qui part du centre d'un élément (le bouton touché).
      function waveFrom(el, color) {
        const box = el.getBoundingClientRect()
        field.wave(box.left + box.width / 2, box.top + box.height / 2, color)
      }

      // --- Le fondu en trame de la carte ---------------------------------
      // Des points grossissent en diagonale jusqu'à couvrir la carte, la
      // carte change dessous, puis les points rapetissent et la découvrent.
      const wipe = (() => {
        const canvas = $("wipe")
        const ctx = canvas.getContext("2d")
        const STEP = 18
        const HALF = 260 // ms par moitié
        let frame = null
        let pending = null

        function finish() {
          if (frame) cancelAnimationFrame(frame)
          frame = null
          if (pending) pending()
          pending = null
          ctx.clearRect(0, 0, canvas.width, canvas.height)
        }

        function run(color, swap) {
          finish()
          if (reduceMotion) {
            swap()
            return
          }
          const dpr = Math.min(2, window.devicePixelRatio || 1)
          const w = canvas.clientWidth
          const h = canvas.clientHeight
          if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
            canvas.width = w * dpr
            canvas.height = h * dpr
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          }
          pending = swap
          const start = performance.now()
          const maxR = STEP * 0.78
          const ease = (t) => t * t * (3 - 2 * t)

          function step(now) {
            const t = (now - start) / HALF
            const covering = t < 1
            if (!covering && pending) {
              pending()
              pending = null
            }
            if (t >= 2) {
              finish()
              return
            }
            const local = covering ? t : t - 1
            ctx.clearRect(0, 0, w, h)
            ctx.fillStyle = color
            ctx.beginPath()
            for (let y = 0; y < h + STEP; y += STEP) {
              for (let x = 0; x < w + STEP; x += STEP) {
                // Le long de la diagonale, du coin en bas à gauche.
                const diag = (x + (h - y)) / (w + h)
                const p = ease(
                  Math.min(1, Math.max(0, (local - diag * 0.45) / 0.55)),
                )
                const r = maxR * (covering ? p : 1 - p)
                if (r <= 0.2) continue
                ctx.moveTo(x + r, y)
                ctx.arc(x, y, r, 0, Math.PI * 2)
              }
            }
            ctx.fill()
            frame = requestAnimationFrame(step)
          }
          frame = requestAnimationFrame(step)
        }

        return { run, finish }
      })()

      // --- Son -------------------------------------------------------------
      // Des sons de BD synthétisés, joués par le contexte de voix.js : il est
      // réveillé au toucher (obligatoire sur iPhone) et tenu éveillé le temps
      // d'un tour pour le tic-tac de la fin.
      function tone(type, freq, start, length, volume, endFreq) {
        const ctx = Voice.context()
        if (!ctx) return
        const t = ctx.currentTime + start
        const osc = ctx.createOscillator()
        const gain = ctx.createGain()
        osc.type = type
        osc.frequency.setValueAtTime(freq, t)
        if (endFreq)
          osc.frequency.exponentialRampToValueAtTime(endFreq, t + length)
        gain.gain.setValueAtTime(0, t)
        gain.gain.linearRampToValueAtTime(volume, t + 0.01)
        gain.gain.exponentialRampToValueAtTime(0.001, t + length)
        osc.connect(gain)
        gain.connect(ctx.destination)
        osc.start(t)
        osc.stop(t + length + 0.02)
      }

      let noiseBuffer = null

      function whoosh() {
        const ctx = Voice.context()
        if (!ctx) return
        const length = 0.35
        if (!noiseBuffer) {
          noiseBuffer = ctx.createBuffer(
            1,
            ctx.sampleRate * length,
            ctx.sampleRate,
          )
          const data = noiseBuffer.getChannelData(0)
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1
        }
        const noise = ctx.createBufferSource()
        noise.buffer = noiseBuffer
        const filter = ctx.createBiquadFilter()
        filter.type = "bandpass"
        filter.Q.value = 1.4
        const t = ctx.currentTime
        filter.frequency.setValueAtTime(500, t)
        filter.frequency.exponentialRampToValueAtTime(3500, t + length)
        const gain = ctx.createGain()
        gain.gain.setValueAtTime(0, t)
        gain.gain.linearRampToValueAtTime(0.35, t + 0.08)
        gain.gain.exponentialRampToValueAtTime(0.001, t + length)
        noise.connect(filter)
        filter.connect(gain)
        gain.connect(ctx.destination)
        noise.start(t)
      }

      const sounds = {
        found() {
          tone("square", 660, 0, 0.09, 0.08)
          tone("square", 990, 0.08, 0.22, 0.08)
          tone("triangle", 1320, 0.08, 0.3, 0.12)
        },
        taboo() {
          tone("sawtooth", 110, 0, 0.45, 0.12)
          tone("sawtooth", 117, 0, 0.45, 0.12)
        },
        skip: whoosh,
        tick() {
          tone("triangle", 1250, 0, 0.06, 0.18)
        },
        // La sonnerie de fin de tour : deux notes qui alternent très vite.
        ring() {
          for (let i = 0; i < 14; i++) {
            tone("square", i % 2 ? 1480 : 1320, i * 0.05, 0.06, 0.05)
          }
        },
        win() {
          ;[523, 659, 784, 1047].forEach((f, i) =>
            tone("square", f, i * 0.12, i === 3 ? 0.5 : 0.14, 0.07),
          )
        },
      }

      function play(name, wakeMs = 1500) {
        try {
          Voice.wake(wakeMs)
          sounds[name]()
        } catch (e) {
          // Pas de son disponible : le jeu reste jouable.
        }
      }

      // --- Réglages --------------------------------------------------------
      function buildChoices(container, values, label, selected, onPick) {
        container.innerHTML = ""
        for (const value of values) {
          const btn = document.createElement("button")
          btn.className = "choice" + (value === selected ? " selected" : "")
          btn.textContent = label(value)
          btn.addEventListener("click", () => {
            for (const other of container.children) {
              other.classList.remove("selected")
            }
            btn.classList.add("selected")
            onPick(value)
          })
          container.appendChild(btn)
        }
      }

      buildChoices(
        $("durationChoices"),
        DURATIONS,
        (v) => v + " s",
        duration,
        (v) => (duration = v),
      )
      buildChoices(
        $("targetChoices"),
        TARGETS,
        (v) => v + " pts",
        target,
        (v) => (target = v),
      )

      // --- Cartes ----------------------------------------------------------
      async function loadCards() {
        try {
          const response = await fetch("tabou-cartes.json")
          cards = await response.json()
        } catch (error) {
          // Repli minimal si le fichier n'est pas accessible.
          cards = [
            {
              word: "PIZZA",
              taboo: ["ITALIEN", "FROMAGE", "PÂTE", "TOMATE", "RESTAURANT"],
            },
            {
              word: "CHOCOLAT",
              taboo: ["CACAO", "SUCRÉ", "TABLETTE", "DESSERT", "BONBON"],
            },
          ]
        }
        $("startBtn").disabled = false
        $("startBtn").innerHTML = PLAY_ICON + "C'est parti !"
      }

      function shuffleDeck() {
        deck = cards.map((_, i) => i)
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[deck[i], deck[j]] = [deck[j], deck[i]]
        }
      }

      // Tire une carte ; avec une couleur, elle arrive par le fondu en trame.
      function drawCard(color) {
        if (deck.length === 0) shuffleDeck()
        currentCard = cards[deck.pop()]
        if (color) wipe.run(color, displayCard)
        else displayCard()
      }

      function displayCard() {
        const word = $("word")
        word.textContent = currentCard.word
        fitWord(word)
        $("tabooList").replaceChildren(
          ...currentCard.taboo.map((taboo) => {
            const li = document.createElement("li")
            li.textContent = taboo
            return li
          }),
        )
      }

      // Le mot à deviner, le plus gros possible sur une seule ligne.
      function fitWord(el) {
        el.style.fontSize = ""
        const room = el.parentElement.clientWidth - 24
        const width = el.scrollWidth
        if (width > room) {
          const size = parseFloat(getComputedStyle(el).fontSize)
          el.style.fontSize = Math.floor((size * room) / width) + "px"
        }
      }

      // --- Partie ----------------------------------------------------------
      function startGame() {
        scores = [0, 0]
        currentTeam = 0
        shuffleDeck()
        updateScores()
        startRound()
      }

      function startRound() {
        roundPoints = 0
        timeLeft = duration
        running = true
        field.setTint(TEAM_COLORS[currentTeam])
        updateTimer()
        updateScores()
        setActionsEnabled(true)
        $("pauseBtn").disabled = false
        setPauseLook(false)
        show(gameScreen)
        drawCard()
        // Le contexte audio reste éveillé tout le tour, pour le tic-tac.
        Voice.wake((duration + 3) * 1000)
        if (window.ExitGuard) ExitGuard.setActive(true)
        startTimer()
      }

      function startTimer() {
        clearTimer()
        timer = setInterval(() => {
          timeLeft--
          updateTimer()
          if (timeLeft <= 5 && timeLeft > 0) {
            play("tick", (timeLeft + 3) * 1000)
            if (!reduceMotion) {
              $("timer").animate(
                [
                  { transform: "scale(1.2) rotate(-6deg)" },
                  { transform: "scale(1) rotate(0)" },
                ],
                { duration: 350, easing: "ease-out" },
              )
            }
          }
          if (timeLeft <= 0) endRound()
        }, 1000)
      }

      function clearTimer() {
        if (timer) {
          clearInterval(timer)
          timer = null
        }
      }

      function setPauseLook(paused) {
        $("pauseLabel").textContent = paused ? "Reprendre" : "Pause"
        $("pauseIcon").classList.toggle("hidden", paused)
        $("playIcon").classList.toggle("hidden", !paused)
        $("pauseCover").classList.toggle("hidden", !paused)
      }

      function togglePause() {
        running = !running
        wipe.finish()
        setPauseLook(!running)
        setActionsEnabled(running)
        if (running) {
          Voice.wake((timeLeft + 3) * 1000)
          startTimer()
        } else clearTimer()
      }

      // Fin du jeu sur ce tour (temps écoulé ou victoire) : plus rien ne bouge.
      function stopPlay() {
        clearTimer()
        running = false
        wipe.finish()
        setActionsEnabled(false)
        $("pauseBtn").disabled = true
      }

      function setActionsEnabled(enabled) {
        for (const id of ["foundBtn", "tabooBtn", "skipBtn"]) {
          $(id).disabled = !enabled
        }
      }

      const FEEDBACK = {
        found: COLORS.green,
        taboo: COLORS.red,
        skip: COLORS.cyan,
      }

      // Un coup joué : le son, l'onde dans la trame, l'onomatopée, puis la
      // carte suivante si la partie continue.
      function feedback(kind, button) {
        const color = FEEDBACK[kind]
        waveFrom(button, color)
        play(kind)
        popSfx(pick(SFX[kind]), color)
        if (kind === "taboo" && !reduceMotion) {
          $("card").animate(
            [
              { transform: "translateX(0)" },
              { transform: "translateX(-12px) rotate(-1.5deg)" },
              { transform: "translateX(10px) rotate(1deg)" },
              { transform: "translateX(-6px)" },
              { transform: "translateX(0)" },
            ],
            { duration: 380, easing: "ease-out" },
          )
        }
      }

      function score(delta, button) {
        if (!running) return
        const kind = delta > 0 ? "found" : "taboo"
        feedback(kind, button)
        scores[currentTeam] = Math.max(0, scores[currentTeam] + delta)
        roundPoints += delta
        updateScores()
        floatPoint(delta)
        if (scores[currentTeam] >= target) {
          stopPlay()
          // Le temps de voir l'onomatopée avant la victoire.
          setTimeout(() => endGame(currentTeam), 700)
          return
        }
        drawCard(FEEDBACK[kind])
      }

      // « +1 » ou « −1 » qui s'envole de la case de l'équipe.
      function floatPoint(delta) {
        const box = scoreBoxes[currentTeam]
        const points = box.querySelector(".points")
        if (reduceMotion) return
        points.animate(
          [{ transform: "scale(1.5)" }, { transform: "scale(1)" }],
          { duration: 350, easing: "ease-out" },
        )
        const tag = document.createElement("span")
        tag.className = "float-point"
        tag.textContent = delta > 0 ? "+1" : "−1"
        tag.style.color = delta > 0 ? COLORS.green : COLORS.red
        box.appendChild(tag)
        tag.animate(
          [
            { transform: "translate(-50%, 0) scale(0.6)", opacity: 1 },
            { transform: "translate(-50%, -34px) scale(1.3)", opacity: 0 },
          ],
          { duration: 800, easing: "ease-out" },
        ).onfinish = () => tag.remove()
      }

      const scoreBoxes = [$("scoreTeam1"), $("scoreTeam2")]

      function updateScores() {
        scoreBoxes.forEach((box, team) => {
          box.querySelector(".points").textContent = scores[team]
          box.classList.toggle("active", team === currentTeam)
        })
      }

      function updateTimer() {
        $("timerValue").textContent = Math.max(0, timeLeft)
        $("timer").classList.toggle("urgent", timeLeft <= 10)
      }

      function scoreboardHtml() {
        return [0, 1]
          .map(
            (team) =>
              `<div class="side t${team + 1}"><span>${teamName(team)}</span><strong>${scores[team]}</strong></div>`,
          )
          .join(`<div class="vs">contre</div>`)
      }

      // Un grand éclat en haut d'un écran de résultat, qui claque en entrant.
      function slamBurst(el, text, color) {
        el.innerHTML = burstSvg(text, color)
        if (reduceMotion) return
        el.animate(
          [
            { transform: "scale(0.3) rotate(-18deg)", opacity: 0 },
            { transform: "scale(1.12) rotate(3deg)", opacity: 1, offset: 0.6 },
            { transform: "scale(1) rotate(0)", opacity: 1 },
          ],
          { duration: 500, easing: "ease-out" },
        )
      }

      function endRound() {
        stopPlay()
        play("ring")
        popSfx("DRIIING !", TEAM_COLORS[currentTeam], 1200)
        if (window.ExitGuard) ExitGuard.setActive(false)
        // La sonnerie éclate sur la carte, puis on passe au bilan.
        setTimeout(showRoundEnd, 1150)
      }

      function showRoundEnd() {
        const played = currentTeam
        currentTeam = currentTeam === 0 ? 1 : 0
        updateScores()

        $("roundEndTitle").innerHTML = `${teamChip(played)} marque`
        $("roundPoints").textContent =
          (roundPoints > 0 ? "+" : roundPoints < 0 ? "−" : "") +
          Math.abs(roundPoints)
        $("roundPoints").style.color = roundPoints < 0 ? COLORS.red : INK
        $("roundScoreboard").innerHTML = scoreboardHtml()
        const next = $("nextRoundBtn")
        next.className = `btn next-team t${currentTeam + 1}`
        next.innerHTML =
          PLAY_ICON + `Au tour de l'${teamName(currentTeam).toLowerCase()}`
        show(roundEndScreen)
        slamBurst($("roundBurst"), "FIN DU TOUR !", COLORS.yellow)
      }

      function endGame(winner) {
        if (window.ExitGuard) ExitGuard.setActive(false)
        $("winnerTitle").innerHTML =
          `${teamChip(winner)}<br />gagne la partie !`
        $("finalScoreboard").innerHTML = scoreboardHtml()
        show(gameEndScreen)
        slamBurst($("winBurst"), "KAPOW !", TEAM_COLORS[winner])
        play("win")
        showConfetti()
      }

      // --- Branchements ----------------------------------------------------
      $("startBtn").addEventListener("click", startGame)
      $("replayBtn").addEventListener("click", startGame)
      $("nextRoundBtn").addEventListener("click", startRound)
      $("foundBtn").addEventListener("click", (e) => score(1, e.currentTarget))
      $("tabooBtn").addEventListener("click", (e) => score(-1, e.currentTarget))
      $("skipBtn").addEventListener("click", (e) => {
        if (!running) return
        feedback("skip", e.currentTarget)
        drawCard(FEEDBACK.skip)
      })
      $("pauseBtn").addEventListener("click", togglePause)

      // Écran d'accueil : aucune partie en cours.
      if (window.ExitGuard) ExitGuard.setActive(false)
      loadCards()
    </script>
    <script src="confetti.js"></script>
    <script src="wake-lock.js"></script>
  </body>
</html>
