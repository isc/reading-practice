<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
    <style>
      /* Les portails : chaque carte est un tourbillon de lumière qui
         s'ouvre sur un petit monde, avec son image. Une paire trouvée
         s'envole en étincelles vers la collection, en haut. */

      @font-face {
        font-family: "Unbounded";
        src: url("Unbounded-Variable.woff2") format("woff2");
        font-weight: 400 800;
        font-display: swap;
      }

      @font-face {
        font-family: "Lexend";
        src: url("Lexend-Variable.woff2") format("woff2");
        font-weight: 300 700;
        font-display: swap;
      }

      :root {
        --deep: #14061f;
        --plum: #2b0c3f;
        --pink: #ff4fa3;
        --gold: #ffc94a;
        --violet: #8b5cff;
        --text: #fff1f8;
        --muted: #c8a6d9;
        --veil: rgba(255, 255, 255, 0.07);
        --edge: rgba(255, 255, 255, 0.16);
        --title: "Unbounded", "Arial Black", system-ui, sans-serif;
        --font: "Lexend", "Trebuchet MS", system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(60% 40% at 15% 10%, #5a1658aa, transparent 70%),
          radial-gradient(55% 45% at 90% 85%, #3a1a7aaa, transparent 70%),
          radial-gradient(ellipse at 50% 50%, var(--plum), var(--deep) 75%);
        background-attachment: fixed;
        background-color: var(--deep);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      button {
        font-family: inherit;
        color: inherit;
        touch-action: manipulation;
        cursor: pointer;
      }

      .app {
        max-width: 520px;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
      }

      .screen {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .hidden {
        display: none !important;
      }

      /* Les étincelles volent au-dessus de tout, sans gêner le toucher. */
      #sparks {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10;
      }

      /* ===== Le portail =====
         Un seul élément tourne (.vortex : l'anneau et ses bras de
         lumière) ; le monde s'ouvre par-dessus en grandissant. */

      .portal {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border: none;
        background: none;
        border-radius: 50%;
        container-type: inline-size;
      }

      .portal::before {
        content: "";
        position: absolute;
        inset: 3%;
        border-radius: 50%;
        box-shadow:
          0 0 14px 1px color-mix(in srgb, var(--pink) 55%, transparent),
          inset 0 0 10px color-mix(in srgb, var(--gold) 45%, transparent);
        transition: opacity 0.5s;
      }

      .vortex {
        position: absolute;
        inset: 4%;
        border-radius: 50%;
        background: conic-gradient(
          var(--pink),
          var(--gold),
          #fff3c4,
          var(--pink) 45%,
          var(--violet) 70%,
          var(--pink)
        );
        animation: spin var(--spin, 7s) linear infinite;
        animation-delay: var(--phase, 0s);
        transition: opacity 0.6s;
      }

      .vortex svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @keyframes spin {
        to {
          transform: rotate(-360deg);
        }
      }

      /* Le monde derrière le portail : une bulle de couleur propre à
         l'image (les deux mondes d'une paire sont pareils). */
      .world {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 50% 36%,
          hsl(var(--hue) 100% 93%),
          hsl(var(--hue) 90% 74%) 52%,
          hsl(var(--hue) 70% 50%)
        );
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
        transform: scale(0) rotate(-150deg);
        opacity: 0;
        transition:
          transform 0.45s cubic-bezier(0.2, 1.35, 0.45, 1),
          opacity 0.2s;
      }

      .pic,
      .slot span {
        font-family:
          "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      }

      .pic {
        font-size: 48cqw;
        line-height: 1;
      }

      .portal.open .world {
        transform: none;
        opacity: 1;
      }

      /* L'éclair d'ouverture : un cercle qui s'élargit et s'éteint. */
      .flash {
        position: absolute;
        inset: 4%;
        border-radius: 50%;
        border: 2px solid #fff;
        opacity: 0;
        pointer-events: none;
      }

      .portal.found .world {
        box-shadow:
          inset 0 0 0 2px #fff,
          0 0 18px 4px hsl(var(--hue) 100% 75%);
      }

      /* Paire envolée : le monde se referme en un point, il ne reste
         qu'une trace du portail, immobile. */
      .portal.gone {
        pointer-events: none;
      }

      .portal.gone .world {
        transform: scale(0.1);
        opacity: 0;
        transition:
          transform 0.35s ease-in,
          opacity 0.35s ease-in;
      }

      .portal.gone .vortex {
        opacity: 0.13;
        animation-play-state: paused;
      }

      .portal.gone::before {
        opacity: 0;
      }

      /* ===== Accueil ===== */

      #home {
        justify-content: center;
        gap: 18px;
      }

      .title {
        font-family: var(--title);
        font-weight: 800;
        font-size: clamp(2.4rem, 13vw, 3.4rem);
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .title span {
        background: linear-gradient(180deg, #fff, var(--gold) 55%, var(--pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Le « o » de Memory est un portail. */
      .title .portal {
        width: 0.78em;
        margin: 0.06em 0.04em 0;
        pointer-events: none;
      }

      .tagline {
        text-align: center;
        font-size: 1.1rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .levels {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .level {
        display: grid;
        grid-template-columns: 58px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-radius: 22px;
        border: 1px solid var(--edge);
        background: var(--veil);
        text-align: left;
      }

      .level:active {
        transform: scale(0.98);
      }

      @media (hover: hover) {
        .level:hover {
          border-color: color-mix(in srgb, var(--pink) 60%, transparent);
        }
      }

      /* Un aperçu du plateau : autant de petits portails que de cartes. */
      .preview {
        display: grid;
        gap: 3px;
        width: 58px;
      }

      .preview i {
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--plum) 45%,
          var(--pink) 50%,
          var(--gold)
        );
      }

      .level-name {
        font-family: var(--title);
        font-weight: 700;
        font-size: 1.2rem;
        display: block;
      }

      .level-pairs {
        font-size: 0.95rem;
        color: var(--muted);
      }

      .best {
        display: grid;
        justify-items: end;
        gap: 2px;
        font-size: 0.9rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .best b {
        color: var(--gold);
        font-weight: 600;
      }

      .won {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
      }

      .won svg {
        width: 20px;
        height: 20px;
        color: var(--gold);
      }

      .won b {
        color: var(--text);
      }

      /* ===== Partie ===== */

      /* Trois colonnes, celle du milieu centrée : le chrono ne fait pas
         bouger les boutons. */
      .bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }

      .icon-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--edge);
        background: var(--veil);
        display: grid;
        place-items: center;
      }

      .icon-btn svg {
        width: 24px;
        height: 24px;
      }

      #soundBtn {
        justify-self: end;
      }

      #timer {
        font-family: var(--title);
        font-weight: 600;
        font-size: 1.5rem;
        font-variant-numeric: tabular-nums;
        min-width: 4.4em;
        text-align: center;
      }

      .counts {
        display: flex;
        justify-content: space-between;
        font-size: 1rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .counts b {
        font-family: var(--title);
        font-weight: 600;
        font-size: 1.25em;
        color: var(--text);
      }

      /* La collection : une place par paire, où chaque paire envolée
         vient se poser. */
      .tray {
        display: grid;
        grid-template-columns: repeat(var(--pairs), minmax(0, 34px));
        justify-content: center;
        gap: 4px;
      }

      .slot {
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.25);
        display: grid;
        place-items: center;
        container-type: inline-size;
      }

      .slot.filled {
        border: none;
        background: radial-gradient(
          circle at 50% 38%,
          hsl(var(--hue) 100% 92%),
          hsl(var(--hue) 80% 62%)
        );
        box-shadow: 0 0 10px hsl(var(--hue) 100% 70% / 0.7);
        animation: land 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
      }

      .slot span {
        font-size: 62cqw;
        line-height: 1;
      }

      @keyframes land {
        from {
          transform: scale(0.3);
        }
      }

      /* La collection et le plateau, ensemble au milieu de la place
         libre. */
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .tray {
        width: 100%;
      }

      /* Le cadre a exactement la taille du plateau : la fin de partie
         s'y cale. */
      .frame {
        position: relative;
      }

      .board {
        display: grid;
        gap: var(--gap);
        grid-template-columns: repeat(var(--cols), var(--cell));
      }

      /* ===== Fin de partie ===== */

      .end {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        border: 1px solid var(--edge);
        background: radial-gradient(
          circle at 50% 30%,
          rgba(70, 18, 90, 0.96),
          rgba(20, 6, 31, 0.97)
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 3vh, 22px);
        padding: 14px;
        animation: open-end 0.5s cubic-bezier(0.2, 1.3, 0.4, 1);
      }

      @keyframes open-end {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
      }

      .bravo {
        font-family: var(--title);
        font-weight: 800;
        font-size: clamp(1.8rem, 9vw, 2.6rem);
        background: linear-gradient(180deg, #fff, var(--gold) 55%, var(--pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Deux tuiles côte à côte, de même hauteur. */
      .tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: min(100%, 300px);
      }

      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 12px 6px 10px;
        border-radius: 18px;
        border: 1px solid var(--edge);
        background: var(--veil);
        font-variant-numeric: tabular-nums;
      }

      .tile b {
        font-family: var(--title);
        font-weight: 700;
        font-size: 1.6rem;
      }

      .tile span {
        color: var(--muted);
      }

      .tile.record {
        border-color: var(--gold);
        box-shadow: 0 0 16px color-mix(in srgb, var(--gold) 40%, transparent);
      }

      /* Le trophée d'un record : sur le bord de la tuile. */
      .trophy {
        position: absolute;
        top: -14px;
        right: -8px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--gold);
        color: var(--deep);
        display: none;
        place-items: center;
        animation: land 0.5s 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) backwards;
      }

      .tile.record .trophy {
        display: grid;
      }

      .trophy svg {
        width: 20px;
        height: 20px;
      }

      .glow-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--title);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--deep);
        background: linear-gradient(180deg, #fff3c4, var(--gold));
        border: none;
        border-radius: 999px;
        padding: 14px 28px;
        box-shadow: 0 0 22px color-mix(in srgb, var(--gold) 50%, transparent);
      }

      .glow-btn svg {
        width: 22px;
        height: 22px;
      }

      .glow-btn:active {
        transform: scale(0.96);
      }

      @media (prefers-reduced-motion: reduce) {
        .vortex {
          animation: none;
        }

        .world,
        .portal.gone .world {
          transform: none;
          transition: opacity 0.25s;
        }

        .slot.filled,
        .end,
        .trophy {
          animation: none;
        }
      }
    </style>
    <script src="exit-guard.js"></script>
  </head>
  <body>
    <!-- Le tourbillon, dessiné une fois : un vide sombre avec une lumière au
         fond, et trois bras qui s'enroulent (tracés au chargement). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <radialGradient id="void">
          <stop offset="0" stop-color="#ffd3ec" />
          <stop offset="0.16" stop-color="#ff6fb5" stop-opacity="0.75" />
          <stop offset="0.45" stop-color="#3a1052" />
          <stop offset="1" stop-color="#14061f" />
        </radialGradient>
        <symbol id="swirl" viewBox="-50 -50 100 100">
          <circle r="44" fill="url(#void)" />
          <g id="arms" fill="none" stroke-linecap="round"></g>
        </symbol>
      </defs>
    </svg>

    <canvas id="sparks"></canvas>

    <div class="app">
      <section class="screen" id="home">
        <h1 class="title" aria-label="Memory">
          <span>Mem</span>
          <i class="portal" aria-hidden="true"></i>
          <span>ry</span>
        </h1>
        <p class="tagline">
          Ouvre les portails deux par deux.<br />
          Deux images pareilles ? Elles s'envolent !
        </p>
        <div class="levels" id="levels"></div>
        <p class="won">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"
            />
          </svg>
          Parties gagnées : <b id="gamesWon">0</b>
        </p>
      </section>

      <section class="screen hidden" id="game">
        <div class="bar">
          <button class="icon-btn" id="backBtn" aria-label="Retour aux niveaux">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
          <div id="timer">00:00</div>
          <button class="icon-btn" id="soundBtn" aria-label="Petits sons">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" />
              <path
                class="on"
                d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"
              />
              <path class="off" d="M16 9.5l5 5M21 9.5l-5 5" />
            </svg>
          </button>
        </div>
        <div class="counts">
          <span><b id="moves">0</b> <span id="movesLabel">coup</span></span>
          <span><b id="pairs">0</b>/<span id="total">8</span> paires</span>
        </div>
        <div class="stage" id="stage">
          <div class="tray" id="tray"></div>
          <div class="frame">
            <div class="board" id="board"></div>
            <div class="end hidden" id="end">
              <p class="bravo">Bravo !</p>
              <div class="tiles">
                <div class="tile" id="movesTile">
                  <b id="endMoves">0</b><span>coups</span>
                  <i class="trophy"
                    ><svg
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <path
                        d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.5A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.5 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 9zm10 0v2c0 .3 0 .5-.2.8A2 2 0 0 0 18 8V7z"
                      /></svg
                  ></i>
                </div>
                <div class="tile" id="timeTile">
                  <b id="endTime">00:00</b><span>temps</span>
                  <i class="trophy"
                    ><svg
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <path
                        d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.5A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.5 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 9zm10 0v2c0 .3 0 .5-.2.8A2 2 0 0 0 18 8V7z"
                      /></svg
                  ></i>
                </div>
              </div>
              <button class="glow-btn" id="againBtn">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" />
                  <path d="M4 4v4.5h4.5" />
                </svg>
                Rejouer
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="voix.js"></script>
    <script>
      const SCORES_KEY = "memory-scores"
      const SOUND_KEY = "memory-sound"
      const DEFAULT_SCORES = {
        bestMoves: { facile: null, moyen: null, difficile: null },
        bestTime: { facile: null, moyen: null, difficile: null },
        gamesWon: 0,
      }

      const LEVELS = {
        facile: { rows: 3, cols: 4, pairs: 6, label: "Facile" },
        moyen: { rows: 4, cols: 4, pairs: 8, label: "Moyen" },
        difficile: { rows: 6, cols: 6, pairs: 18, label: "Difficile" },
      }

      const EMOJIS = [
        "🐶",
        "🐱",
        "🐭",
        "🐰",
        "🦊",
        "🐻",
        "🐼",
        "🦁",
        "🐯",
        "🐨",
        "🐸",
        "🐵",
        "🦄",
        "🐔",
        "🦋",
        "🌻",
        "🍎",
        "🍌",
        "🍓",
        "🍇",
        "🥕",
        "🍕",
        "🍔",
        "🍦",
        "🚀",
        "🚗",
        "⚽",
        "🎈",
        "🎁",
        "⭐",
        "🌈",
        "❤️",
      ]

      // Chaque image a la couleur de son monde : l'angle d'or les écarte
      // bien les unes des autres.
      const hueOf = (symbol) => Math.round(EMOJIS.indexOf(symbol) * 137.5) % 360

      const $ = (id) => document.getElementById(id)
      const reducedMotion = () =>
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

      let level = "moyen"
      let cards = []
      let firstCard = null
      let secondCard = null
      let lockBoard = false
      let moves = 0
      let matched = 0
      let startTime = null
      let timerInterval = null
      // Change à chaque partie : une animation d'une partie quittée ne
      // touche pas à la suivante.
      let round = 0

      function shuffle(arr) {
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[a[i], a[j]] = [a[j], a[i]]
        }
        return a
      }

      // ===== Le tourbillon =====

      // Trois bras en spirale, chacun en deux traits : un large et
      // translucide, un fin et clair.
      function drawArms() {
        const arms = []
        for (let k = 0; k < 3; k++) {
          let d = ""
          for (let i = 0; i <= 24; i++) {
            const t = i / 24
            const r = 5 + 37 * t
            const a = (k * 2 * Math.PI) / 3 + t * 2.8
            d += `${i ? "L" : "M"}${(r * Math.cos(a)).toFixed(1)} ${(r * Math.sin(a)).toFixed(1)}`
          }
          arms.push(
            `<path d="${d}" stroke="#ff6fb5" stroke-opacity="0.35" stroke-width="7"/>`,
            `<path d="${d}" stroke="#ffe3f2" stroke-opacity="0.75" stroke-width="1.6"/>`,
          )
        }
        $("arms").innerHTML = arms.join("")
      }

      const VORTEX = `<span class="vortex"><svg><use href="#swirl"/></svg></span>`

      // Les portails ne tournent pas tous ensemble : chacun a sa vitesse et
      // son départ.
      function vortexStyle(el) {
        el.style.setProperty("--spin", `${6 + Math.random() * 3}s`)
        el.style.setProperty("--phase", `${-Math.random() * 9}s`)
      }

      // ===== Accueil =====

      function renderHome() {
        const scores = getScores()
        $("levels").innerHTML = Object.entries(LEVELS)
          .map(([key, { rows, cols, pairs, label }]) => {
            const m = scores.bestMoves[key]
            const t = scores.bestTime[key]
            const best =
              m === null ? "" : `<b>${m} coups</b><span>${formatTime(t)}</span>`
            return `
              <button class="level" data-level="${key}">
                <span class="preview" style="grid-template-columns: repeat(${cols}, 1fr)">${"<i></i>".repeat(rows * cols)}</span>
                <span><span class="level-name">${label}</span><span class="level-pairs">${pairs} paires</span></span>
                <span class="best">${best}</span>
              </button>`
          })
          .join("")
        $("gamesWon").textContent = scores.gamesWon
      }

      // Quitte la partie en cours : plus de chrono, plus d'animation en
      // vol, et rien à garder à la sortie.
      function endRound() {
        round++
        sparks = []
        clearInterval(timerInterval)
        timerInterval = null
        if (window.ExitGuard) ExitGuard.setActive(false)
      }

      function showHome() {
        endRound()
        renderHome()
        $("game").classList.add("hidden")
        $("home").classList.remove("hidden")
      }

      function startLevel(newLevel) {
        level = newLevel
        $("home").classList.add("hidden")
        $("game").classList.remove("hidden")
        initGame()
      }

      // ===== Partie =====

      function initGame() {
        // Nouvelle partie : rien n'est encore joué, on ne garde pas la sortie.
        endRound()
        const config = LEVELS[level]
        const symbols = shuffle(EMOJIS).slice(0, config.pairs)
        const deck = shuffle([...symbols, ...symbols])

        cards = deck.map((sym, i) => ({
          id: i,
          symbol: sym,
          matched: false,
          revealed: false,
        }))
        firstCard = null
        secondCard = null
        lockBoard = false
        moves = 0
        matched = 0
        startTime = null

        $("end").classList.add("hidden")
        $("total").textContent = config.pairs
        renderBoard()
        updateStats()
      }

      function renderBoard() {
        const board = $("board")
        board.innerHTML = ""
        cards.forEach((card) => {
          const el = document.createElement("button")
          el.className = "portal"
          el.dataset.id = card.id
          el.setAttribute("aria-label", `Portail ${card.id + 1}`)
          el.style.setProperty("--hue", hueOf(card.symbol))
          vortexStyle(el)
          el.innerHTML = `${VORTEX}<span class="world"><span class="pic">${card.symbol}</span></span><span class="flash"></span>`
          el.onclick = () => flipCard(card.id)
          board.appendChild(el)
        })

        const tray = $("tray")
        tray.style.setProperty("--pairs", LEVELS[level].pairs)
        tray.innerHTML = '<span class="slot"></span>'.repeat(
          LEVELS[level].pairs,
        )
        layoutBoard()
      }

      // Les portails prennent toute la place libre, sans jamais dépasser :
      // le plateau tient sans défiler.
      function layoutBoard() {
        const { rows, cols } = LEVELS[level]
        const stage = $("stage")
        const gap = cols > 4 ? 6 : 10
        const cell = Math.floor(
          Math.min(
            (stage.clientWidth - gap * (cols - 1)) / cols,
            (stage.clientHeight -
              $("tray").offsetHeight -
              16 -
              gap * (rows - 1)) /
              rows,
            120,
          ),
        )
        const board = $("board")
        board.style.setProperty("--cols", cols)
        board.style.setProperty("--cell", `${cell}px`)
        board.style.setProperty("--gap", `${gap}px`)
      }

      const getCardEl = (id) => $("board").children[id]

      function flipCard(id) {
        if (lockBoard) return
        const card = cards[id]
        if (card.matched || card.revealed) return

        if (!startTime) {
          startTime = Date.now()
          timerInterval = setInterval(updateStats, 1000)
          // Premier portail ouvert : la partie est engagée.
          if (window.ExitGuard) ExitGuard.setActive(true)
        }

        card.revealed = true
        openPortal(getCardEl(id))

        if (!firstCard) {
          firstCard = card
          return
        }

        secondCard = card
        moves++
        updateStats()

        if (firstCard.symbol === secondCard.symbol) {
          firstCard.matched = true
          secondCard.matched = true
          matched++
          const won = matched === LEVELS[level].pairs
          pairFound(firstCard, secondCard, matched - 1, won)
          firstCard = null
          secondCard = null
          updateStats()
          if (won) handleWin()
        } else {
          lockBoard = true
          const a = firstCard
          const b = secondCard
          const r = round
          setTimeout(() => {
            if (r !== round) return
            a.revealed = false
            b.revealed = false
            closePortals(getCardEl(a.id), getCardEl(b.id))
            firstCard = null
            secondCard = null
            lockBoard = false
          }, 750)
        }
      }

      function openPortal(el) {
        el.classList.add("open")
        play(openSound, 600)
        if (reducedMotion()) return
        el.querySelector(".flash").animate(
          [
            { transform: "scale(0.7)", opacity: 0.9 },
            { transform: "scale(1.3)", opacity: 0 },
          ],
          { duration: 450, easing: "ease-out" },
        )
      }

      // Pas pareilles : les deux mondes tremblent, puis le tourbillon les
      // reprend.
      async function closePortals(...els) {
        play(missSound, 800)
        if (!reducedMotion()) {
          await Promise.all(
            els.map(
              (el) =>
                el
                  .querySelector(".world")
                  .animate(
                    [
                      { transform: "rotate(0)" },
                      { transform: "rotate(-12deg)" },
                      { transform: "rotate(10deg)" },
                      { transform: "rotate(-6deg)" },
                      { transform: "rotate(0)" },
                    ],
                    { duration: 320, easing: "ease-in-out" },
                  ).finished,
            ),
          )
        }
        els.forEach((el) => {
          if (!cards[el.dataset.id].revealed) el.classList.remove("open")
        })
      }

      // Une paire : les deux mondes brillent, puis s'envolent en étincelles
      // jusqu'à leur place dans la collection.
      async function pairFound(a, b, slotIndex, won) {
        const r = round
        const els = [getCardEl(a.id), getCardEl(b.id)]
        const slot = $("tray").children[slotIndex]
        const hue = hueOf(a.symbol)
        play(matchSound, won ? 4000 : 2500)
        els.forEach((el) => el.classList.add("found"))

        if (!reducedMotion()) {
          await Promise.all(
            els.map(
              (el) =>
                el
                  .querySelector(".world")
                  .animate(
                    [
                      { transform: "scale(1)" },
                      { transform: "scale(1.14)" },
                      { transform: "scale(1)" },
                    ],
                    { duration: 380, easing: "ease-out" },
                  ).finished,
            ),
          )
          if (r !== round) return
          els.forEach((el) => flyFrom(el, slot, hue))
        }
        els.forEach((el) => el.classList.add("gone"))
        await wait(reducedMotion() ? 200 : 900)
        if (r !== round) return

        slot.classList.add("filled")
        slot.style.setProperty("--hue", hue)
        slot.innerHTML = `<span>${a.symbol}</span>`

        if (won) {
          await wait(300)
          if (r !== round) return
          play(winSound, 2500)
          if (!reducedMotion()) celebrate()
          $("end").classList.remove("hidden")
        }
      }

      function handleWin() {
        clearInterval(timerInterval)
        if (window.ExitGuard) ExitGuard.setActive(false)
        const elapsed = Date.now() - startTime
        const improved = saveScore(moves, elapsed)
        $("endMoves").textContent = moves
        $("endTime").textContent = formatTime(elapsed)
        $("movesTile").classList.toggle("record", improved.includes("coups"))
        $("timeTile").classList.toggle("record", improved.includes("temps"))
      }

      function updateStats() {
        const elapsed = startTime ? Date.now() - startTime : 0
        $("timer").textContent = formatTime(elapsed)
        $("moves").textContent = moves
        $("movesLabel").textContent = moves > 1 ? "coups" : "coup"
        $("pairs").textContent = matched
      }

      function formatTime(ms) {
        const minutes = Math.floor(ms / 60000)
        const seconds = Math.floor((ms % 60000) / 1000)
        return `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`
      }

      // ===== Scores (même clé et même forme qu'avant) =====

      function getScores() {
        const stored = localStorage.getItem(SCORES_KEY)
        if (!stored) return JSON.parse(JSON.stringify(DEFAULT_SCORES))
        const parsed = JSON.parse(stored)
        return {
          bestMoves: {
            ...DEFAULT_SCORES.bestMoves,
            ...(parsed.bestMoves || {}),
          },
          bestTime: { ...DEFAULT_SCORES.bestTime, ...(parsed.bestTime || {}) },
          gamesWon: parsed.gamesWon || 0,
        }
      }

      function saveScore(movesCount, elapsedMs) {
        const scores = getScores()
        const improved = []
        if (
          scores.bestMoves[level] === null ||
          movesCount < scores.bestMoves[level]
        ) {
          scores.bestMoves[level] = movesCount
          improved.push("coups")
        }
        if (
          scores.bestTime[level] === null ||
          elapsedMs < scores.bestTime[level]
        ) {
          scores.bestTime[level] = elapsedMs
          improved.push("temps")
        }
        scores.gamesWon++
        localStorage.setItem(SCORES_KEY, JSON.stringify(scores))
        return improved
      }

      // ===== Les étincelles =====
      // Dessinées sur un canevas, qui ne tourne que tant qu'il en reste.

      const canvas = $("sparks")
      const ctx2d = canvas.getContext("2d")
      let sparks = []
      let sparksRunning = false

      function sizeCanvas() {
        const dpr = window.devicePixelRatio || 1
        canvas.width = innerWidth * dpr
        canvas.height = innerHeight * dpr
        ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0)
      }

      const center = (el) => {
        const box = el.getBoundingClientRect()
        return {
          x: box.left + box.width / 2,
          y: box.top + box.height / 2,
          r: box.width / 2,
        }
      }

      const sparkColor = (hue) =>
        [`hsl(${hue} 100% 72%)`, `hsl(${hue} 100% 85%)`, "#fff", "#ffd36b"][
          Math.floor(Math.random() * 4)
        ]

      // Le monde éclate en grains de lumière, qui s'écartent puis se
      // rejoignent sur leur place dans la collection.
      function flyFrom(el, slot, hue) {
        const from = center(el)
        const to = center(slot)
        const now = performance.now()
        for (let i = 0; i < 38; i++) {
          const a = Math.random() * 2 * Math.PI
          const d = Math.random() * from.r * 0.8
          const x0 = from.x + Math.cos(a) * d
          const y0 = from.y + Math.sin(a) * d
          const spread = 50 + Math.random() * 70
          sparks.push({
            flight: true,
            start: now + Math.random() * 180,
            duration: 650 + Math.random() * 350,
            x0,
            y0,
            cx: Math.min(
              Math.max(x0 + Math.cos(a) * spread, 12),
              innerWidth - 12,
            ),
            cy: y0 + Math.sin(a) * spread - 40,
            x1: to.x + (Math.random() - 0.5) * to.r,
            y1: to.y + (Math.random() - 0.5) * to.r,
            size: 1.2 + Math.random() * 2,
            color: sparkColor(hue),
          })
        }
        runSparks()
      }

      // La victoire : la collection fait la vague, et chaque image lance
      // une gerbe de sa couleur, de gauche à droite.
      function celebrate() {
        const slots = [...$("tray").children]
        const now = performance.now()
        const perSlot = Math.ceil(180 / slots.length)
        slots.forEach((slot, n) => {
          const delay = n * 70
          slot.animate(
            [
              { transform: "none" },
              { transform: "translateY(-10px) scale(1.2)" },
              { transform: "none" },
            ],
            { duration: 420, delay, easing: "ease-out" },
          )
          const { x, y } = center(slot)
          const hue = slot.style.getPropertyValue("--hue")
          for (let i = 0; i < perSlot; i++) {
            const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4
            const v = 0.15 + Math.random() * 0.35
            sparks.push({
              start: now + delay + Math.random() * 120,
              duration: 1200 + Math.random() * 800,
              x0: x,
              y0: y,
              vx: Math.cos(a) * v,
              vy: Math.sin(a) * v,
              size: 1.3 + Math.random() * 2.2,
              color: sparkColor(hue),
            })
          }
        })
        runSparks()
      }

      const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2)

      function sparkAt(s, p) {
        if (s.flight) {
          const e = easeInOut(Math.min(Math.max(p, 0), 1))
          const u = 1 - e
          return {
            x: u * u * s.x0 + 2 * u * e * s.cx + e * e * s.x1,
            y: u * u * s.y0 + 2 * u * e * s.cy + e * e * s.y1,
          }
        }
        const t = Math.max(p, 0) * s.duration
        return { x: s.x0 + s.vx * t, y: s.y0 + s.vy * t + 0.00035 * t * t }
      }

      function drawSparks(now) {
        ctx2d.clearRect(0, 0, innerWidth, innerHeight)
        ctx2d.globalCompositeOperation = "lighter"
        sparks = sparks.filter((s) => now < s.start + s.duration)
        for (const s of sparks) {
          const p = (now - s.start) / s.duration
          if (p < 0) continue
          const fade = s.flight ? Math.min(1, (1 - p) * 5) : 1 - p
          ctx2d.fillStyle = s.color
          // Une traînée : la même étincelle un peu plus tôt, plus pâle.
          for (let k = 3; k >= 0; k--) {
            const { x, y } = sparkAt(s, p - k * 0.035)
            ctx2d.globalAlpha = fade * (1 - k * 0.25) * 0.8
            ctx2d.beginPath()
            ctx2d.arc(x, y, s.size * (1 - k * 0.15), 0, 2 * Math.PI)
            ctx2d.fill()
          }
          const { x, y } = sparkAt(s, p)
          ctx2d.globalAlpha = fade * 0.2
          ctx2d.beginPath()
          ctx2d.arc(x, y, s.size * 3.2, 0, 2 * Math.PI)
          ctx2d.fill()
        }
        ctx2d.globalAlpha = 1
        if (sparks.length) requestAnimationFrame(drawSparks)
        else sparksRunning = false
      }

      function runSparks() {
        if (sparksRunning) return
        sparksRunning = true
        requestAnimationFrame(drawSparks)
      }

      // ===== Les petits sons =====
      // Joués par le contexte de voix.js, réveillé dans le geste de l'enfant
      // (sinon l'iPhone reste muet).

      let soundOn = true
      try {
        soundOn = localStorage.getItem(SOUND_KEY) !== "off"
      } catch (e) {
        // navigation privée : le son reste allumé
      }

      function play(sound, ms) {
        if (!soundOn) return
        const ctx = Voice.wake(ms)
        if (ctx) sound(ctx, ctx.currentTime)
      }

      function tone(
        ctx,
        t,
        freq,
        { to = freq, dur = 0.4, type = "sine", vol = 0.1 } = {},
      ) {
        const osc = ctx.createOscillator()
        const gain = ctx.createGain()
        osc.type = type
        osc.frequency.setValueAtTime(freq, t)
        osc.frequency.exponentialRampToValueAtTime(to, t + dur)
        gain.gain.setValueAtTime(0, t)
        gain.gain.linearRampToValueAtTime(vol, t + 0.02)
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur)
        osc.connect(gain)
        gain.connect(ctx.destination)
        osc.start(t)
        osc.stop(t + dur + 0.05)
      }

      // Un souffle : du bruit, passé dans un filtre qui monte.
      let noise = null
      function whoosh(ctx, t, dur, vol) {
        if (!noise) {
          noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate)
          const data = noise.getChannelData(0)
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1
        }
        const src = ctx.createBufferSource()
        const filter = ctx.createBiquadFilter()
        const gain = ctx.createGain()
        src.buffer = noise
        filter.type = "bandpass"
        filter.Q.value = 3
        filter.frequency.setValueAtTime(500, t)
        filter.frequency.exponentialRampToValueAtTime(4000, t + dur)
        gain.gain.setValueAtTime(0, t)
        gain.gain.linearRampToValueAtTime(vol, t + dur * 0.4)
        gain.gain.linearRampToValueAtTime(0, t + dur)
        src.connect(filter)
        filter.connect(gain)
        gain.connect(ctx.destination)
        src.start(t)
        src.stop(t + dur)
      }

      function openSound(ctx, t) {
        tone(ctx, t, 420, { to: 880, dur: 0.25, vol: 0.06 })
        tone(ctx, t + 0.06, 1320, { dur: 0.3, type: "triangle", vol: 0.025 })
      }

      function missSound(ctx, t) {
        tone(ctx, t, 392, { to: 330, dur: 0.25, type: "triangle", vol: 0.07 })
        tone(ctx, t + 0.18, 330, {
          to: 247,
          dur: 0.35,
          type: "triangle",
          vol: 0.07,
        })
      }

      function matchSound(ctx, t) {
        ;[784, 988, 1175, 1568].forEach((f, i) =>
          tone(ctx, t + i * 0.07, f, { dur: 0.5, vol: 0.07 }),
        )
        whoosh(ctx, t + 0.38, 0.9, 0.12)
      }

      function winSound(ctx, t) {
        ;[523, 659, 784, 1047, 1319, 1568].forEach((f, i) =>
          tone(ctx, t + i * 0.08, f, { dur: 0.7, vol: 0.07 }),
        )
        whoosh(ctx, t, 1.4, 0.1)
      }

      function renderSoundBtn() {
        const btn = $("soundBtn")
        btn.setAttribute("aria-pressed", soundOn)
        btn.querySelector(".on").style.display = soundOn ? "" : "none"
        btn.querySelector(".off").style.display = soundOn ? "none" : ""
      }

      function toggleSound() {
        soundOn = !soundOn
        try {
          localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off")
        } catch (e) {
          // navigation privée : le réglage ne sera pas gardé
        }
        renderSoundBtn()
        play(openSound, 600)
      }

      // ===== Démarrage =====

      drawArms()
      const titlePortal = document.querySelector(".title .portal")
      titlePortal.innerHTML = VORTEX
      vortexStyle(titlePortal)

      $("levels").onclick = (e) => {
        const btn = e.target.closest(".level")
        if (!btn) return
        Voice.wake(300)
        startLevel(btn.dataset.level)
      }
      $("backBtn").onclick = showHome
      $("againBtn").onclick = initGame
      $("soundBtn").onclick = toggleSound
      addEventListener("resize", () => {
        sizeCanvas()
        if (!$("game").classList.contains("hidden")) layoutBoard()
      })

      sizeCanvas()
      renderSoundBtn()
      showHome()
    </script>
  </body>
</html>
