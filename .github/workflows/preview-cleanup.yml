name: Cleanup branch preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# Même groupe que deploy.yml et preview.yml, en file (`queue: max`).
# Ce cleanup avait son propre groupe, parce que la fermeture d'une PR coïncide
# avec le merge (push sur main → deploy) et que, dans un groupe partagé sans
# file, le cleanup arrivé en second annulait le déploiement en attente. La file
# garde tous les runs : on sérialise à nouveau toutes les écritures gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview slug
        id: slug
        run: |
          raw='${{ github.head_ref }}'
          slug=$(echo "$raw" | tr -c 'a-zA-Z0-9-' '-' | tr -s '-' | sed 's/^-\|-$//g')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview directory
        run: |
          dir="previews/${{ steps.slug.outputs.slug }}"
          if [ -d "$dir" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git rm -rf "$dir"
            git commit -m "cleanup: remove preview ${{ steps.slug.outputs.slug }}"
            # Filet de secours : la file sérialise déjà les écritures gh-pages,
            # mais rien n'interdit une écriture venue d'ailleurs (push manuel).
            # On retente avec rebase si gh-pages a bougé entre-temps.
            for i in 1 2 3 4 5; do
              if git push origin gh-pages; then
                exit 0
              fi
              echo "Push refusé (tentative $i), rebase sur gh-pages distant…"
              git fetch origin gh-pages
              git rebase origin/gh-pages || exit 1
            done
            echo "::error::Impossible de pousser le cleanup après 5 tentatives"
            exit 1
          else
            echo "No preview directory at $dir, nothing to clean."
          fi

      - name: Update PR comment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: marocchino/sticky-pull-request-comment@v2
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            header: preview-${{ steps.slug.outputs.slug }}
            message: |
              _Preview supprimée_ (PR fermée). L'URL n'est plus accessible.
