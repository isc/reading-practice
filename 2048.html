<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
      /* Orbes de plasma : chaque tuile est une boule de lumière. Deux orbes
         pareils s'attirent (un fil de plasma les relie), et quand ils se
         rencontrent ils fondent l'un dans l'autre comme deux gouttes. Plus
         la valeur monte, plus l'orbe est chaud et brillant : cyan, bleu,
         violet, magenta, rouge, orange, or, puis blanc, puis bleu étoile. */

      @font-face {
        font-family: "Unbounded";
        src: url("Unbounded-Variable.woff2") format("woff2");
        font-weight: 400 800;
        font-display: swap;
      }

      @font-face {
        font-family: "Lexend";
        src: url("Lexend-Variable.woff2") format("woff2");
        font-weight: 300 700;
        font-display: swap;
      }

      :root {
        --space: #07061a;
        --space-2: #15103e;
        --board: #0c0a26;
        --edge: rgba(160, 170, 255, 0.18);
        --text: #eef0ff;
        --muted: #9aa0d8;
        --cyan: #8cf0ff;
        --violet: #c7a6ff;
        --gold: #ffd36b;
        --display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
        --font: "Lexend", "Trebuchet MS", system-ui, sans-serif;
        --board-size: min(calc(100vw - 32px), 440px, calc(100dvh - 300px));
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(60% 40% at 15% 10%, #2a1460aa, transparent 70%),
          radial-gradient(50% 40% at 90% 85%, #0d3a5c99, transparent 70%),
          var(--space);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      .app {
        max-width: 480px;
        margin: 0 auto;
        padding: calc(12px + env(safe-area-inset-top)) 16px
          calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      /* ===== La barre : score, titre, meilleur ===== */

      .bar {
        width: var(--board-size);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: stretch;
        gap: 10px;
      }

      .counter {
        position: relative;
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: linear-gradient(#ffffff10, #ffffff05);
        padding: 7px 6px 8px;
        text-align: center;
      }

      .counter .label {
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      .counter .value {
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.15rem;
        line-height: 1.3;
      }

      /* Les points gagnés s'envolent du score. */
      .gain {
        position: absolute;
        left: 0;
        right: 0;
        top: 30%;
        font-family: var(--display);
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--cyan);
        pointer-events: none;
        animation: gain 0.8s ease-out forwards;
      }

      @keyframes gain {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-34px);
        }
      }

      .title {
        align-self: center;
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.9rem;
        letter-spacing: -0.02em;
        background: linear-gradient(
          100deg,
          var(--cyan),
          var(--violet) 40%,
          #ff8fc8 65%,
          var(--gold)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* ===== Le plateau ===== */

      .board {
        position: relative;
        width: var(--board-size);
        height: var(--board-size);
        border-radius: 26px;
        background:
          radial-gradient(circle at 50% 40%, #1a1650, transparent 75%),
          var(--board);
        border: 1px solid var(--edge);
        box-shadow:
          0 0 0 1px #00000060,
          0 20px 50px -20px #000;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        outline: none;
      }

      /* Les emplacements vides : des anneaux à peine visibles. */
      .sockets {
        position: absolute;
        inset: 3.5%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }

      .sockets span {
        margin: 17%;
        border-radius: 50%;
        border: 1px solid #a0aaff1c;
        background: radial-gradient(circle, #a0aaff14 0 6%, transparent 7%);
      }

      .board canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: opacity 0.8s ease;
      }

      .board.over canvas {
        opacity: 0.3;
      }

      /* La fin de partie, calée sur le plateau. */
      .end {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: radial-gradient(circle, #07061acc, #07061a66 80%);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.6s ease 0.5s,
          visibility 0s linear 1.1s;
      }

      .board.over .end {
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.6s ease 0.5s,
          visibility 0s;
      }

      .end-title {
        font-size: 1.05rem;
        color: var(--muted);
      }

      .end-score {
        font-family: var(--display);
        font-weight: 800;
        font-size: 3rem;
        line-height: 1.1;
        color: #fff;
        text-shadow:
          0 0 18px var(--violet),
          0 0 40px #7a34c8;
      }

      .end-record {
        font-family: var(--display);
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--gold);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .end-record svg {
        width: 18px;
        height: 18px;
      }

      .play {
        margin-top: 14px;
        min-height: 56px;
        padding: 0 28px 0 22px;
        border: none;
        border-radius: 28px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.1rem;
        color: #120a33;
        background: linear-gradient(135deg, var(--cyan), var(--violet));
        box-shadow:
          0 0 24px #8cf0ff66,
          inset 0 1px 0 #ffffff99;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      .play svg {
        width: 22px;
        height: 22px;
      }

      .play:active {
        transform: scale(0.96);
      }

      /* ===== Sous le plateau ===== */

      .message {
        width: var(--board-size);
        min-height: 1.5em;
        text-align: center;
        font-family: var(--display);
        font-weight: 600;
        font-size: 1rem;
        color: var(--gold);
      }

      .message.show {
        animation: rise 0.6s ease-out;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .tray {
        width: var(--board-size);
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
      }

      .chip {
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: #ffffff08;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
      }

      .chip .label {
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.2;
      }

      .chip .value {
        font-family: var(--display);
        font-weight: 600;
        font-size: 1rem;
      }

      /* L'orbe 2048 du compteur : éteint tant qu'il n'a jamais été atteint. */
      .seal {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 0.42rem;
        color: #ffffff40;
        border: 1px dashed #ffffff30;
      }

      .seal.lit {
        border: none;
        color: #5a2a00;
        background: radial-gradient(
          circle at 40% 35%,
          #fff,
          #fff1b8 45%,
          #f2c832
        );
        box-shadow: 0 0 14px #ffd36b;
      }

      .sound {
        width: 52px;
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: #ffffff08;
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .sound svg {
        width: 26px;
        height: 26px;
      }

      .sound .wave {
        transition: opacity 0.2s;
      }

      .sound[aria-pressed="false"] {
        color: var(--muted);
      }

      .sound[aria-pressed="false"] .wave {
        opacity: 0;
      }

      .sound:not([aria-pressed="false"]) .cross {
        opacity: 0;
      }

      /* Comment jouer : trois images plutôt qu'un paragraphe. */
      .howto {
        width: var(--board-size);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.25;
      }

      .howto figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .howto .pic {
        height: 40px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .howto svg {
        width: 44px;
        height: 40px;
        color: var(--cyan);
      }

      .mini {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 0.7rem;
        color: #fff;
        background: radial-gradient(circle at 40% 35%, #8cf0ff, #1b6f96 75%);
        box-shadow: 0 0 10px #8cf0ff88;
      }

      .mini.four {
        background: radial-gradient(circle at 40% 35%, #9cbcff, #2556b8 75%);
        box-shadow: 0 0 12px #9cbcffaa;
      }

      .mini.gold {
        width: 36px;
        height: 36px;
        font-size: 0.55rem;
        color: #5a2a00;
        background: radial-gradient(
          circle at 40% 35%,
          #fff,
          #fff1b8 45%,
          #f2c832
        );
        box-shadow: 0 0 18px #ffd36b;
      }

      .fuse .mini {
        position: absolute;
      }

      .fuse .a {
        transform: translateX(-17px);
      }

      .fuse .b {
        transform: translateX(17px);
      }

      .fuse .four {
        opacity: 0;
      }

      @media (prefers-reduced-motion: no-preference) {
        .fuse .a {
          animation: fuse-a 3s ease-in-out infinite;
        }
        .fuse .b {
          animation: fuse-b 3s ease-in-out infinite;
        }
        .fuse .four {
          animation: fuse-four 3s ease-in-out infinite;
        }
      }

      @keyframes fuse-a {
        0%,
        25% {
          transform: translateX(-17px);
          opacity: 1;
        }
        45% {
          transform: translateX(0);
          opacity: 1;
        }
        50%,
        90% {
          transform: translateX(0);
          opacity: 0;
        }
        100% {
          transform: translateX(-17px);
          opacity: 0;
        }
      }

      @keyframes fuse-b {
        0%,
        25% {
          transform: translateX(17px);
          opacity: 1;
        }
        45% {
          transform: translateX(0);
          opacity: 1;
        }
        50%,
        90% {
          transform: translateX(0);
          opacity: 0;
        }
        100% {
          transform: translateX(17px);
          opacity: 0;
        }
      }

      @keyframes fuse-four {
        0%,
        44% {
          opacity: 0;
          transform: scale(0.6);
        }
        52% {
          opacity: 1;
          transform: scale(1.25);
        }
        60%,
        88% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .gain {
          display: none;
        }
      }

      .keys {
        display: none;
      }

      @media (hover: hover) {
        .keys {
          display: inline;
        }
        .play:hover,
        .sound:hover {
          filter: brightness(1.1);
        }
      }

      canvas#confetti {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 1000;
      }
    </style>
    <script src="exit-guard.js"></script>
  </head>
  <body>
    <canvas id="confetti"></canvas>
    <main class="app">
      <header class="bar">
        <div class="counter" id="scoreBox">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <h1 class="title">2048</h1>
        <div class="counter">
          <div class="label">Meilleur</div>
          <div class="value" id="bestScore">0</div>
        </div>
      </header>

      <div
        class="board"
        id="board"
        tabindex="0"
        role="img"
        aria-label="Plateau de jeu"
      >
        <div class="sockets" aria-hidden="true"></div>
        <canvas id="orbs"></canvas>
        <div class="end">
          <p class="end-title">Partie terminée</p>
          <p class="end-score" id="endScore">0</p>
          <p class="end-record" id="endRecord" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"
              />
            </svg>
            Nouveau record
          </p>
          <button class="play" id="newGameBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"
                fill="none"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
              />
              <path d="M20.5 3.5v6h-6z" fill="currentColor" />
            </svg>
            Rejouer
          </button>
        </div>
      </div>

      <p class="message" id="message" aria-live="polite"></p>

      <section class="tray">
        <div class="chip">
          <div>
            <div class="label">Parties</div>
            <div class="value" id="statGames">0</div>
          </div>
        </div>
        <div class="chip">
          <div class="seal" id="seal">2048</div>
          <div>
            <div class="label">2048 atteint</div>
            <div class="value" id="stat2048">Non</div>
          </div>
        </div>
        <button
          class="sound"
          id="soundToggle"
          aria-label="Sons"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
            <path
              class="wave"
              d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              class="cross"
              d="M16.5 9.5l5 5M21.5 9.5l-5 5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </section>

      <section class="howto" aria-label="Comment jouer">
        <figure>
          <div class="pic">
            <svg viewBox="0 0 44 40" aria-hidden="true">
              <path
                d="M4 20h36M10 14l-6 6 6 6M34 14l6 6-6 6M22 4v32M16 10l6-6 6 6M16 30l6 6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <figcaption>
            Glisse le doigt<span class="keys"> ou les flèches</span>
          </figcaption>
        </figure>
        <figure>
          <div class="pic fuse" aria-hidden="true">
            <span class="mini a">2</span>
            <span class="mini b">2</span>
            <span class="mini four">4</span>
          </div>
          <figcaption>Deux pareils fusionnent</figcaption>
        </figure>
        <figure>
          <div class="pic" aria-hidden="true">
            <span class="mini gold">2048</span>
          </div>
          <figcaption>Atteins 2048 !</figcaption>
        </figure>
      </section>
    </main>

    <script src="voix.js"></script>
    <script src="confetti.js"></script>
    <script>
      const SIZE = 4
      const SCORES_KEY = "2048-scores"
      const SOUND_KEY = "2048-sound"
      const DEFAULT_SCORES = {
        bestScore: 0,
        gamesPlayed: 0,
        reached2048: false,
      }

      // grid[r][c] : la tuile de la case ({ id, value }) ou null.
      let grid = []
      let score = 0
      let gameOver = false
      let won = false
      let gameCounted = false
      let nextId = 1

      const $ = (id) => document.getElementById(id)
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)")

      function emptyGrid() {
        return Array.from({ length: SIZE }, () => Array(SIZE).fill(null))
      }

      function getScores() {
        const stored = localStorage.getItem(SCORES_KEY)
        return stored
          ? { ...DEFAULT_SCORES, ...JSON.parse(stored) }
          : { ...DEFAULT_SCORES }
      }

      function saveScores(scores) {
        localStorage.setItem(SCORES_KEY, JSON.stringify(scores))
      }

      function initGame() {
        // Nouvelle partie : rien n'est encore joué, on ne garde pas la sortie.
        if (window.ExitGuard) ExitGuard.setActive(false)
        grid = emptyGrid()
        score = 0
        gameOver = false
        won = false
        gameCounted = false
        $("message").textContent = ""
        $("message").className = "message"
        $("board").classList.remove("over")
        anim = { start: performance.now(), slides: [], born: new Map() }
        for (const spawn of [spawnTile(), spawnTile()]) {
          anim.born.set(spawn.id, "spawn")
        }
        updateScoreDisplay()
        requestDraw()
      }

      function spawnTile() {
        const empties = []
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!grid[r][c]) empties.push([r, c])
          }
        }
        if (empties.length === 0) return null
        const [r, c] = empties[Math.floor(Math.random() * empties.length)]
        grid[r][c] = { id: nextId++, value: Math.random() < 0.9 ? 2 : 4 }
        return grid[r][c]
      }

      function updateScoreDisplay() {
        const scores = getScores()
        $("score").textContent = score
        $("bestScore").textContent = Math.max(scores.bestScore, score)
        $("statGames").textContent = scores.gamesPlayed
        $("stat2048").textContent = scores.reached2048 ? "Oui" : "Non"
        $("seal").classList.toggle("lit", scores.reached2048)
      }

      function showGain(points) {
        const gain = document.createElement("div")
        gain.className = "gain"
        gain.textContent = "+" + points
        gain.addEventListener("animationend", () => gain.remove())
        $("scoreBox").append(gain)
      }

      // La case n° j de la ligne i, lue dans le sens du mouvement : on ramène
      // chaque direction à un glissement vers la gauche.
      function linePos(direction, i, j) {
        if (direction === "left") return [i, j]
        if (direction === "right") return [i, SIZE - 1 - j]
        if (direction === "up") return [j, i]
        return [SIZE - 1 - j, i]
      }

      // Direction : 'left', 'right', 'up', 'down'
      function move(direction) {
        if (gameOver) return

        const next = emptyGrid()
        // Le trajet de chaque orbe, pour l'animation. Les deux orbes d'une
        // fusion partagent `pair` : l'id de l'orbe qu'ils deviennent.
        const slides = []
        const born = new Map()
        let moved = false
        let gained = 0
        let highest = 0

        for (let i = 0; i < SIZE; i++) {
          const line = []
          for (let j = 0; j < SIZE; j++) {
            const [r, c] = linePos(direction, i, j)
            if (grid[r][c]) line.push({ tile: grid[r][c], from: [r, c] })
          }
          // Deux voisins égaux fusionnent, en partant du bord vers lequel on
          // pousse ; un orbe né d'une fusion ne refusionne pas dans le même
          // coup.
          for (let k = 0, j = 0; k < line.length; j++) {
            const to = linePos(direction, i, j)
            const a = line[k]
            const b = line[k + 1]
            if (b && a.tile.value === b.tile.value) {
              const merged = { id: nextId++, value: a.tile.value * 2 }
              next[to[0]][to[1]] = merged
              slides.push({ ...a, to, pair: merged.id })
              slides.push({ ...b, to, pair: merged.id })
              born.set(merged.id, "merge")
              gained += merged.value
              moved = true
              k += 2
            } else {
              next[to[0]][to[1]] = a.tile
              slides.push({ ...a, to })
              if (a.from[0] !== to[0] || a.from[1] !== to[1]) moved = true
              k++
            }
            highest = Math.max(highest, next[to[0]][to[1]].value)
          }
        }

        if (!moved) {
          nudge(direction)
          return
        }

        // Premier coup joué : la partie est engagée.
        if (window.ExitGuard) ExitGuard.setActive(true)

        grid = next
        score += gained
        const spawn = spawnTile()
        if (spawn) born.set(spawn.id, "spawn")
        anim = { start: performance.now(), slides, born, direction }

        const mergedValues = slides
          .filter((s) => s.pair)
          .map((s) => s.tile.value * 2)
        const sound = wakeSound(highest >= 2048 && !won ? 3500 : 900)
        if (sound) {
          playSlide(sound)
          playMerges(sound, mergedValues)
        }
        if (gained) showGain(gained)

        updateScoreDisplay()
        requestDraw()

        const scores = getScores()

        // Win check (first time)
        if (!won && highest >= 2048) {
          won = true
          if (!scores.reached2048) {
            scores.reached2048 = true
            saveScores(scores)
            showConfetti()
          }
          if (sound) playWin(sound)
          supernova()
          $("message").textContent = "Bravo, tu as atteint 2048 !"
          $("message").className = "message show"
          updateScoreDisplay()
        }

        // Update best score live
        if (score > scores.bestScore) {
          scores.bestScore = score
          saveScores(scores)
          updateScoreDisplay()
        }

        // Game over check
        if (!hasMoves()) {
          gameOver = true
          if (window.ExitGuard) ExitGuard.setActive(false)
          const before = getScores()
          const isRecord = score > 0 && score >= before.bestScore
          if (!gameCounted) {
            gameCounted = true
            before.gamesPlayed++
            if (score > before.bestScore) before.bestScore = score
            saveScores(before)
            updateScoreDisplay()
          }
          $("endScore").textContent = score
          $("endRecord").hidden = !isRecord
          $("board").classList.add("over")
          if (sound) playGameOver(sound)
          setTimeout(() => {
            if (gameOver) $("newGameBtn").focus({ preventScroll: true })
          }, 1100)
        }
      }

      function hasMoves() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const value = grid[r][c]?.value
            if (!value) return true
            if (c + 1 < SIZE && value === grid[r][c + 1]?.value) return true
            if (r + 1 < SIZE && value === grid[r + 1][c]?.value) return true
          }
        }
        return false
      }

      // ===== Les orbes =====
      //
      // Tout le plateau est dessiné dans un canvas : le halo de chaque orbe
      // (en lumière additive), son corps, puis le plasma qui tourne dedans.
      // Les corps de même valeur sont reliés par des ponts « métaballes » :
      // deux cercles et la courbe qui les joint, comme deux gouttes. Pas de
      // filtre : des dégradés pré-dessinés et des chemins vectoriels.

      // Par niveau (log2 de la valeur) : couleur du corps, du cœur (et du
      // halo), et de l'encre du nombre.
      const LOOKS = [
        null,
        { body: "#17668e", core: "#8cf0ff", ink: "#fff" }, // 2
        { body: "#2453b4", core: "#9cbcff", ink: "#fff" }, // 4
        { body: "#4a39c4", core: "#b9a9ff", ink: "#fff" }, // 8
        { body: "#7630c2", core: "#e2a9ff", ink: "#fff" }, // 16
        { body: "#a8279f", core: "#ff9ee6", ink: "#fff" }, // 32
        { body: "#c8245a", core: "#ff9fb4", ink: "#fff" }, // 64
        { body: "#dc4b24", core: "#ffbf8a", ink: "#fff" }, // 128
        { body: "#e57412", core: "#ffd68a", ink: "#fff" }, // 256
        { body: "#e9a210", core: "#ffeca0", ink: "#3d1d00" }, // 512
        { body: "#f2c832", core: "#fffbe0", ink: "#4a2400" }, // 1024
        { body: "#fff1b8", core: "#ffffff", ink: "#5a2a00" }, // 2048
        { body: "#dff1ff", core: "#ffffff", ink: "#1d1a5c", halo: "#8fd8ff" }, // au-delà : une étoile bleue
      ]

      const SLIDE = 120 // ms : le glissement
      const BLOOM = 380 // ms : la goutte qui tremble après une fusion
      const GROW = 220 // ms : un nouvel orbe qui apparaît

      const canvas = $("orbs")
      const ctx = canvas.getContext("2d")
      let size = 0 // côté du plateau, en pixels CSS
      let cell = 0
      let pad = 0
      let dpr = 1
      let anim = null
      let nudgeAnim = null
      let particles = []
      let rings = []
      let sprites = new Map()
      let drawQueued = false
      let lastFrame = 0

      const level = (value) => Math.min(Math.log2(value), LOOKS.length - 1)
      const look = (value) => LOOKS[level(value)]
      // L'orbe grossit un peu avec sa valeur (sans jamais toucher ses voisins).
      const radius = (value) =>
        cell * 0.5 * (0.7 + 0.022 * Math.min(level(value), 11))
      const center = (r, c) => [pad + cell * (c + 0.5), pad + cell * (r + 0.5)]
      const lerp = (a, b, k) => a + (b - a) * k
      const easeOut = (k) => 1 - Math.pow(1 - k, 3)
      const easeOutQuad = (k) => 1 - (1 - k) * (1 - k)
      const easeOutBack = (k) =>
        1 + 2.4 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2)

      function rgba(hex, alpha) {
        const n = parseInt(hex.slice(1), 16)
        const full = hex.length === 4
        const [r, g, b] = full
          ? [(n >> 8) * 17, ((n >> 4) & 15) * 17, (n & 15) * 17]
          : [n >> 16, (n >> 8) & 255, n & 255]
        return `rgba(${r},${g},${b},${alpha})`
      }

      function resize() {
        const rect = canvas.getBoundingClientRect()
        size = rect.width
        pad = size * 0.035
        cell = (size - 2 * pad) / SIZE
        dpr = Math.min(window.devicePixelRatio || 1, 3)
        canvas.width = Math.round(size * dpr)
        canvas.height = Math.round(size * dpr)
        sprites = new Map()
        requestDraw()
      }

      // Un disque de lumière pré-dessiné : on le pose ensuite avec
      // drawImage, bien moins coûteux qu'un dégradé recréé à chaque image.
      function makeSprite(px, paint) {
        const sprite = document.createElement("canvas")
        sprite.width = sprite.height = Math.max(2, Math.ceil(px * dpr))
        const g = sprite.getContext("2d")
        g.scale(dpr, dpr)
        paint(g, px / 2)
        return sprite
      }

      function radial(g, x0, y0, r0, x1, y1, r1, stops) {
        const gradient = g.createRadialGradient(x0, y0, r0, x1, y1, r1)
        for (const [at, color] of stops) gradient.addColorStop(at, color)
        return gradient
      }

      function spritesFor(value) {
        if (sprites.has(value)) return sprites.get(value)
        const L = Math.min(level(value), 11)
        const { body, core, halo = core } = look(value)
        const R = radius(value)
        const haloR = R * (1.35 + 0.06 * L)
        const set = {
          haloR,
          halo: makeSprite(haloR * 2, (g, h) => {
            g.fillStyle = radial(g, h, h, 0, h, h, h, [
              [0, rgba(halo, 0.12 + 0.03 * L)],
              [R / haloR, rgba(halo, 0.1 + 0.028 * L)],
              [1, rgba(halo, 0)],
            ])
            g.fillRect(0, 0, h * 2, h * 2)
          }),
          // Le cœur, décalé vers le haut à gauche pour donner du volume, se
          // fond dans la couleur du corps au bord : les ponts entre gouttes
          // restent sans couture.
          core: makeSprite(R * 2, (g, h) => {
            g.fillStyle = radial(g, h - R * 0.2, h - R * 0.25, 0, h, h, R, [
              [0, rgba(core, 0.95)],
              [0.55, rgba(core, 0.35)],
              [1, rgba(body, 0)],
            ])
            g.fillRect(0, 0, h * 2, h * 2)
          }),
          blob: makeSprite(R * 1.1, (g, h) => {
            g.fillStyle = radial(g, h, h, 0, h, h, h, [
              [0, rgba("#ffffff", 0.55)],
              [0.4, rgba(core, 0.3)],
              [1, rgba(core, 0)],
            ])
            g.fillRect(0, 0, h * 2, h * 2)
          }),
          spark: makeSprite(cell * 0.14, (g, h) => {
            g.fillStyle = radial(g, h, h, 0, h, h, h, [
              [0, "#fff"],
              [0.3, rgba(core, 0.9)],
              [1, rgba(core, 0)],
            ])
            g.fillRect(0, 0, h * 2, h * 2)
          }),
        }
        sprites.set(value, set)
        return set
      }

      function put(sprite, x, y, px) {
        ctx.drawImage(sprite, x - px / 2, y - px / 2, px, px)
      }

      // Les orbes à dessiner à l'instant `now` : pendant le glissement, ceux
      // d'avant le coup, en route ; ensuite ceux de la grille, les nouveaux en
      // train d'éclore.
      function sceneOrbs(now) {
        const orbs = []
        const t = anim ? now - anim.start : Infinity
        if (t < SLIDE) {
          const k = easeOutQuad(t / SLIDE)
          for (const s of anim.slides) {
            const [x0, y0] = center(...s.from)
            const [x1, y1] = center(...s.to)
            orbs.push({
              id: s.tile.id,
              value: s.tile.value,
              x: lerp(x0, x1, k),
              y: lerp(y0, y1, k),
              sx: 1,
              sy: 1,
              ink: s.pair ? 1 - k : 1,
              pair: s.pair,
            })
          }
          return orbs
        }
        const since = t - SLIDE
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const tile = grid[r][c]
            if (!tile) continue
            const [x, y] = center(r, c)
            const orb = {
              id: tile.id,
              value: tile.value,
              x,
              y,
              sx: 1,
              sy: 1,
              ink: 1,
            }
            const born = anim?.born.get(tile.id)
            if (born === "spawn" && since < GROW) {
              orb.sx = orb.sy = Math.max(0, easeOutBack(since / GROW))
              orb.ink = since / GROW
            } else if (born === "merge" && since < BLOOM) {
              // La goutte tout juste formée tremble : écrasée dans le sens du
              // choc, puis étirée, de moins en moins.
              const k = since / BLOOM
              const swell = 1 + 0.1 * Math.pow(1 - k, 2)
              const wobble = Math.sin(k * Math.PI * 3) * 0.09 * (1 - k)
              const across =
                anim.direction === "left" || anim.direction === "right"
              orb.sx = swell * (1 + (across ? -wobble : wobble))
              orb.sy = swell * (1 + (across ? wobble : -wobble))
              orb.flash = Math.pow(1 - k, 2)
            }
            orbs.push(orb)
          }
        }
        return orbs
      }

      // Le pont entre deux gouttes (la « métaballe » de Paper.js) : deux
      // points sur chaque cercle, reliés par des courbes qui partent en
      // tangente. `v` règle l'épaisseur du pont.
      function bridge(x1, y1, r1, x2, y2, r2, v) {
        const d = Math.hypot(x2 - x1, y2 - y1)
        if (d <= Math.abs(r1 - r2) || d > r1 + r2 * 2.5 || d === 0) return null
        let u1 = 0
        let u2 = 0
        if (d < r1 + r2) {
          u1 = Math.acos((r1 * r1 + d * d - r2 * r2) / (2 * r1 * d))
          u2 = Math.acos((r2 * r2 + d * d - r1 * r1) / (2 * r2 * d))
        }
        const axis = Math.atan2(y2 - y1, x2 - x1)
        const spread = Math.acos((r1 - r2) / d)
        const a1 = axis + u1 + (spread - u1) * v
        const a2 = axis - u1 - (spread - u1) * v
        const a3 = axis + Math.PI - u2 - (Math.PI - u2 - spread) * v
        const a4 = axis - Math.PI + u2 + (Math.PI - u2 - spread) * v
        const at = (x, y, a, r) => [x + Math.cos(a) * r, y + Math.sin(a) * r]
        const p1 = at(x1, y1, a1, r1)
        const p2 = at(x1, y1, a2, r1)
        const p3 = at(x2, y2, a3, r2)
        const p4 = at(x2, y2, a4, r2)
        const handle =
          Math.min(
            v * 2.4,
            Math.hypot(p1[0] - p3[0], p1[1] - p3[1]) / (r1 + r2),
          ) * Math.min(1, (d * 2) / (r1 + r2))
        const h1 = at(...p1, a1 - Math.PI / 2, r1 * handle)
        const h2 = at(...p2, a2 + Math.PI / 2, r1 * handle)
        const h3 = at(...p3, a3 + Math.PI / 2, r2 * handle)
        const h4 = at(...p4, a4 - Math.PI / 2, r2 * handle)
        const path = new Path2D()
        path.moveTo(...p1)
        path.bezierCurveTo(...h1, ...h3, ...p3)
        path.lineTo(...p4)
        path.bezierCurveTo(...h4, ...h2, ...p2)
        path.closePath()
        return path
      }

      function draw(now) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        ctx.clearRect(0, 0, size, size)
        if (!cell) return
        const orbs = sceneOrbs(now)
        const still = reducedMotion.matches
        const time = still ? 0 : now

        // Le petit refus quand rien ne peut bouger : tout penche vers le bord,
        // qui s'allume, puis revient.
        let dx = 0
        let dy = 0
        if (nudgeAnim) {
          const k = (now - nudgeAnim.start) / 260
          if (k >= 1) nudgeAnim = null
          else {
            const push = Math.sin(k * Math.PI) * (1 - k * 0.5) * cell * 0.08
            dx = nudgeAnim.dx * push
            dy = nudgeAnim.dy * push
            drawEdge(nudgeAnim, Math.sin(k * Math.PI))
          }
        }
        ctx.translate(dx, dy)

        // Les éclats et les ondes d'une fusion partent à la fin du glissement.
        if (anim && !anim.burst && now - anim.start >= SLIDE) {
          anim.burst = true
          for (const orb of orbs) {
            if (anim.born.get(orb.id) === "merge") burst(orb, now)
          }
        }

        // 1. Les halos, en lumière additive.
        ctx.globalCompositeOperation = "lighter"
        for (const o of orbs) {
          const set = spritesFor(o.value)
          const breathe = still ? 1 : 1 + 0.04 * Math.sin(time * 0.002 + o.id)
          put(
            set.halo,
            o.x,
            o.y,
            set.haloR * 2 * Math.max(o.sx, o.sy) * breathe,
          )
        }
        ctx.globalCompositeOperation = "source-over"

        // 2. Les corps, du plus petit au plus grand, avec leurs ponts. Deux
        // orbes qui fusionnent sont reliés par un pont épais ; deux voisins
        // pareils, par un fil qui palpite : ils pourraient fusionner.
        const groups = new Map()
        for (const o of orbs) {
          if (!groups.has(o.value)) groups.set(o.value, [])
          groups.get(o.value).push(o)
        }
        const values = [...groups.keys()].sort((a, b) => a - b)
        const thread = 0.08 + (still ? 0 : 0.035 * Math.sin(time * 0.005))
        for (const value of values) {
          const group = groups.get(value)
          const R = radius(value)
          ctx.fillStyle = look(value).body
          for (let i = 0; i < group.length; i++) {
            const a = group[i]
            ctx.beginPath()
            ctx.ellipse(a.x, a.y, R * a.sx, R * a.sy, 0, 0, Math.PI * 2)
            ctx.fill()
            for (let j = i + 1; j < group.length; j++) {
              const b = group[j]
              const merging = a.pair && a.pair === b.pair
              if (!merging && Math.hypot(a.x - b.x, a.y - b.y) > cell * 1.05)
                continue
              const path = bridge(
                a.x,
                a.y,
                R * Math.min(a.sx, a.sy),
                b.x,
                b.y,
                R * Math.min(b.sx, b.sy),
                merging ? 0.5 : thread,
              )
              if (path) ctx.fill(path)
            }
          }
        }

        // 3. Le cœur de chaque orbe et le plasma qui y tourne.
        for (const o of orbs) {
          const set = spritesFor(o.value)
          const R = radius(o.value)
          ctx.save()
          ctx.translate(o.x, o.y)
          ctx.scale(o.sx, o.sy)
          ctx.drawImage(set.core, -R, -R, R * 2, R * 2)
          ctx.globalCompositeOperation = "lighter"
          const L = level(o.value)
          for (let b = 0; b < 2; b++) {
            const phase = o.id * 1.7 + b * 2.4
            const speed = 0.0009 + 0.00012 * L
            const bx = Math.cos(time * speed * (b ? 1.3 : 1) + phase) * R * 0.32
            const by =
              Math.sin(time * speed * (b ? 0.9 : 1.2) + phase) * R * 0.28
            put(set.blob, bx, by, R * 1.1)
          }
          if (o.flash) {
            ctx.globalAlpha = o.flash
            put(set.blob, 0, 0, R * 2.4)
            ctx.globalAlpha = 1
          }
          ctx.restore()
        }

        // 4. L'éclat des grands : des étincelles en orbite dès 128, une
        // couronne de rayons à 2048.
        ctx.globalCompositeOperation = "lighter"
        for (const o of orbs) {
          const L = level(o.value)
          if (L < 7) continue
          const set = spritesFor(o.value)
          const R = radius(o.value) * Math.max(o.sx, o.sy)
          if (L >= 11) drawCorona(o, R, time)
          const count = Math.min(L - 6, 5)
          for (let s = 0; s < count; s++) {
            const a = time * 0.0016 + (s * Math.PI * 2) / count + o.id
            put(
              set.spark,
              o.x + Math.cos(a) * R * 1.04,
              o.y + Math.sin(a) * R * 1.04,
              cell * 0.09,
            )
          }
        }

        drawRings(now)
        drawParticles(now)
        ctx.globalCompositeOperation = "source-over"

        // 5. Les nombres.
        ctx.textAlign = "center"
        ctx.textBaseline = "middle"
        for (const o of orbs) {
          if (o.ink <= 0) continue
          const digits = String(o.value).length
          const px =
            cell * [0, 0.36, 0.33, 0.27, 0.21, 0.17][Math.min(digits, 5)]
          ctx.save()
          ctx.translate(o.x, o.y + px * 0.04)
          ctx.scale(o.sx, o.sy)
          ctx.globalAlpha = Math.min(1, o.ink)
          ctx.font = `700 ${px}px Unbounded, "Arial Rounded MT Bold", sans-serif`
          const ink = look(o.value).ink
          if (ink === "#fff") {
            ctx.fillStyle = "rgba(10, 4, 40, 0.35)"
            ctx.fillText(o.value, 0, px * 0.06)
          }
          ctx.fillStyle = ink
          ctx.fillText(o.value, 0, 0)
          ctx.restore()
        }
      }

      function drawEdge({ dx, dy }, alpha) {
        const x = dx > 0 ? size : 0
        const y = dy > 0 ? size : 0
        const depth = cell * 0.5
        const g = dx
          ? ctx.createLinearGradient(x, 0, x - dx * depth, 0)
          : ctx.createLinearGradient(0, y, 0, y - dy * depth)
        g.addColorStop(0, `rgba(199, 166, 255, ${0.45 * alpha})`)
        g.addColorStop(1, "rgba(199, 166, 255, 0)")
        ctx.fillStyle = g
        ctx.fillRect(0, 0, size, size)
      }

      function drawCorona(o, R, time) {
        const { core, halo = core } = look(o.value)
        ctx.save()
        ctx.translate(o.x, o.y)
        ctx.rotate(time * 0.0004)
        const g = ctx.createLinearGradient(R * 0.7, 0, R * 1.55, 0)
        g.addColorStop(0, rgba(halo, 0.4))
        g.addColorStop(1, rgba(halo, 0))
        ctx.fillStyle = g
        for (let k = 0; k < 16; k++) {
          ctx.beginPath()
          ctx.moveTo(R * 0.7, -R * 0.05)
          ctx.lineTo(R * (k % 2 ? 1.3 : 1.55), 0)
          ctx.lineTo(R * 0.7, R * 0.05)
          ctx.fill()
          ctx.rotate(Math.PI / 8)
        }
        ctx.restore()
      }

      // Une fusion lance des éclats de la nouvelle couleur, d'autant plus
      // nombreux et rapides que la valeur est grande, et une onde dès 64.
      function burst(orb, now) {
        if (reducedMotion.matches) return
        const L = level(orb.value)
        const count = 5 + L * 2
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2
          const speed = cell * (1.2 + Math.random() * 1.6 + L * 0.12)
          particles.push({
            value: orb.value,
            x: orb.x,
            y: orb.y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            born: now,
            life: 380 + Math.random() * 320 + L * 25,
            size: cell * (0.09 + Math.random() * 0.08),
          })
        }
        if (L >= 6) {
          rings.push({
            value: orb.value,
            x: orb.x,
            y: orb.y,
            born: now,
            life: 520,
            to: cell * (0.9 + L * 0.06),
          })
        }
      }

      // 2048 : une supernova, l'onde traverse tout le plateau.
      function supernova() {
        if (reducedMotion.matches) return
        const now = performance.now() + SLIDE
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c]?.value !== 2048) continue
            const [x, y] = center(r, c)
            for (let i = 0; i < 3; i++) {
              rings.push({
                value: 2048,
                x,
                y,
                born: now + i * 160,
                life: 1100,
                to: size * 1.1,
              })
            }
            for (let i = 0; i < 70; i++) {
              const a = Math.random() * Math.PI * 2
              const speed = cell * (2 + Math.random() * 4)
              particles.push({
                value: 2 ** (1 + Math.floor(Math.random() * 11)),
                x,
                y,
                vx: Math.cos(a) * speed,
                vy: Math.sin(a) * speed,
                born: now,
                life: 900 + Math.random() * 700,
                size: cell * (0.1 + Math.random() * 0.12),
              })
            }
          }
        }
      }

      // Les éclats ralentissent (freinage exponentiel), rétrécissent et
      // s'éteignent.
      function drawParticles(now) {
        particles = particles.filter((p) => now - p.born < p.life)
        for (const p of particles) {
          const t = (now - p.born) / 1000
          if (t < 0) continue
          const k = (now - p.born) / p.life
          const travel = (1 - Math.exp(-4 * t)) / 4
          ctx.globalAlpha = 1 - k
          put(
            spritesFor(p.value).spark,
            p.x + p.vx * travel,
            p.y + p.vy * travel,
            p.size * (1.4 - k),
          )
        }
        ctx.globalAlpha = 1
      }

      function drawRings(now) {
        rings = rings.filter((ring) => now - ring.born < ring.life)
        for (const ring of rings) {
          const k = (now - ring.born) / ring.life
          if (k < 0) continue
          const { core, halo = core } = look(ring.value)
          ctx.strokeStyle = rgba(halo, 0.7 * (1 - k))
          ctx.lineWidth = cell * 0.08 * (1 - k) + 1
          ctx.beginPath()
          ctx.arc(ring.x, ring.y, ring.to * easeOut(k), 0, Math.PI * 2)
          ctx.stroke()
        }
      }

      function nudge(direction) {
        const sound = wakeSound(400)
        if (sound) playBump(sound)
        if (reducedMotion.matches) return
        const [dx, dy] = {
          left: [-1, 0],
          right: [1, 0],
          up: [0, -1],
          down: [0, 1],
        }[direction]
        nudgeAnim = { start: performance.now(), dx, dy }
        requestDraw()
      }

      // Avec les animations, le plasma vit en continu ; sinon, une seule
      // image à chaque changement.
      function frame(now) {
        drawQueued = false
        if (reducedMotion.matches) {
          anim = null
          nudgeAnim = null
          draw(now)
          return
        }
        // Au repos, une image sur deux suffit au plasma : on ménage la
        // batterie.
        const busy =
          (anim && now - anim.start < SLIDE + BLOOM) ||
          nudgeAnim ||
          particles.length ||
          rings.length
        if (busy || now - lastFrame > 30) {
          lastFrame = now
          draw(now)
        }
        drawQueued = true
        requestAnimationFrame(frame)
      }

      function requestDraw() {
        if (drawQueued && !reducedMotion.matches) return
        drawQueued = true
        requestAnimationFrame(frame)
      }

      // ===== Les sons =====
      // Synthétisés, joués par le contexte de voix.js (débloqué par le geste).

      let soundOn = localStorage.getItem(SOUND_KEY) !== "off"

      function wakeSound(ms) {
        return soundOn ? Voice.wake(ms) : null
      }

      function tone(c, o) {
        const at = c.currentTime + (o.at || 0)
        const osc = c.createOscillator()
        const gain = c.createGain()
        osc.type = o.type || "sine"
        osc.frequency.setValueAtTime(o.freq, at)
        if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, at + o.dur)
        gain.gain.setValueAtTime(0, at)
        gain.gain.linearRampToValueAtTime(o.vol, at + 0.008)
        gain.gain.exponentialRampToValueAtTime(0.0001, at + o.dur)
        osc.connect(gain)
        gain.connect(c.destination)
        osc.start(at)
        osc.stop(at + o.dur + 0.05)
      }

      // Une gamme pentatonique : chaque niveau sonne un cran plus haut, et
      // toutes les fusions d'un même coup s'accordent entre elles.
      const PENTA = [0, 2, 4, 7, 9]
      function pitch(value) {
        const step = Math.min(Math.log2(value), 13) - 1
        const semis = Math.floor(step / 5) * 12 + PENTA[step % 5]
        return 261.6 * Math.pow(2, semis / 12)
      }

      function playSlide(c) {
        tone(c, { freq: 520, to: 380, dur: 0.07, vol: 0.025, type: "triangle" })
      }

      // Une goutte : un « bloup » qui monte, et son harmonique en écho.
      function playMerges(c, values) {
        const top = [...new Set(values)].sort((a, b) => b - a).slice(0, 3)
        top.forEach((value, i) => {
          const f = pitch(value)
          const at = SLIDE / 1000 + i * 0.04
          tone(c, { freq: f * 0.6, to: f, dur: 0.16, vol: 0.16, at })
          tone(c, {
            freq: f * 2,
            dur: 0.3,
            vol: 0.035,
            at: at + 0.03,
            type: "triangle",
          })
        })
      }

      function playBump(c) {
        tone(c, { freq: 150, to: 95, dur: 0.14, vol: 0.14 })
      }

      function playWin(c) {
        ;[0, 4, 7, 12, 16, 19, 24].forEach((semis, i) => {
          const f = 523.3 * Math.pow(2, semis / 12)
          tone(c, {
            freq: f,
            dur: 0.6,
            vol: 0.07,
            at: SLIDE / 1000 + 0.15 + i * 0.09,
          })
          tone(c, {
            freq: f * 2,
            dur: 0.4,
            vol: 0.02,
            at: SLIDE / 1000 + 0.17 + i * 0.09,
            type: "triangle",
          })
        })
      }

      function playGameOver(c) {
        ;[392, 329.6, 261.6].forEach((f, i) => {
          tone(c, {
            freq: f,
            to: f * 0.97,
            dur: 0.5,
            vol: 0.08,
            at: 0.35 + i * 0.22,
            type: "triangle",
          })
        })
      }

      function updateSoundButton() {
        $("soundToggle").setAttribute("aria-pressed", soundOn)
      }

      $("soundToggle").addEventListener("click", () => {
        soundOn = !soundOn
        localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off")
        updateSoundButton()
        const sound = wakeSound(400)
        if (sound)
          tone(sound, { freq: pitch(8), to: pitch(16), dur: 0.15, vol: 0.12 })
      })

      // ===== Les gestes =====

      // Keyboard
      const KEY_DIRS = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down",
      }
      document.addEventListener("keydown", (e) => {
        const dir = KEY_DIRS[e.key]
        if (!dir) return
        e.preventDefault()
        move(dir)
      })

      // Touch / swipe
      const board = $("board")
      let touchStart = null
      const SWIPE_THRESHOLD = 24

      board.addEventListener(
        "touchstart",
        (e) => {
          const t = e.changedTouches[0]
          touchStart = { x: t.clientX, y: t.clientY }
        },
        { passive: true },
      )

      board.addEventListener(
        "touchmove",
        (e) => {
          // Prevent page scroll while swiping on the grid
          e.preventDefault()
        },
        { passive: false },
      )

      board.addEventListener("touchend", (e) => {
        if (!touchStart) return
        const t = e.changedTouches[0]
        swipe(t.clientX - touchStart.x, t.clientY - touchStart.y)
        touchStart = null
      })

      // À la souris aussi, en glissant sur le plateau.
      let mouseStart = null
      board.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse")
          mouseStart = { x: e.clientX, y: e.clientY }
      })
      board.addEventListener("pointerup", (e) => {
        if (!mouseStart || e.pointerType !== "mouse") return
        swipe(e.clientX - mouseStart.x, e.clientY - mouseStart.y)
        mouseStart = null
      })

      function swipe(dx, dy) {
        if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD)
          return
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? "right" : "left")
        } else {
          move(dy > 0 ? "down" : "up")
        }
      }

      $("newGameBtn").addEventListener("click", () => {
        const sound = wakeSound(400)
        if (sound)
          tone(sound, { freq: pitch(2), to: pitch(4), dur: 0.18, vol: 0.12 })
        initGame()
      })

      document.querySelector(".sockets").innerHTML = "<span></span>".repeat(
        SIZE * SIZE,
      )
      new ResizeObserver(resize).observe(canvas)
      reducedMotion.addEventListener("change", requestDraw)
      document.fonts.load("700 20px Unbounded").then(requestDraw)
      updateSoundButton()
      updateScoreDisplay()
      initGame()
    </script>
  </body>
</html>
