<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff4ec" />
    <title>Lis à voix haute</title>
    <script src="exit-guard.js"></script>
    <script src="voix.js"></script>
    <script src="wake-lock.js"></script>
    <style>
      @font-face {
        font-family: "Andika";
        src: url("Andika-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Andika";
        src: url("Andika-Bold.woff2") format("woff2");
        font-weight: 700;
      }

      :root {
        --ink: #2d2545;
        --soft: #8a7fa6;
        --card: #ffffff;
        --go-a: #ff5d8f;
        --go-b: #8c5cff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Andika", Arial, sans-serif;
        color: var(--ink);
        background: #fff4ec;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Des taches de couleur qui dérivent doucement derrière tout. */
      .ambient {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .ambient i {
        position: absolute;
        width: 70vmax;
        height: 70vmax;
        border-radius: 50%;
        opacity: 0.55;
        animation: drift 26s ease-in-out infinite alternate;
      }
      .ambient i:nth-child(1) {
        background: radial-gradient(closest-side, #ffc2d6, transparent);
        left: -30vmax;
        top: -25vmax;
      }
      .ambient i:nth-child(2) {
        background: radial-gradient(closest-side, #c9d8ff, transparent);
        right: -35vmax;
        top: 10vmax;
        animation-duration: 32s;
        animation-delay: -10s;
      }
      .ambient i:nth-child(3) {
        background: radial-gradient(closest-side, #ffe2a8, transparent);
        left: -15vmax;
        bottom: -40vmax;
        animation-duration: 29s;
        animation-delay: -5s;
      }
      @keyframes drift {
        to {
          transform: translate(12vmax, 8vmax) scale(1.15);
        }
      }

      .app {
        position: relative;
        height: 100%;
        max-width: 640px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: max(12px, env(safe-area-inset-top)) 16px
          max(16px, env(safe-area-inset-bottom));
      }

      /* --- Barre du haut : l'étape à gauche, la partie au milieu --- */
      .bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .bar[hidden] {
        display: grid;
        visibility: hidden;
      }
      .etape {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px 0 10px;
        border-radius: 17px;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: var(--ec);
        box-shadow: 0 8px 18px -10px var(--ec);
        white-space: nowrap;
      }
      .etape svg {
        width: 18px;
        height: 18px;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(45, 37, 69, 0.12);
        transition: background-color 0.3s;
      }
      .dots i.done {
        background: var(--c);
      }
      .dots i.now {
        background: var(--c);
        animation: breathe 1.6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.35);
          opacity: 0.6;
        }
      }

      /* --- La scène : une carte qui tient sans défiler --- */
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 10px 0;
      }
      .card {
        width: 100%;
        background: var(--card);
        border-radius: 28px;
        padding: 22px 16px 26px;
        box-shadow:
          0 1px 0 rgba(45, 37, 69, 0.04),
          0 18px 40px -18px rgba(90, 60, 140, 0.35);
        text-align: center;
        position: relative;
      }

      /* --- L'image, cachée sous du papier bulle --- */
      .tableau {
        position: relative;
        width: 240px;
        aspect-ratio: 1;
        margin: 0 auto 18px;
        border-radius: 22px;
        overflow: hidden;
        background: #f4f0fb;
        transform: translateZ(0);
      }
      .tableau img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bulle {
        position: absolute;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, var(--c), var(--c2));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      }
      /* Le dôme de la bulle, avec son reflet */
      .bulle::before {
        content: "";
        width: var(--w);
        height: var(--h);
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.85) 0 7%,
          rgba(255, 255, 255, 0.22) 9% 38%,
          rgba(255, 255, 255, 0) 64%
        );
        box-shadow:
          inset 0 -5px 10px rgba(40, 20, 80, 0.16),
          0 3px 6px rgba(40, 20, 80, 0.12);
      }
      .bulle.creve {
        visibility: hidden;
      }

      /* --- La phrase --- */
      .phrase {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 7px;
        font-size: 30px;
        line-height: 1.15;
        font-weight: 700;
      }
      .phrase.moyenne {
        font-size: 26px;
      }
      .phrase.longue {
        font-size: 21px;
        gap: 7px 4px;
      }
      .mot {
        position: relative;
        display: inline-block;
        padding: 7px 11px 9px;
        border: 2.5px solid transparent;
        border-radius: 16px;
        color: var(--ink);
        background: #f4f0fb;
        transition: color 0.25s 0.1s;
        isolation: isolate;
        cursor: pointer;
      }
      .aides .mot {
        padding-bottom: 15px;
      }
      .longue .mot {
        padding: 4px 7px 6px;
        border-radius: 12px;
      }
      /* La couleur qui remplit le mot quand il est lu */
      .mot::before {
        content: "";
        position: absolute;
        inset: -2.5px;
        border-radius: inherit;
        background: linear-gradient(135deg, var(--c), var(--c2));
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.35s cubic-bezier(0.3, 0.7, 0.2, 1);
        z-index: -1;
      }
      /* Le prochain mot à lire : un anneau qui respire autour */
      .mot::after {
        content: "";
        position: absolute;
        inset: -2.5px;
        border-radius: inherit;
        border: 3px solid var(--c);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .mot.next::after {
        animation: underline 1.4s ease-in-out infinite;
      }
      @keyframes underline {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .mot.lu {
        color: #fff;
      }
      .mot.lu::before,
      .mot.aide::before {
        transform: scaleX(1);
      }
      /* Lu avec l'aide de la voix : la couleur, en plus pâle */
      .mot.aide::before {
        opacity: 0.4;
      }
      /* Raté par la reconnaissance : à relire à la fin */
      .mot.rate {
        background: transparent;
        border: 2.5px dashed var(--c);
      }
      .relire .mot.rate {
        animation: relire 1.2s ease-in-out infinite;
      }
      @keyframes relire {
        50% {
          transform: scale(1.08);
        }
      }

      /* Les syllabes : un arc sous chacune, et les lettres muettes en gris */
      .syl {
        position: relative;
      }
      .aides .syl::after {
        content: "";
        position: absolute;
        left: 1px;
        right: 1px;
        bottom: -8px;
        height: 7px;
        border: 2.5px solid currentColor;
        border-top: 0;
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
        opacity: 0.32;
      }
      .aides .mot.lu .syl::after {
        opacity: 0.6;
      }
      .aides .muet {
        opacity: 0.35;
      }
      .aides .mot.lu .muet {
        opacity: 0.55;
      }
      .ponct {
        margin-left: 1px;
      }

      /* Le coup de pouce : un haut-parleur sur le mot qui bloque */
      .ouie {
        position: absolute;
        top: -14px;
        right: -10px;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(145deg, var(--c), var(--c2));
        box-shadow: 0 4px 10px -3px rgba(60, 40, 110, 0.5);
        opacity: 0;
        transform: scale(0.3);
        transition:
          opacity 0.25s,
          transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
        pointer-events: none;
      }
      .ouie svg {
        width: 17px;
        height: 17px;
      }
      .mot.pouce .ouie {
        opacity: 1;
        transform: none;
        animation: pouce 1.1s ease-in-out infinite;
      }
      @keyframes pouce {
        50% {
          transform: translateY(-4px);
        }
      }

      .spark {
        position: absolute;
        z-index: 2;
        width: 9px;
        height: 9px;
        margin: -4.5px;
        border-radius: 50%;
        background: var(--c);
        pointer-events: none;
      }
      .ring {
        position: absolute;
        inset: -4px;
        border-radius: 18px;
        border: 3px solid var(--c);
        pointer-events: none;
      }

      /* --- Accueil --- */
      .title {
        margin: 0 0 6px;
        font-size: 34px;
        line-height: 1.1;
      }
      .subtitle {
        margin: 0 0 20px;
        color: var(--soft);
        font-size: 18px;
      }
      .demo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 26px;
      }
      .demo .tableau {
        width: 92px;
        margin: 0;
        border-radius: 16px;
        flex: none;
      }
      .demo .phrase {
        font-size: 22px;
        gap: 6px 5px;
        justify-content: flex-start;
      }
      .demo .mot {
        padding: 5px 9px 7px;
        border-radius: 12px;
      }
      .demo .mot::before {
        transition: none;
        animation: demo-fill 6s infinite;
        animation-delay: calc(var(--i) * 0.7s + 0.6s);
      }
      /* Le mot en blanc par-dessus, qui apparaît avec la couleur */
      .demo .mot::after {
        content: attr(data-t);
        inset: 0;
        padding: inherit;
        border: 0;
        color: #fff;
        animation: demo-blanc 6s infinite;
        animation-delay: calc(var(--i) * 0.7s + 0.6s);
      }
      .demo .bulle {
        animation: demo-pop 6s infinite;
        animation-delay: calc(var(--i) * 0.7s + 0.6s);
      }
      @keyframes demo-fill {
        0% {
          transform: scaleX(0);
        }
        6%,
        80% {
          transform: scaleX(1);
        }
        90%,
        100% {
          transform: scaleX(0);
        }
      }
      @keyframes demo-blanc {
        0% {
          opacity: 0;
        }
        4%,
        80% {
          opacity: 1;
        }
        90%,
        100% {
          opacity: 0;
        }
      }
      @keyframes demo-pop {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        5% {
          opacity: 0;
          transform: scale(1.3);
        }
        80% {
          opacity: 0;
          transform: scale(1);
        }
        90%,
        100% {
          opacity: 1;
        }
      }

      /* Le chemin des étapes : la sienne en grand, un toucher pour changer */
      .chemin {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      .chemin button {
        width: 38px;
        height: 38px;
        padding: 0;
        border: none;
        border-radius: 50%;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        color: var(--ec);
        background: #fff;
        box-shadow: inset 0 0 0 2.5px var(--ec);
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.2s;
      }
      .chemin button.passee {
        color: #fff;
        background: var(--ec);
        opacity: 0.45;
        box-shadow: none;
      }
      .chemin button.ici {
        color: #fff;
        background: var(--ec);
        box-shadow: 0 8px 18px -8px var(--ec);
        transform: scale(1.25);
      }
      .sons {
        margin: 14px 0 0;
        min-height: 20px;
        font-size: 15px;
        color: var(--soft);
      }

      /* --- Fin de partie --- */
      .galerie {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 4px auto 20px;
        max-width: 330px;
      }
      .galerie img {
        width: 96px;
        height: 96px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 10px 20px -12px rgba(60, 40, 110, 0.55);
      }
      .bravo {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
      }
      .fin-etape {
        margin-top: 14px;
      }

      /* --- Le gros bouton : micro, puis flèche, puis rejouer --- */
      .controls {
        display: grid;
        justify-items: center;
        gap: 10px;
        padding-bottom: 4px;
      }
      .go {
        position: relative;
        width: 96px;
        height: 96px;
        border: none;
        border-radius: 50%;
        padding: 0;
        color: #fff;
        background: linear-gradient(145deg, var(--go-a), var(--go-b));
        box-shadow: 0 14px 30px -10px rgba(140, 92, 255, 0.7);
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.15s;
      }
      .go:active {
        transform: scale(0.93);
      }
      .go:focus-visible {
        outline: 4px solid rgba(140, 92, 255, 0.4);
        outline-offset: 4px;
      }
      .go svg {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 44px;
        height: 44px;
        opacity: 0;
        transform: scale(0.5) rotate(-30deg);
        transition:
          opacity 0.25s,
          transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
      }
      .go[data-mode="start"] .i-mic,
      .go[data-mode="listen"] .i-mic,
      .go[data-mode="idle"] .i-mic,
      .go[data-mode="next"] .i-next,
      .go[data-mode="replay"] .i-replay,
      .go[data-mode="denied"] .i-off {
        opacity: 1;
        transform: none;
      }
      .go[data-mode="idle"],
      .go[data-mode="denied"] {
        background: linear-gradient(145deg, #b9b0cc, #8f86a8);
        box-shadow: 0 12px 26px -12px rgba(60, 50, 90, 0.6);
      }
      .go[data-mode="next"] {
        background: linear-gradient(145deg, #2fcf8e, #1e9bf0);
        box-shadow: 0 14px 30px -10px rgba(30, 155, 240, 0.7);
      }
      /* Les ondes : le micro écoute */
      .waves {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .waves i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #b48cff;
        opacity: 0;
      }
      .go[data-mode="listen"] .waves i {
        animation: wave 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      }
      .go[data-mode="listen"] .waves i:nth-child(2) {
        animation-delay: 0.8s;
      }
      .go[data-mode="listen"] .waves i:nth-child(3) {
        animation-delay: 1.6s;
      }
      @keyframes wave {
        0% {
          transform: scale(1);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      .go[data-mode="start"] {
        animation: invite 2.2s ease-in-out infinite;
      }
      @keyframes invite {
        50% {
          transform: scale(1.06);
        }
      }
      .hint {
        min-height: 22px;
        font-size: 17px;
        font-weight: 700;
        color: var(--soft);
        text-align: center;
      }

      @media (hover: hover) {
        .go:hover {
          transform: scale(1.04);
        }
      }

      @media (max-height: 680px) {
        .card {
          padding: 16px 12px 20px;
        }
        .go {
          width: 84px;
          height: 84px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ambient i,
        .dots i.now,
        .mot.next::after,
        .relire .mot.rate,
        .mot.pouce .ouie,
        .go[data-mode="start"],
        .go[data-mode="listen"] .waves i,
        .demo .mot::after,
        .demo .mot::before,
        .demo .bulle {
          animation: none;
        }
        .mot.next::after {
          opacity: 1;
        }
        .demo .mot::after {
          opacity: 1;
        }
        .demo .mot::before {
          transform: scaleX(1);
        }
        .demo .bulle {
          opacity: 0;
        }
        .mot::before {
          transition: none;
        }
      }

      #confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
    <main class="app">
      <header class="bar" id="bar" hidden>
        <div class="etape" id="etape"></div>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </header>
      <section class="stage" id="stage" aria-live="polite"></section>
      <div class="controls">
        <button class="go" id="go" data-mode="start" aria-label="Commencer">
          <span class="waves" aria-hidden="true"><i></i><i></i><i></i></span>
          <svg
            class="i-mic"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <rect
              x="8.5"
              y="2.5"
              width="7"
              height="12"
              rx="3.5"
              fill="currentColor"
            />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" />
          </svg>
          <svg
            class="i-off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <rect
              x="8.5"
              y="2.5"
              width="7"
              height="12"
              rx="3.5"
              fill="currentColor"
              opacity="0.55"
            />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M4 3l16 18" />
          </svg>
          <svg
            class="i-next"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4.5 12h14M13 6l6 6-6 6" />
          </svg>
          <svg
            class="i-replay"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5" />
            <path d="M4 3.5v4.5h4.5" />
          </svg>
        </button>
        <div class="hint" id="hint"></div>
      </div>
    </main>
    <canvas id="confetti"></canvas>

    <script src="confetti.js"></script>
    <script>
      // --- Les phrases ---
      // Elles suivent la progression des sons du CP, puis s'allongent jusqu'au
      // CE1. Dans le texte, « / » sépare les syllabes et les lettres muettes
      // sont entre parenthèses : « Le ra(t) li(t). ». Seules les étapes qui
      // montrent ces aides (les AIDES premières) ont besoin de ce marquage.
      // Chaque phrase a son image dans images/phrases/ (outils/scenes.py) et
      // chacun de ses mots sa voix dans audio/reading-game/ (outils/voix.py).
      const ETAPES = [
        {
          sons: "a, i, o, u, é, l, r, m, s",
          phrases: [
            { phrase: "Le la/ma ri(t).", image: "lama-rit" },
            { phrase: "Le ra(t) li(t).", image: "rat-lit" },
            { phrase: "Le la/ma ra/m(e).", image: "lama-rame" },
            { phrase: "Li/li ri(t) sur la mu/l(e).", image: "lili-mule" },
            { phrase: "Ré/mi e(st) sur le mur.", image: "remi-mur" },
            { phrase: "Lo/la li(t) sur le sol.", image: "lola-sol" },
            { phrase: "La mu/l(e) a sa/li le li(t).", image: "mule-lit" },
            {
              phrase: "Sa/mi a mi(s) le ri(z) sur le sol.",
              image: "sami-riz",
            },
          ],
        },
        {
          sons: "ch, f, v, j, n, p, t, d, ou",
          phrases: [
            { phrase: "La va/ch(e) li(t).", image: "vache-lit" },
            {
              phrase: "Le cha(t) a vu u/n(e) sou/ri(s).",
              image: "chat-souris",
            },
            { phrase: "La pou/l(e) jou(e) du tu/ba.", image: "poule-tuba" },
            { phrase: "Le lou(p) a u/n(e) mo/to.", image: "loup-moto" },
            { phrase: "Pa/pa dor(t) sur le so/fa.", image: "papa-sofa" },
            { phrase: "La tor/tu(e) a u/n(e) ju/p(e).", image: "tortue-jupe" },
            {
              phrase: "Le cha(t) dor(t) sur la ni/ch(e).",

      ]
      const AIDES = 4 // les étapes 1 à 4 montrent syllabes et lettres muettes
      const PAR_PARTIE = 5
      const ETAPE_COULEURS = [
        "#22b07d",
        "#1e9bf0",
        "#6b6bff",
        "#b05cff",
        "#f08a24",

      ]

      // Les couleurs que prend chaque mot une fois lu : la phrase finie est un
      // ruban d'arc-en-ciel. La bulle du mot a la même couleur.
      const COLORS = [
        ["#ff5d8f", "#ff7a6b"],
        ["#ff7a45", "#ffa230"],
        ["#e8a10c", "#f5c02a"],

      )

      // Réglages de la progression et de l'aide (affichés dans le journal)

      const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)")
      const calme = () => motionQuery.matches
      Voice.folder = "audio/reading-game/"

      function el(tag, className = "", text = "") {
        const node = document.createElement(tag)

      function paint(node, index) {

      // --- La progression, gardée sur l'appareil ---
      const progres = { etape: 1, serie: 0, vues: {} }
      try {

      } catch {}
      progres.etape = Math.min(Math.max(progres.etape | 0, 1), ETAPES.length)

      // --- Le journal vocal, pour régler la reconnaissance sur un vrai
      // appareil. Caché : 7 touches rapides sur le titre de l'accueil
      // l'allument ou l'éteignent. Éteint, il ne garde rien de ce que dit
      // l'enfant.
      let debug = false
      try {
        debug = localStorage.getItem("lecture-debug") === "1"
      } catch {}
      const lignes = []
      let panneau = null

      function journal(evt, detail = "") {
        if (!debug) return
        const t = new Date().toTimeString().slice(0, 8)
        lignes.push(`${t} ${evt} ${detail}`)
        if (lignes.length > 400) lignes.shift()
        panneau ??= creerPanneau()
        panneau.lastChild.textContent = lignes.slice(-8).join("\n")
      }

      function creerPanneau() {
        const root = el("div")
        root.style.cssText =
          "position:fixed;left:0;right:0;top:0;z-index:99;" +

          "padding:4px 6px;pointer-events:none;white-space:pre-wrap;word-break:break-all;"
        const bouton = (label, onClick) => {

            "pointer-events:auto;font:inherit;color:#fff;background:#444;" +
            "border:1px solid #888;border-radius:4px;padding:2px 8px;margin:0 6px 2px 0;"

          return b
        }
        const copier = bouton("Copier le journal", () =>
          navigator.clipboard?.writeText(lignes.join("\n")).then(

          copier,

      function basculerDebug(on) {
        debug = on
        try {

          else localStorage.removeItem("lecture-debug")

        if (on) {
          journal(
            "appareil",
            `${navigator.userAgent} | appli=${matchMedia("(display-mode: standalone)").matches} | reco=${Boolean(Reco)}`,
          )
          journal(
            "réglages",
            `rapide<${RAPIDE}s/mot série=${SERIE} pouce=${POUCE}ms`,
          )
          return
        }
        lignes.length = 0
        panneau?.remove()
        panneau = null
      }

      // --- Comparer ce que dit l'enfant aux mots de la phrase ---
      const sansAccents = (s) => s.normalize("NFD").replace(/\p{M}/gu, "")
      const normaliser = (s) =>
        sansAccents(s.toLowerCase()).replace(/[^a-z0-9]/g, "")

      const NOMBRES =
        "zéro un deux trois quatre cinq six sept huit neuf dix onze douze treize quatorze quinze seize".split(
          " ",
        )

      // Ce que la reconnaissance a écrit, en mots
      function jetons(transcript) {
        return transcript
          .toLowerCase()
          .replace(/’/g, "'")
          .split(/[^\p{L}\p{N}']+/u)
          .filter(Boolean)
          .map((j) => (/^\d+$/.test(j) && NOMBRES[j]) || j)
      }

      // Une clé de prononciation, grossière mais suffisante pour accepter les
      // homophones (« rit », « riz », « ri ») et les fautes d'orthographe de la
      // reconnaissance (« Lily » pour « Lili »). Les deux côtés passent par la
      // même moulinette : une règle imparfaite reste cohérente. Les sons
      // s'écrivent en majuscules (E pour é, è, ai…), pour ne pas se confondre
      // avec les lettres qui restent à lire.
      const V = "aeiouyE@" // @ : un e muet final, retiré à la fin
      const REGLES = [
        [/ch/g, "S"],
        [/ph/g, "f"],
        [/h/g, ""],
        [/gn/g, "N"],
        [/qu/g, "k"],
        [/gu(?=[eiyE])/g, "g"],
        [/c(?=[eiyE])/g, "s"],
        [/ge(?=[aou])/g, "j"],
        [/g(?=[eiyE])/g, "j"],
        [new RegExp(`([${V}])s(?=[${V}])`, "g"), "$1z"],
        [/eau|au/g, "o"],
        // Les nasales avant les autres voyelles doubles : « grenouille »
        // garde son n, « pingouin » son « in ».
        [new RegExp(`oin(?![${V}n])`, "g"), "WI"],
        [new RegExp(`ien(?![${V}n])`, "g"), "JI"],
        [new RegExp(`(ain|aim|ein|in|im|un|um|yn|ym)(?![${V}nm])`, "g"), "I"],
        [new RegExp(`(an|am|en|em)(?![${V}nm])`, "g"), "A"],
        [new RegExp(`(on|om)(?![${V}nm])`, "g"), "O"],
        [/oi/g, "Wa"],
        [new RegExp(`([${V}])ill`, "g"), "$1J"],
        [/ill/g, "iJ"],
        [/ou/g, "U"],
        [/eu/g, "2"],
        [/ai|ei/g, "E"],
        [/y/g, "i"],
        [/u/g, "Y"],
        [/[ckq]/g, "k"],
        [/@/g, ""],
        [/(.)\1+/g, "$1"],
      ]

      function cle(mot) {
        let s = sansAccents(
          mot
            .toLowerCase()
            .replace(/œu/g, "eu")
            .replace(/œ/g, "e")
            .replace(/ç/g, "s")
            .replace(/[éèêë]/g, "E"),
        ).replace(/[^a-zE]/g, "")
        if (s === "est") return "E"
        // Les finales qu'on n'entend pas, sur la graphie : le pluriel, puis
        // « er », « ez », « et » (é), le e muet (la consonne d'avant se dit :
        // « vache », « toutes ») ou les consonnes muettes (« chat », « riz »).
        if (s.length > 2) s = s.replace(/[sx]$/, "")
        if (/(er|ez|et)$/.test(s)) s = s.slice(0, -2) + "E"
        else if (/.e$/.test(s)) s = s.slice(0, -1) + "@"
        else s = s.replace(/(.)[stdpzx]+$/, "$1")
        for (const [motif, remplacement] of REGLES)
          s = s.replace(motif, remplacement)
        return s
      }

      // Un son de plus ou de moins (« p'tit » pour « petit ») passe ; un son
      // à la place d'un autre (« château » pour « chapeau ») ne passe pas.
      function unSonDePlus(a, b) {
        if (a.length < b.length) [a, b] = [b, a]
        if (a.length !== b.length + 1) return false
        for (let i = 0; i < a.length; i++)
          if (a.slice(0, i) + a.slice(i + 1) === b) return true
        return false
      }

      function colle(c, mot) {
        return c === mot.cle || (mot.cle.length >= 4 && unSonDePlus(c, mot.cle))
      }

      // Aligne ce qui a été dit sur toute la phrase (un enfant reprend souvent
      // depuis le début) : le plus de mots possible, en préférant les mots pas
      // encore lus, puis les plus proches du début. Deux jetons collés peuvent
      // faire un mot (« au tour » pour « autour »).
      function aligner(T) {
        const m = T.length
        const n = mots.length
        const poids = mots.map((w) => (w.etat === "todo" || w.etat === "rate" ? 101 : 100))
        const cles = T.map(cle)
        const cles2 = T.map((t, i) => i + 1 < m && cle(t + T[i + 1]))
        const un = cles.map((c) => mots.map((w) => colle(c, w)))
        const deux = cles2.map((c) => mots.map((w) => c === w.cle))
        const dp = Array.from({ length: m + 2 }, () => new Array(n + 1).fill(0))
        for (let i = m - 1; i >= 0; i--)
          for (let j = n - 1; j >= 0; j--) {
            let best = Math.max(dp[i + 1][j], dp[i][j + 1])
            if (un[i][j]) best = Math.max(best, poids[j] + dp[i + 1][j + 1])
            if (deux[i][j]) best = Math.max(best, poids[j] + dp[i + 2][j + 1])
            dp[i][j] = best
          }
        const paires = []
        let i = 0
        let j = 0
        while (i < m && j < n) {
          if (un[i][j] && dp[i][j] === poids[j] + dp[i + 1][j + 1]) {
            paires.push(j++)
            i++
          } else if (deux[i][j] && dp[i][j] === poids[j] + dp[i + 2][j + 1]) {
            paires.push(j++)
            i += 2
          } else if (dp[i][j] === dp[i + 1][j]) i++
          else j++
        }
        return paires
      }

      // Ce que l'alignement change à la phrase. Un mot entendu plus loin que
      // le prochain à lire fait « rater » ceux d'entre-deux (à relire à la
      // fin), sauf si le saut paraît douteux : un petit mot isolé loin devant
      // vient plus sûrement d'un bruit.
      function planifier(paires) {
        const etats = mots.map((w) => w.etat)
        const vus = new Set(paires)
        const actions = []
        const refus = []
        for (const j of paires) {
          if (etats[j] === "rate") {
            etats[j] = "lu"
            actions.push([j, "lu"])
            continue
          }
          if (etats[j] !== "todo") continue
          const sautes = []
          for (let k = etats.indexOf("todo"); k < j; k++)
            if (etats[k] === "todo") sautes.push(k)
          const net = mots[j].cle.length >= 3
          const suivi = vus.has(j + 1)
          if (
            sautes.length &&
            !(sautes.length <= 2 && (net || suivi)) &&
            !(net && suivi)
          ) {
            refus.push(`${mots[j].texte}(+${sautes.length})`)
            continue
          }
          for (const k of sautes) {
            etats[k] = mots[k].outil ? "lu" : "rate"
            actions.push([k, etats[k], "saute"])
          }
          etats[j] = "lu"
          actions.push([j, "lu"])
        }
        const score = actions.filter((a) => a[1] === "lu").length
        return { actions, score, refus }
      }

      // --- L'écoute ---
      // Inspirée du micro de Tablito, éprouvé sur Pixel et iPhone : des
      // sessions courtes (continuous: false), relancées à chaque fin ; un
      // abort() demandé avant onstart attend onstart (Android le perdait et le
      // micro restait bloqué) ; des fins à vide en rafale (iOS au premier
      // octroi du micro) coupent la boucle au lieu de figer la page.
      const Reco = window.SpeechRecognition || window.webkitSpeechRecognition

      function creerEcoute({ entendu, refus, repos }) {
        let rec = null
        let veut = false
        let phase = "idle" // idle, starting, starting-then-abort, listening
        let debut = 0
        let vides = 0
        let coinces = 0
        let dernierSon = 0
        let relance = null
        let garde = null

        function lancer(delai = 0) {
          clearTimeout(relance)
          if (!delai) return maintenant()
          relance = setTimeout(() => {
            if (veut && phase === "idle") maintenant()
          }, delai)
        }

        function decoincer(pourquoi) {
          journal("reco:coincé", pourquoi)
          phase = "idle"
          try {
            rec.abort()
          } catch {}
          if (coinces++ < 3) lancer(1000)
        }

        function maintenant() {
          debut = Date.now()
          phase = "starting"
          try {
            rec.start()
          } catch (e) {
            return decoincer(String(e))
          }
          clearTimeout(garde)
          garde = setTimeout(() => {
            if (phase.startsWith("starting")) decoincer("pas de onstart")
          }, 4000)
        }

        function creer() {
          rec = new Reco()
          rec.lang = "fr-FR"
          rec.interimResults = true
          rec.continuous = false
          rec.maxAlternatives = 5
          rec.onstart = () => {
            journal("reco:onstart")
            clearTimeout(garde)
            coinces = 0
            const annuler = phase === "starting-then-abort"
            phase = "listening"
            if (annuler) rec.abort()
          }
          rec.onresult = (event) => {
            dernierSon = Date.now()
            const resultats = Array.from(event.results)
            const dernier = resultats[resultats.length - 1]
            const avant = resultats
              .slice(0, -1)
              .map((r) => r[0].transcript)
              .join(" ")
            const variantes = Array.from(dernier, (alt) =>
              `${avant} ${alt.transcript}`.trim(),
            )
            journal(
              dernier.isFinal ? "reco:final" : "reco:interim",
              JSON.stringify(variantes),
            )
            entendu(variantes)
          }
          rec.onerror = (event) => {
            journal("reco:error", event.error)
            if (
              event.error === "not-allowed" ||
              event.error === "service-not-allowed"
            ) {
              veut = false
              refus()
            }
            // no-speech, aborted, network… : onend relance
          }
          rec.onend = () => {
            phase = "idle"
            clearTimeout(garde)
            if (!veut) return
            const duree = Date.now() - debut
            vides = duree < 500 ? vides + 1 : 0
            journal("reco:onend", `${duree} ms, vides=${vides}`)
            if (vides >= 5 || Date.now() - dernierSon > SILENCE_MAX) {
              journal("reco:repos")
              veut = false
              return repos()
            }
            lancer(vides ? 400 : 0)
          }
        }

        return {
          start() {
            if (!rec) creer()
            journal("reco:start")
            veut = true
            vides = 0
            dernierSon = Date.now()
            if (phase === "starting-then-abort") phase = "starting"
            if (phase !== "idle") return
            coinces = 0
            lancer()
          },
          abort() {
            if (!rec) return
            journal("reco:abort")
            veut = false
            clearTimeout(relance)
            if (phase.startsWith("starting")) {
              phase = "starting-then-abort"
              return
            }
            try {
              rec.abort()
            } catch {}
          },
        }
      }

      // --- Les sons : une bulle qui éclate, de plus en plus aiguë le long de
      // la phrase (gamme pentatonique), et un accord à la fin ---
      const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760]

      // glisse : la note part de freq × glisse et y redescend aussitôt
      function tone(freq, at, length = 0.5, volume = 0.07, glisse = 1) {
        const ctx = Voice.wake(1500)
        if (!ctx) return
        const t = ctx.currentTime + at
        const osc = ctx.createOscillator()
        const gain = ctx.createGain()
        osc.type = "triangle"
        osc.frequency.setValueAtTime(freq * glisse, t)
        osc.frequency.exponentialRampToValueAtTime(freq, t + 0.08)
        gain.gain.setValueAtTime(0, t)
        gain.gain.linearRampToValueAtTime(volume, t + 0.015)
        gain.gain.exponentialRampToValueAtTime(0.0001, t + length)
        osc.connect(gain).connect(ctx.destination)
        osc.start(t)
        osc.stop(t + length + 0.05)
      }

      const chord = (notes) =>
        notes.forEach((n, i) => tone(NOTES[n], i * 0.09, 0.9))

      const pop = (index) => tone(NOTES[index % NOTES.length], 0, 0.3, 0.13, 1.7)

      // --- L'interface ---
      function card() {
        const div = el("div", "card")
        $("stage").replaceChildren(div)
        return div
      }

      const ICONE_ETAPE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`
      const ICONE_OUIE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`

      function badge(node, suffixe = "") {
        node.style.setProperty("--ec", ETAPE_COULEURS[progres.etape - 1])
        node.innerHTML = `${ICONE_ETAPE}Étape ${progres.etape}${suffixe}`
      }

      // Le papier bulle : une bulle par mot, en rangées qui couvrent toute
      // l'image. Les bulles sont mélangées, pour que l'image se découvre par
      // morceaux épars plutôt que dans l'ordre de lecture.
      function papierBulle(tableau, n) {
        const rangees = Math.max(1, Math.round(Math.sqrt(n)))
        const places = []
        for (let r = 0; r < rangees; r++) {
          const nb =
            Math.floor(n / rangees) + (r < n % rangees ? 1 : 0)
          for (let k = 0; k < nb; k++) places.push([r, k, nb])
        }
        for (let i = places.length - 1; i > 0; i--) {
          const k = Math.floor(Math.random() * (i + 1))
          ;[places[i], places[k]] = [places[k], places[i]]
        }
        return places.map(([r, k, nb], j) => {
          const bulle = el("i", "bulle")
          // Le dôme, rond : 74 % du plus petit côté de la case
          bulle.style.cssText = `top:${(r * 100) / rangees}%;height:calc(${100 / rangees}% + 1px);left:${(k * 100) / nb}%;width:calc(${100 / nb}% + 1px);--w:${74 * Math.min(1, nb / rangees)}%;--h:${74 * Math.min(1, rangees / nb)}%`
          // Le centre de la bulle, d'où partent ses étincelles
          bulle.centre = [((k + 0.5) * 100) / nb, ((r + 0.5) * 100) / rangees]
          paint(bulle, j)
          tableau.append(bulle)
          return bulle
        })
      }

      function lirePhrase(phrase) {
        return phrase.split(" ").map((brut) => {
          const ponct = (brut.match(/[.,!?;:]+$/) || [""])[0]
          const syllabes = brut.slice(0, brut.length - ponct.length).split("/")
          const texte = syllabes.join("").replace(/[()]/g, "")
          return {
            syllabes,
            ponct,
            texte,
            audio: texte.toLowerCase(),
            cle: cle(texte),
            outil: OUTILS.has(normaliser(texte)),
            etat: "todo",
          }
        })
      }

      function motEl(mot, j) {
        const span = el("span", "mot")
        paint(span, j)
        for (const syllabe of mot.syllabes) {
          const syl = el("span", "syl")
          for (const part of syllabe.split(/(\([^)]*\))/)) {
            if (part.startsWith("(")) syl.append(el("span", "muet", part.slice(1, -1)))
            else if (part) syl.append(part)
          }
          span.append(syl)
        }
        if (mot.ponct) span.append(el("span", "ponct", mot.ponct))
        const ouie = el("span", "ouie")
        ouie.innerHTML = ICONE_OUIE
        span.append(ouie)
        span.addEventListener("click", () => toucherMot(j))
        return span
      }

      function afficherPhrase(phrase) {
        mots = lirePhrase(phrase.phrase)
        const box = card()
        const tableau = el("div", "tableau")
        const img = new Image()
        img.src = `images/phrases/${phrase.image}.webp`
        img.alt = ""
        img.onerror = () => img.remove()
        tableau.append(img)
        const bulles = papierBulle(tableau, mots.length)
        const n = mots.length
        const ligne = el(
          "div",
          "phrase" +
            (progres.etape <= AIDES ? " aides" : "") +
            (n > 10 ? " longue" : n > 6 ? " moyenne" : ""),
        )
        ligne.id = "phrase"
        mots.forEach((mot, j) => {
          mot.el = motEl(mot, j)
          mot.bulle = bulles[j]
          ligne.append(mot.el)
          Voice.load(mot.audio).then(
            (son) => son || journal("audio manquant", mot.audio),
          )
        })
        box.append(tableau, ligne)
        tailleTableau()
      }

      // L'image prend la place que la phrase laisse dans la carte, sans faire
      // défiler la page.
      function tailleTableau() {
        const tableau = document.querySelector(".card > .tableau")
        if (!tableau) return
        const carte = tableau.parentElement
        tableau.style.display = "none"
        const reste =
          $("stage").clientHeight - carte.offsetHeight - 18 - 20
        const cote = Math.min(300, carte.clientWidth - 32, reste)
        tableau.style.display = ""
        tableau.style.width = `${Math.max(110, cote)}px`
      }
      window.addEventListener("resize", tailleTableau)

      function marquerSuivant() {
        const k = mots.findIndex((w) => w.etat === "todo")
        mots.forEach((w, j) => w.el.classList.toggle("next", j === k))
        const relire = k < 0 && mots.some((w) => w.etat === "rate")
        $("phrase").classList.toggle("relire", relire)
        if ($("go").dataset.mode === "listen")
          $("hint").textContent = relire
            ? "Relis les mots en pointillés"
            : "Lis la phrase"
      }

      function crever(mot, j) {
        if (mot.eclate) return
        mot.eclate = true
        pop(j)
        if (calme()) return mot.bulle.classList.add("creve")
        mot.bulle
          .animate(
            [
              { transform: "scale(1)", opacity: 1 },
              { transform: "scale(1.3)", opacity: 0 },
            ],
            { duration: 320, easing: "ease-out" },
          )
          .finished.then(() => mot.bulle.classList.add("creve"))
        etincelles(mot.bulle)
      }

      // Quelques étincelles autour d'une bulle qui éclate
      function etincelles(bulle, nombre = 6, portee = 40) {
        const [x, y] = bulle.centre
        for (let i = 0; i < nombre; i++) {
          const spark = el("span", "spark")
          spark.style.left = `${x}%`
          spark.style.top = `${y}%`
          spark.style.setProperty("--c", bulle.style.getPropertyValue("--c"))
          bulle.parentElement.append(spark)
          const angle = (i / nombre) * Math.PI * 2 + Math.random() * 0.6
          const dist = portee * (0.7 + Math.random() * 0.6)
          spark
            .animate(
              [
                { transform: "translate(0, 0) scale(1)", opacity: 1 },
                {
                  transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist * 0.75}px) scale(0.2)`,
                  opacity: 0,
                },
              ],
              {
                duration: 550 + Math.random() * 200,
                easing: "cubic-bezier(.2,.7,.3,1)",
              },
            )
            .finished.then(() => spark.remove())
        }
      }

      function allumer(mot) {
        if (calme()) return
        mot.el.animate(
          [
            { transform: "scale(1)" },
            { transform: "scale(1.14)", offset: 0.4 },
            { transform: "scale(1)" },
          ],
          { duration: 420, easing: "ease-out" },
        )
        const ring = el("span", "ring")
        mot.el.append(ring)
        ring
          .animate(
            [
              { transform: "scale(1)", opacity: 0.9 },
              { transform: "scale(1.3, 1.5)", opacity: 0 },
            ],
            { duration: 600, easing: "ease-out" },
          )
          .finished.then(() => ring.remove())
      }

      // Le gros bouton change de rôle au fil de la partie :
      // start (micro), listen (micro qui écoute), idle (micro au repos, à
      // toucher pour relancer l'écoute), denied (micro barré), next, replay.
      const MODES = {
        start: ["Commencer", "Touche le micro"],
        listen: ["J'écoute", "Lis la phrase"],
        idle: ["Relancer le micro", "Touche le micro"],
        denied: ["Micro indisponible", "Il faut le micro"],
        next: ["Phrase suivante", ""],
        replay: ["Rejouer", ""],
      }

      function setMode(mode) {
        const go = $("go")
        go.dataset.mode = mode
        const [label, hint] = MODES[mode]
        go.setAttribute("aria-label", label)
        $("hint").textContent = hint
      }

      // Le navigateur a entendu quelque chose : le micro bat une fois.
      let heartbeat
      function battre() {
        if (calme() || heartbeat?.playState === "running") return
        heartbeat = $("go").animate(
          [
            { transform: "scale(1)" },
            { transform: "scale(1.08)" },
            { transform: "scale(1)" },
          ],
          { duration: 260, easing: "ease-out" },
        )
      }

      function secouer() {
        $("go").animate(
          [
            { transform: "translateX(0)" },
            { transform: "translateX(-8px)" },
            { transform: "translateX(8px)" },
            { transform: "translateX(-5px)" },
            { transform: "translateX(0)" },
          ],
          { duration: 380 },
        )
      }

      // --- L'accueil ---
      function accueil() {
        const home = card()
        const titre = el("h1", "title", "Lis à voix haute")
        titre.addEventListener("click", toucherTitre)
        const demo = el("div", "demo")
        const tableau = el("div", "tableau")
        const img = new Image()
        img.src = "images/phrases/lama-rit.webp"
        img.alt = ""
        tableau.append(img)
        const phrase = el("div", "phrase")
        const demoMots = ["Je", "lis", "tout", "haut"]
        papierBulle(tableau, demoMots.length).forEach((bulle, i) => {
          bulle.style.setProperty("--i", i)
          const mot = el("span", "mot", demoMots[i])
          mot.dataset.t = demoMots[i]
          paint(mot, i)
          mot.style.setProperty("--i", i)
          phrase.append(mot)
        })
        demo.append(tableau, phrase)
        const chemin = el("div", "chemin")
        ETAPES.forEach((_, i) => {
          const b = el("button", "", String(i + 1))
          b.type = "button"
          b.setAttribute("aria-label", `Étape ${i + 1}`)
          b.style.setProperty("--ec", ETAPE_COULEURS[i])
          b.addEventListener("click", () => {
            progres.etape = i + 1
            progres.serie = 0
            sauver()
            dessinerChemin()
          })
          chemin.append(b)
        })
        home.append(
          titre,
          el("p", "subtitle", "Ta voix fait éclater les bulles."),
          demo,
          chemin,
          el("p", "sons"),
        )
        dessinerChemin()
        $("bar").hidden = true
      }

      function dessinerChemin() {
        document.querySelectorAll(".chemin button").forEach((b, i) => {
          b.classList.toggle("ici", i + 1 === progres.etape)
          b.classList.toggle("passee", i + 1 < progres.etape)
        })
        document.querySelector(".sons").textContent =
          `Étape ${progres.etape} : ${ETAPES[progres.etape - 1].sons}`
      }

      // 7 touches rapprochées sur le titre : le journal vocal (comme les
      // options pour les développeurs d'Android, et Tablito)
      const touches = { nombre: 0, derniere: 0 }
      function toucherTitre() {
        const now = Date.now()
        touches.nombre = now - touches.derniere > 1000 ? 1 : touches.nombre + 1
        touches.derniere = now
        if (touches.nombre < 7) return
        touches.nombre = 0
        basculerDebug(!debug)
        $("hint").textContent = debug
          ? "Journal vocal activé"
          : "Journal vocal désactivé"
      }

      // --- La partie ---
      let mots = []
      let partie = null
      let enCours = false // une phrase est affichée et pas encore lue en entier
      let affichee = 0 // quand la phrase est apparue
      let minuteur = null
      const ecoute =
        Reco &&
        creerEcoute({
          entendu,
          refus: () => {
            eveil(false)
            setMode("denied")
            secouer()
          },
          repos: () => {
            eveil(false)
            setMode("idle")
          },
        })

      // Une phrase de l'étape, parmi les moins vues
      function choisirPhrase() {
        const deja = new Set(partie.phrases.map((p) => p.image))
        const liste = ETAPES[progres.etape - 1].phrases.filter(
          (p) => !deja.has(p.image),
        )
        const vues = (p) => progres.vues[p.image] || 0
        const min = Math.min(...liste.map(vues))
        const candidates = liste.filter((p) => vues(p) === min)
        return candidates[Math.floor(Math.random() * candidates.length)]
      }

      function commencer() {
        if (!Reco) return secouer()
        Voice.wake(500)
        partie = { phrases: [], etapeDepart: progres.etape }
        const dots = $("dots")
        dots.replaceChildren()
        for (let i = 0; i < PAR_PARTIE; i++) {
          const dot = el("i")
          paint(dot, i * 2)
          dots.append(dot)
        }
        nouvellePhrase()
      }

      function nouvellePhrase() {
        const phrase = choisirPhrase()
        partie.phrases.push(phrase)
        $("bar").hidden = false
        badge($("etape"))
        document.querySelectorAll("#dots i").forEach((dot, i) => {
          dot.classList.toggle("done", i < partie.phrases.length - 1)
          dot.classList.toggle("now", i === partie.phrases.length - 1)
        })
        afficherPhrase(phrase)
        journal("phrase", `étape ${progres.etape} : ${phrase.phrase}`)
        enCours = true
        affichee = Date.now()
        ecouter()
        attendrePouce()
      }

      // L'écran reste allumé tant que le micro écoute : l'enfant lit sans
      // toucher l'écran.
      function eveil(on) {
        window.KeepAwake?.setActive(on)
      }

      function ecouter() {
        eveil(true)
        ecoute.start()
        setMode("listen")
        marquerSuivant()
      }

      function entendu(variantes) {
        if (!enCours) return
        battre()
        let plan = null
        for (const v of variantes) {
          const p = planifier(aligner(jetons(v)))
          if (!plan || p.score > plan.score) plan = p
        }
        if (plan.refus.length) journal("saut refusé", plan.refus.join(" "))
        if (!plan.actions.length) return
        journal(
          "mots",
          plan.actions.map(([j, etat]) => `${mots[j].texte}=${etat}`).join(" "),
        )
        for (const [j, etat, saute] of plan.actions) poser(j, etat, saute)
        avancer()
      }

      function poser(j, etat, saute) {
        const mot = mots[j]
        mot.el.classList.remove("rate", "pouce")
        mot.etat = etat
        if (etat === "rate") {
          mot.rate = true
          mot.el.classList.add("rate")
          return
        }
        mot.el.classList.add(etat)
        crever(mot, j)
        if (!saute) allumer(mot)
        if (window.ExitGuard) ExitGuard.setActive(true)
      }

      function avancer() {
        attendrePouce()
        mots.forEach((w) => w.el.classList.remove("pouce"))
        if (mots.every((w) => w.etat === "lu" || w.etat === "aide"))
          return finPhrase()
        marquerSuivant()
      }

      // Toucher un mot le fait dire par Marie. Pas encore lu, il compte comme
      // lu avec de l'aide.
      function toucherMot(j) {
        const mot = mots[j]
        Voice.say(mot.audio)
        if (!enCours || (mot.etat !== "todo" && mot.etat !== "rate")) return
        journal("aide", mot.texte)
        poser(j, "aide")
        avancer()
      }

      function attendrePouce() {
        clearTimeout(minuteur)
        minuteur = setTimeout(coupDePouce, POUCE)
      }

      // L'enfant n'avance plus : le mot qui bloque propose qu'on l'écoute.
      function coupDePouce() {
        if (!enCours) return
        const mot =
          mots.find((w) => w.etat === "todo") ||
          mots.find((w) => w.etat === "rate")
        if (!mot) return
        journal("coup de pouce", mot.texte)
        mot.el.classList.add("pouce")
        $("hint").textContent = "Touche le mot pour l'entendre"
      }

      function finPhrase() {
        enCours = false
        clearTimeout(minuteur)
        ecoute.abort()
        eveil(false)
        const n = mots.length
        const aides = mots.filter((w) => w.etat === "aide").length
        const rates = mots.filter((w) => w.rate).length
        // Le temps de lecture se compte depuis l'affichage, moins le temps de
        // s'y mettre : certains navigateurs ne livrent les mots qu'à la fin.
        const rythme = Math.max(0, Date.now() - affichee - DEMARRAGE) / 1000 / n
        const phrase = partie.phrases[partie.phrases.length - 1]
        progres.vues[phrase.image] = (progres.vues[phrase.image] || 0) + 1
        const avant = progres.etape
        const verdict = ajuster(n, aides, rates, rythme)
        sauver()
        journal(
          "fin",
          `aides=${aides} ratés=${rates} rythme=${rythme.toFixed(2)}s/mot → ${verdict}, étape ${progres.etape}, série ${progres.serie}`,
        )
        celebrer()
        setMode("next")
        if (progres.etape > avant) {
          badge($("etape"))
          $("hint").textContent = `Bravo ! Étape ${progres.etape} !`
          if (!calme())
            $("etape").animate(
              [
                { transform: "scale(1)" },
                { transform: "scale(1.3)", offset: 0.4 },
                { transform: "scale(1)" },
              ],
              { duration: 600, delay: 500, easing: "ease-out" },
            )
          chord([2, 4, 6, 7, 9])
        } else chord([4, 6, 7, 9])
      }

      // Monter vite quand c'est trop facile, redescendre quand c'est trop dur.
      // Un mot raté l'est souvent par la reconnaissance plus que par
      // l'enfant : il empêche de monter, il ne fait pas descendre.
      function ajuster(n, aides, rates, rythme) {
        let verdict = "moyen"
        if (!aides && !rates && rythme < RAPIDE) verdict = "facile"
        else if (!aides && rates <= Math.max(1, Math.floor(n / 6))) verdict = "bien"
        else if (aides >= Math.max(2, Math.ceil(n / 3))) verdict = "dur"
        progres.serie = verdict === "bien" ? progres.serie + 1 : 0
        if (verdict === "facile" || progres.serie >= SERIE) {
          progres.etape = Math.min(ETAPES.length, progres.etape + 1)
          progres.serie = 0
        }
        if (verdict === "dur") progres.etape = Math.max(1, progres.etape - 1)
        return verdict
      }

      // La phrase est lue : les mots font la vague et l'image se dandine.
      function celebrer() {
        if (calme()) return
        mots.forEach((mot, i) =>
          mot.el.animate(
            [
              { transform: "translateY(0)" },
              { transform: "translateY(-10px)", offset: 0.35 },
              { transform: "translateY(0)" },
            ],
            { duration: 520, delay: 200 + i * 60, easing: "ease-in-out" },
          ),
        )
        document.querySelector(".card > .tableau").animate(
          [
            { transform: "scale(1) rotate(0)" },
            { transform: "scale(1.06) rotate(-2deg)", offset: 0.3 },
            { transform: "scale(1.04) rotate(2deg)", offset: 0.6 },
            { transform: "scale(1) rotate(0)" },
          ],
          { duration: 800, delay: 250, easing: "ease-in-out" },
        )
      }

      function suivante() {
        if (partie.phrases.length < PAR_PARTIE) return nouvellePhrase()
        if (window.ExitGuard) ExitGuard.setActive(false)
        const end = card()
        const galerie = el("div", "galerie")
        partie.phrases.forEach((phrase, i) => {
          const img = new Image()
          img.src = `images/phrases/${phrase.image}.webp`
          img.alt = ""
          galerie.append(img)
          if (!calme())
            img.animate(
              [
                { transform: "scale(0)", opacity: 0 },
                { transform: "scale(1.15)", opacity: 1, offset: 0.7 },
                { transform: "scale(1)", opacity: 1 },
              ],
              {
                duration: 420,
                delay: i * 110,
                easing: "ease-out",
                fill: "backwards",
              },
            )
        })
        const etape = el("div", "etape fin-etape")
        badge(etape, progres.etape > partie.etapeDepart ? " ↑" : "")
        end.append(
          galerie,
          el("p", "bravo", `Tu as lu ${PAR_PARTIE} phrases !`),
          etape,
        )
        $("bar").hidden = true
        setMode("replay")
        chord([0, 2, 4, 5, 7, 9])
        showConfetti()
      }

      $("go").addEventListener("click", () => {
        const mode = $("go").dataset.mode
        if (mode === "next") suivante()
        else if (mode === "start" || mode === "replay") commencer()
        else if (enCours && (mode === "idle" || mode === "denied")) ecouter()
        else if (mode === "denied") secouer()
      })
      document.addEventListener("keydown", (event) => {
        if (event.code !== "Space" && event.code !== "Enter") return
        if (event.target.closest("button")) return // le bouton se clique tout seul
        event.preventDefault()
        $("go").click()
      })

      accueil()
      setMode(Reco ? "start" : "denied")
      if (debug) basculerDebug(true)
      // Écran d'accueil : aucune partie en cours.
      if (window.ExitGuard) ExitGuard.setActive(false)
      eveil(false)
    </script>
  </body>
</html>
