<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff4ec" />
    <title>Lecture à voix haute</title>
    <script src="exit-guard.js"></script>
    <script src="voix.js"></script>
    <style>
      @font-face {
        font-family: "Andika";
        src: url("Andika-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Andika";
        src: url("Andika-Bold.woff2") format("woff2");
        font-weight: 700;
      }

      :root {
        --ink: #2d2545;
        --soft: #8a7fa6;
        --card: #ffffff;
        --go-a: #ff5d8f;
        --go-b: #8c5cff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Andika", Arial, sans-serif;
        color: var(--ink);
        background: #fff4ec;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Des taches de couleur qui dérivent doucement derrière tout. */
      .ambient {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .ambient i {
        position: absolute;
        width: 70vmax;
        height: 70vmax;
        border-radius: 50%;
        opacity: 0.55;
        animation: drift 26s ease-in-out infinite alternate;
      }
      .ambient i:nth-child(1) {
        background: radial-gradient(closest-side, #ffc2d6, transparent);
        left: -30vmax;
        top: -25vmax;
      }
      .ambient i:nth-child(2) {
        background: radial-gradient(closest-side, #c9d8ff, transparent);
        right: -35vmax;
        top: 10vmax;
        animation-duration: 32s;
        animation-delay: -10s;
      }
      .ambient i:nth-child(3) {
        background: radial-gradient(closest-side, #ffe2a8, transparent);
        left: -15vmax;
        bottom: -40vmax;
        animation-duration: 29s;
        animation-delay: -5s;
      }
      @keyframes drift {
        to {
          transform: translate(12vmax, 8vmax) scale(1.15);
        }
      }

      .app {
        position: relative;
        height: 100%;
        max-width: 640px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: max(12px, env(safe-area-inset-top)) 16px
          max(16px, env(safe-area-inset-bottom));
      }

      /* --- Barre du haut : la colonne du milieu ne bouge pas --- */
      .bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.75);
        font-weight: 700;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chip[hidden] {
        display: none;
      }
      .chip svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .timer {
        grid-column: 2;
        min-width: 92px;
        justify-content: center;
      }
      .record {
        grid-column: 3;
        justify-self: end;
        color: #b7791f;
      }

      /* Les 9 phrases, en trois paliers de couleur */
      .steps {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 14px 0 4px;
        min-height: 12px;
      }
      .steps[hidden] {
        visibility: hidden;
        display: flex;
      }
      .steps span {
        display: flex;
        gap: 5px;
      }
      .steps i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(45, 37, 69, 0.12);
        transition:
          transform 0.3s,
          background-color 0.3s;
      }
      .steps i.done {
        background: var(--c);
      }
      .steps i.now {
        background: var(--c);
        animation: breathe 1.6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.35);
          opacity: 0.6;
        }
      }

      /* --- La scène : une carte qui tient sans défiler --- */
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
      }
      .card {
        width: 100%;
        background: var(--card);
        border-radius: 28px;
        padding: 28px 18px 30px;
        box-shadow:
          0 1px 0 rgba(45, 37, 69, 0.04),
          0 18px 40px -18px rgba(90, 60, 140, 0.35);
        text-align: center;
        position: relative;
      }

      .sentence {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 8px;
        font-size: 27px;
        line-height: 1.15;
        font-weight: 700;
      }
      .hard .sentence {
        font-size: 24px;
      }
      .word {
        position: relative;
        display: inline-block;
        padding: 8px 12px 9px;
        border-radius: 16px;
        color: var(--ink);
        background: #f4f0fb;
        transition: color 0.25s 0.1s;
        isolation: isolate;
      }
      /* La couleur qui remplit le mot quand il est lu */
      .word::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(135deg, var(--c), var(--c2));
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.35s cubic-bezier(0.3, 0.7, 0.2, 1);
        z-index: -1;
      }
      /* Le prochain mot à lire : un trait qui respire dessous */
      .word::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 3px;
        height: 4px;
        border-radius: 2px;
        background: var(--c);
        opacity: 0;
        transform: scaleX(0.4);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .word.next::after {
        opacity: 1;
        transform: scaleX(1);
        animation: underline 1.4s ease-in-out infinite;
      }
      @keyframes underline {
        50% {
          opacity: 0.35;
        }
      }
      .word.lit {
        color: #fff;
      }
      .word.lit::before {
        transform: scaleX(1);
      }
      .spark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 9px;
        height: 9px;
        margin: -4.5px;
        border-radius: 50%;
        background: var(--c);
        pointer-events: none;
      }
      .ring {
        position: absolute;
        inset: -2px;
        border-radius: 18px;
        border: 3px solid var(--c);
        pointer-events: none;
      }

      .emoji {
        height: 112px;
        display: grid;
        place-items: center;
        font-size: 92px;
        line-height: 1;
        position: relative;
      }
      .emoji span {
        display: block;
      }
      /* La bulle vide où l'image éclora */
      .emoji:empty::before {
        content: "";
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 3px dashed #e4ddf2;
        animation: spin 24s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      .emoji .halo {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(255, 210, 120, 0.7),
          rgba(255, 140, 190, 0.25) 60%,
          transparent
        );
      }

      .level {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 auto 18px;
        padding: 4px 12px 4px 8px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        color: var(--lc);
        background: color-mix(in srgb, var(--lc) 12%, white);
      }
      .level svg {
        width: 22px;
        height: 16px;
      }

      /* --- Accueil --- */
      .title {
        margin: 0 0 6px;
        font-size: 34px;
        line-height: 1.1;
      }
      .subtitle {
        margin: 0 0 24px;
        color: var(--soft);
        font-size: 18px;
      }
      .demo .word {
        animation: demo-text 6s infinite;
        animation-delay: calc(var(--i) * 0.7s + 0.6s);
      }
      .demo .word::before {
        transition: none;
        animation: demo-fill 6s infinite;
        animation-delay: inherit;
      }
      @keyframes demo-fill {
        0% {
          transform: scaleX(0);
        }
        6%,
        80% {
          transform: scaleX(1);
        }
        90%,
        100% {
          transform: scaleX(0);
        }
      }
      @keyframes demo-text {
        0% {
          color: var(--ink);
        }
        4%,
        80% {
          color: #fff;
        }
        90%,
        100% {
          color: var(--ink);
        }
      }

      /* --- Fin de partie --- */
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 64px);
        justify-content: center;
        gap: 10px;
        margin: 0 auto 20px;
      }
      .gallery span {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        font-size: 38px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--c) 16%, white);
      }
      .total {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .total small {
        font-size: 28px;
        margin-left: 4px;
        color: var(--soft);
      }
      .verdict {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 18px;
        font-weight: 700;
        color: #a5671a;
        background: #fff1d6;
      }
      .verdict svg {
        width: 22px;
        height: 22px;
      }

      /* --- Le gros bouton : micro, puis flèche, puis rejouer --- */
      .controls {
        display: grid;
        justify-items: center;
        gap: 10px;
        padding-bottom: 4px;
      }
      .go {
        position: relative;
        width: 96px;
        height: 96px;
        border: none;
        border-radius: 50%;
        padding: 0;
        color: #fff;
        background: linear-gradient(145deg, var(--go-a), var(--go-b));
        box-shadow: 0 14px 30px -10px rgba(140, 92, 255, 0.7);
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.15s;
      }
      .go:active {
        transform: scale(0.93);
      }
      .go:focus-visible {
        outline: 4px solid rgba(140, 92, 255, 0.4);
        outline-offset: 4px;
      }
      .go svg {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 44px;
        height: 44px;
        opacity: 0;
        transform: scale(0.5) rotate(-30deg);
        transition:
          opacity 0.25s,
          transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
      }
      .go[data-mode="start"] .i-mic,
      .go[data-mode="listen"] .i-mic,
      .go[data-mode="idle"] .i-mic,
      .go[data-mode="next"] .i-next,
      .go[data-mode="replay"] .i-replay,
      .go[data-mode="denied"] .i-off {
        opacity: 1;
        transform: none;
      }
      .go[data-mode="idle"],
      .go[data-mode="denied"] {
        background: linear-gradient(145deg, #b9b0cc, #8f86a8);
        box-shadow: 0 12px 26px -12px rgba(60, 50, 90, 0.6);
      }
      .go[data-mode="next"] {
        background: linear-gradient(145deg, #2fcf8e, #1e9bf0);
        box-shadow: 0 14px 30px -10px rgba(30, 155, 240, 0.7);
      }
      /* Les ondes : le micro écoute */
      .waves {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .waves i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #b48cff;
        opacity: 0;
      }
      .go[data-mode="listen"] .waves i {
        animation: wave 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      }
      .go[data-mode="listen"] .waves i:nth-child(2) {
        animation-delay: 0.8s;
      }
      .go[data-mode="listen"] .waves i:nth-child(3) {
        animation-delay: 1.6s;
      }
      @keyframes wave {
        0% {
          transform: scale(1);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      .go[data-mode="start"] {
        animation: invite 2.2s ease-in-out infinite;
      }
      @keyframes invite {
        50% {
          transform: scale(1.06);
        }
      }
      .hint {
        min-height: 22px;
        font-size: 17px;
        font-weight: 700;
        color: var(--soft);
        text-align: center;
      }

      @media (hover: hover) {
        .go:hover {
          transform: scale(1.04);
        }
      }

      @media (max-height: 680px) {
        .card {
          padding: 20px 14px 22px;
        }
        .emoji {
          height: 84px;
          font-size: 70px;
        }
        .go {
          width: 84px;
          height: 84px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ambient i,
        .emoji:empty::before,
        .steps i.now,
        .word.next::after,
        .go[data-mode="start"],
        .go[data-mode="listen"] .waves i,
        .demo .word,
        .demo .word::before {
          animation: none;
        }
        .demo .word {
          color: #fff;
        }
        .demo .word::before {
          transform: scaleX(1);
        }
        .word::before {
          transition: none;
        }
      }

      #confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
    <main class="app">
      <header class="bar">
        <div class="chip timer" id="timer" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <circle cx="12" cy="13.5" r="7.5" />
            <path d="M12 13.5V9.5M10 2.5h4M18.5 6.5l1.5-1.5" />
          </svg>
          <span id="time">0 s</span>
        </div>
        <div class="chip record" id="record" hidden aria-label="Record">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z"
            />
          </svg>
          <span id="best"></span>
        </div>
      </header>
      <div class="steps" id="steps" hidden aria-hidden="true"></div>
      <section class="stage" id="stage" aria-live="polite"></section>
      <div class="controls">
        <button class="go" id="go" data-mode="start" aria-label="Commencer">
          <span class="waves" aria-hidden="true"><i></i><i></i><i></i></span>
          <svg
            class="i-mic"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <rect
              x="8.5"
              y="2.5"
              width="7"
              height="12"
              rx="3.5"
              fill="currentColor"
            />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" />
          </svg>
          <svg
            class="i-off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <rect
              x="8.5"
              y="2.5"
              width="7"
              height="12"
              rx="3.5"
              fill="currentColor"
              opacity="0.55"
            />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M4 3l16 18" />
          </svg>
          <svg
            class="i-next"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4.5 12h14M13 6l6 6-6 6" />
          </svg>
          <svg
            class="i-replay"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5" />
            <path d="M4 3.5v4.5h4.5" />
          </svg>
        </button>
        <div class="hint" id="hint"></div>
      </div>
    </main>
    <canvas id="confetti"></canvas>

    <script src="confetti.js"></script>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
