<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1030" />
    <title>p ou q ?</title>
    <style>
      /* Lettres de lumière : une nuit bleue, deux bulles qui flottent, et des
         lettres qui s'écrivent en traînées lumineuses, dans l'ordre du geste.
         Une erreur se retourne comme dans un miroir : le p devient q. */

      @font-face {
        font-family: "Lexend";
        src: url("Lexend-Variable.woff2") format("woff2");
        font-weight: 300 700;
        font-display: swap;
      }

      :root {
        --night: #0b1030;
        --night-2: #1c2058;
        --glow: #8ff6ff;
        --warm: #ffb46b;
        --text: #eef0ff;
        --muted: #a3abdc;
        --glass: rgba(255, 255, 255, 0.1);
        --glass-edge: rgba(255, 255, 255, 0.22);
        --font: "Lexend", "Trebuchet MS", system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background-color: var(--night);
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Le ciel : quelques étoiles fixes, et une aurore qui dérive lentement
         (seule sa position s'anime). */
      .sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent),
          radial-gradient(1px 1px at 78% 12%, #fff9 50%, transparent),
          radial-gradient(1.5px 1.5px at 62% 34%, #fff6 50%, transparent),
          radial-gradient(1px 1px at 28% 52%, #fff7 50%, transparent),
          radial-gradient(1px 1px at 88% 64%, #fff6 50%, transparent),
          radial-gradient(1.5px 1.5px at 8% 80%, #fff5 50%, transparent),
          radial-gradient(1px 1px at 46% 88%, #fff6 50%, transparent),
          radial-gradient(ellipse at 50% 120%, var(--night-2), var(--night) 70%);
      }

      .sky::before {
        content: "";
        position: absolute;
        inset: -15%;
        background:
          radial-gradient(
            40% 30% at 30% 40%,
            color-mix(in srgb, var(--glow) 16%, transparent),
            transparent 70%
          ),
          radial-gradient(
            35% 25% at 70% 60%,
            rgba(180, 140, 255, 0.16),
            transparent 70%
          );
        animation: aurora 24s ease-in-out infinite alternate;
      }

      @keyframes aurora {
        to {
          transform: translate(8%, -6%);
        }
      }

      .app {
        position: relative;
        max-width: 520px;
        flex: 1;
        width: 100%;
        margin: 0 auto;
        padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .screen {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      #game {
        flex: 1;
      }

      .hidden {
        display: none;
      }

      /* Les panneaux : du verre dépoli sur la nuit. */
      .panel {
        background: var(--glass);
        border: 1px solid var(--glass-edge);
        border-radius: 22px;
        padding: 22px 18px;
      }

      /* ===== Les lettres de lumière ===== */

      .light {
        display: block;
        overflow: visible;
      }

      .light path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
      }

      /* L'opacité est sur la couche entière : là où deux traits se
         croisent, leurs halos ne s'additionnent pas. */
      .light .halo {
        stroke: var(--glow);
        stroke-width: 18;
        opacity: 0.16;
      }

      .light .beam {
        stroke: var(--glow);
        stroke-width: 9;
        opacity: 0.45;
      }

      .light .core {
        stroke: #fff;
        stroke-width: 4;
      }

      .light .tip {
        fill: #fff;
      }

      .light .tip-glow {
        fill: var(--glow);
        opacity: 0.5;
      }

      .light.warm {
        --glow: var(--warm);
      }

      /* ===== Accueil ===== */

      .welcome {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        margin-top: 4vh;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 300;
        font-size: 1.6rem;
        color: var(--muted);
      }

      .title .light {
        width: 74px;
        height: 104px;
      }

      .welcome p {
        font-size: 1.1rem;
        line-height: 1.55;
        max-width: 22em;
      }

      .glow-btn {
        font-family: var(--font);
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--night);
        background: var(--glow);
        border: none;
        border-radius: 999px;
        padding: 14px 34px;
        cursor: pointer;
        box-shadow:
          0 0 24px color-mix(in srgb, var(--glow) 55%, transparent),
          0 0 2px #fff inset;
        touch-action: manipulation;
      }

      .glow-btn:active {
        transform: scale(0.96);
      }

      .sound-toggle {
        font-family: var(--font);
        font-size: 0.95rem;
        color: var(--muted);
        background: none;
        border: none;
        border-bottom: 1px dotted currentColor;
        cursor: pointer;
      }

      /* ===== Partie ===== */

      /* Trois colonnes, celle du milieu centrée : le chrono ne fait pas
         bouger les compteurs. */
      .stats {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: baseline;
        gap: 10px;
        font-size: 1rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .stats b {
        font-size: 1.35em;
        font-weight: 600;
        color: var(--text);
      }

      .tally {
        display: flex;
        gap: 14px;
      }

      .tally .good b {
        color: var(--glow);
      }

      .tally .bad b {
        color: var(--warm);
      }

      #timer {
        justify-self: end;
      }

      /* Vingt étoiles qui s'allument au fil de la partie. */
      .track {
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        gap: 4px;
      }

      .track span {
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      .track span.ok {
        border: none;
        background: var(--glow);
        box-shadow: 0 0 8px var(--glow);
      }

      .track span.ko {
        border: none;
        background: var(--warm);
        opacity: 0.55;
      }

      .stage {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 0;
      }

      .listen {
        position: absolute;
        top: 0;
        right: 0;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 1px solid var(--glass-edge);
        background: var(--glass);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .listen svg {
        width: 24px;
        height: 24px;
      }

      /* L'image, dans un halo qui respire. */
      .picture {
        font-size: min(7.5rem, 17vh);
        padding: 0 0.15em;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--glow) 14%, transparent),
          transparent 68%
        );
      }

      /* La case où la lettre s'écrit : un cadre de lumière qui palpite
         tant qu'elle attend. */
      .slot {
        position: relative;
        width: min(30vw, 120px);
        aspect-ratio: 100 / 140;
      }

      .slot::before {
        content: "";
        position: absolute;
        inset: 12% 4% 2%;
        border-radius: 18px;
        border: 2px dashed color-mix(in srgb, var(--glow) 35%, transparent);
        animation: waiting 1.8s ease-in-out infinite;
      }

      .slot.filled::before {
        display: none;
      }

      @keyframes waiting {
        50% {
          opacity: 0.35;
        }
      }

      .slot .light {
        width: 100%;
        height: 100%;
      }

      /* Le mot, qui n'apparaît qu'une fois la lettre posée : en français,
         le q est toujours suivi d'un u, la suite du mot trahirait la
         réponse. */
      .word {
        min-height: 1.4em;
        font-size: clamp(1.6rem, 8vw, 2.2rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-align: center;
      }

      .word span {
        display: inline-block;
        animation: appear 0.4s ease-out backwards;
      }

      .word .first {
        color: var(--glow);
        text-shadow: 0 0 12px var(--glow);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      /* Deux bulles de verre qui flottent, chacune avec sa lettre. */
      .orbs {
        display: flex;
        justify-content: center;
        gap: 34px;
        padding-bottom: 6px;
      }

      .orb {
        width: min(30vw, 116px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background:
          radial-gradient(
            circle at 32% 26%,
            rgba(255, 255, 255, 0.32),
            transparent 34%
          ),
          radial-gradient(
            circle,
            color-mix(in srgb, var(--glow) 10%, transparent),
            color-mix(in srgb, var(--glow) 2%, transparent) 70%
          );
        box-shadow:
          inset 0 0 22px color-mix(in srgb, var(--glow) 25%, transparent),
          0 8px 26px rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
        cursor: pointer;
        touch-action: manipulation;
        animation: float 3.2s ease-in-out infinite;
      }

      .orb + .orb {
        animation-delay: -1.6s;
      }

      .orb .light {
        width: 46%;
        height: 64%;
      }

      .orb.chosen {
        box-shadow:
          inset 0 0 30px color-mix(in srgb, var(--glow) 55%, transparent),
          0 0 30px color-mix(in srgb, var(--glow) 50%, transparent);
      }

      @keyframes float {
        50% {
          transform: translateY(-7px);
        }
      }

      /* La comète qui part de la bulle vers la case. */
      .comet {
        position: fixed;
        left: 0;
        top: 0;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fff 30%,
          var(--glow) 60%,
          transparent 72%
        );
        box-shadow: 0 0 18px 6px
          color-mix(in srgb, var(--glow) 60%, transparent);
        pointer-events: none;
        z-index: 20;
      }

      .spark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 8px 2px var(--glow);
        pointer-events: none;
      }

      /* ===== Fin de partie : la constellation ===== */

      .end {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }

      .end h2 {
        font-weight: 500;
        font-size: 1.5rem;
      }

      #constellation {
        width: 100%;
        max-width: 360px;
        overflow: visible;
      }

      #constellation .star {
        fill: #fff;
      }

      #constellation .halo-star {
        fill: var(--glow);
        opacity: 0.2;
      }

      #constellation .missed-star {
        fill: var(--warm);
        opacity: 0.6;
      }

      #constellation line {
        stroke: color-mix(in srgb, var(--glow) 45%, transparent);
        stroke-width: 1.2;
      }

      .score {
        font-size: 2.6rem;
        font-weight: 600;
        line-height: 1.1;
        text-shadow: 0 0 18px color-mix(in srgb, var(--glow) 60%, transparent);
      }

      .score small {
        display: block;
        font-size: 0.42em;
        font-weight: 400;
        color: var(--muted);
        text-shadow: none;
      }

      .end-words {
        list-style: none;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 2px 16px;
        text-align: left;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .end-words li {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .end-words .first {
        color: var(--glow);
        font-weight: 600;
      }

      .end-words .missed {
        color: var(--warm);
        text-decoration: line-through;
        margin-right: 2px;
      }

      /* ===== Les meilleurs scores ===== */

      .ledger h3 {
        font-weight: 500;
        font-size: 1.05rem;
        margin-bottom: 6px;
      }

      .ledger table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      .ledger th {
        font-weight: 400;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: left;
      }

      .ledger td,
      .ledger th {
        padding: 7px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .ledger .current td {
        color: var(--glow);
      }

      .ledger .empty {
        color: var(--muted);
      }

      #confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 30;
      }

      @media (prefers-reduced-motion: reduce) {
        .sky::before,
        .orb,
        .slot::before,
        .word span {
          animation: none;
        }
      }
      /* L'image du mot, à la taille de l'emoji qu'elle remplace. */
      .picture img {
        display: block;
        width: 1.1em;
        height: 1.1em;
      }
    </style>
    <script src="exit-guard.js"></script>
  </head>
  <body>
    <canvas id="confetti"></canvas>
    <div class="sky" aria-hidden="true"></div>

    <main class="app">
      <!-- ===== Accueil ===== -->
      <section class="screen" id="welcome">
        <div class="panel welcome">
          <h1 class="title" aria-label="p ou q ?">
            <svg class="light" id="titleP" viewBox="0 0 100 140"></svg>
            <span>ou</span>
            <svg class="light" id="titleQ" viewBox="0 0 100 140"></svg>
            <span>?</span>
          </h1>
          <p>
            Regarde l'image, écoute le mot, puis touche la bonne bulle : la
            lettre s'écrit en lumière.
          </p>
          <button class="glow-btn" id="startBtn">Commencer</button>
          <button class="sound-toggle" id="soundToggle"></button>
        </div>
      </section>

      <!-- ===== Partie ===== -->
      <section class="screen hidden" id="game">
        <div class="stats">
          <span>Mot <b id="wordNumber">1</b> / <span>20</span></span>
          <span class="tally">
            <span class="good">✓ <b id="goodCount">0</b></span>
            <span class="bad">✗ <b id="badCount">0</b></span>
          </span>
          <span id="timer">00:00</span>
        </div>
        <div class="track" id="track"></div>

        <div class="stage">
          <button class="listen" id="listen" aria-label="Écouter le mot">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 9H8L13 5V19L8 15H4Z" fill="currentColor" />
              <path
                d="M16.5 8.5A5 5 0 0 1 16.5 15.5M19 6A8.5 8.5 0 0 1 19 18"
              />
            </svg>
          </button>
          <div class="picture"><img id="picture" alt="" /></div>
          <div class="slot" id="slot">
            <svg class="light" id="slotLetter" viewBox="0 0 100 140"></svg>
          </div>
          <div class="word" id="word"></div>
        </div>

        <div class="orbs" id="orbs">
          <button class="orb" data-letter="p" aria-label="p">
            <svg class="light" viewBox="0 0 100 140"></svg>
          </button>
          <button class="orb" data-letter="q" aria-label="q">
            <svg class="light" viewBox="0 0 100 140"></svg>
          </button>
        </div>
      </section>

      <!-- ===== Fin de partie ===== -->
      <section class="screen hidden" id="end">
        <div class="panel end">
          <h2>Ta constellation</h2>
          <svg
            id="constellation"
            viewBox="0 0 320 170"
            aria-hidden="true"
          ></svg>
          <div class="score" id="score"></div>
          <ol class="end-words" id="endWords"></ol>
          <button class="glow-btn" id="replayBtn">Rejouer</button>
        </div>
      </section>

      <div class="panel ledger" id="ledger">
        <h3>Meilleurs scores</h3>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Score</th>
              <th>Temps</th>
            </tr>
          </thead>
          <tbody id="scoreboardBody"></tbody>
        </table>
      </div>
    </main>

    <script src="confetti.js"></script>
    <script src="voix.js"></script>
    <script src="images.js"></script>
    <script>
      const words = [
        // P words
        { word: "papillon", answer: "p" },
        { word: "pomme", answer: "p" },
        { word: "poisson", answer: "p" },
        { word: "pizza", answer: "p" },
        { word: "panda", answer: "p" },
        { word: "parapluie", answer: "p" },
        { word: "pingouin", answer: "p" },
        { word: "poire", answer: "p" },
        { word: "prince", answer: "p" },
        { word: "peinture", answer: "p" },
        { word: "piano", answer: "p" },
        { word: "pirate", answer: "p" },
        { word: "poule", answer: "p" },
        { word: "piment", answer: "p" },
        { word: "pastèque", answer: "p" },
        { word: "pêche", answer: "p" },
        { word: "popcorn", answer: "p" },
        { word: "puzzle", answer: "p" },
        { word: "parachute", answer: "p" },

        // Q words
        { word: "quatre", answer: "q" },
        { word: "question", answer: "q" },
        { word: "quille", answer: "q" },
        { word: "quiche", answer: "q" },
        { word: "quinze", answer: "q" },
        { word: "quad", answer: "q" },
        { word: "quartier", answer: "q" },
        { word: "quatre-quarts", answer: "q" },
        { word: "quatorze", answer: "q" },
        { word: "quai", answer: "q" },
        { word: "quarante", answer: "q" },
        { word: "quatre-vingts", answer: "q" },
      ]

      const NUMBER_OF_WORDS = 20
      const SOUND_KEY = "p-ou-q-sound"
      const SCORES_KEY = "scores-pq"

      let currentIndex = 0
      // Une réponse par mot joué : { word, answer, choice }.
      let results = []
      let busy = false
      let startTime
      let timerInterval

      const $ = (id) => document.getElementById(id)
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const countRight = () =>
        results.filter((r) => r.choice === r.answer).length
      const reducedMotion = () =>
        window.matchMedia("(prefers-reduced-motion: reduce)").matches

      Voice.folder = "audio/p-ou-q/"
      // Toutes les images d'avance : le jeu marche ensuite hors-ligne.
      WordImage.preload(words.map((w) => w.word))

      function showScreen(id) {
        for (const screen of ["welcome", "game", "end"]) {
          $(screen).classList.toggle("hidden", screen !== id)
        }
        $("ledger").classList.toggle("hidden", id === "game")
      }

      // ===== Les lettres de lumière =====

      // Chaque lettre en deux traits, dans l'ordre où on l'écrit : le p, le
      // bâton puis le rond ; le q, le rond puis le bâton. Le q est le p vu
      // dans un miroir. Ligne de base à 100, bas des jambages à 132.
      const STROKES = {
        p: [
          "M32 40 L32 132",
          "M32 58 C36 45 48 40 58 40 C74 40 82 55 82 70 C82 86 74 100 58 100 C47 100 36 94 32 84",
        ],
        q: [
          "M68 58 C64 45 52 40 42 40 C26 40 18 55 18 70 C18 86 26 100 42 100 C53 100 64 94 68 84",
          "M68 40 L68 132",
        ],
      }

      // Trois couches de lumière : un halo large, un rayon, un cœur blanc ;
      // une lueur sans filtre, que rien n'a à recalculer. Chaque couche porte
      // les deux traits.
      function drawLetter(svg, letter, drawn = true) {
        const layer = (name) =>
          `<g class="${name}">${STROKES[letter]
            .map(
              (d, i) =>
                `<path d="${d}" data-stroke="${i}" pathLength="1" stroke-dashoffset="${drawn ? 0 : 1}" />`,
            )
            .join("")}</g>`
        svg.innerHTML =
          layer("halo") +
          layer("beam") +
          layer("core") +
          `<circle class="tip-glow" r="0" /><circle class="tip" r="0" />`
      }

      const easeInOut = (t) =>
        t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2

      // La lettre s'écrit trait après trait, une pointe de lumière en tête.
      async function traceLetter(svg, letter) {
        drawLetter(svg, letter, reducedMotion())
        if (reducedMotion()) return
        const [tipGlow, tip] = svg.querySelectorAll("circle")
        for (const core of svg.querySelectorAll(".core path")) {
          const paths = svg.querySelectorAll(
            `[data-stroke="${core.dataset.stroke}"]`,
          )
          const length = core.getTotalLength()
          const duration = 120 + length * 2.4
          await new Promise((resolve) => {
            const start = performance.now()
            const frame = (now) => {
              const t = Math.min(1, (now - start) / duration)
              const k = easeInOut(t)
              const point = core.getPointAtLength(k * length)
              paths.forEach((p) => p.setAttribute("stroke-dashoffset", 1 - k))
              for (const [circle, r] of [
                [tipGlow, 13],
                [tip, 5],
              ]) {
                circle.setAttribute("cx", point.x)
                circle.setAttribute("cy", point.y)
                circle.setAttribute("r", t < 1 ? r : 0)
              }
              if (t < 1) requestAnimationFrame(frame)
              else resolve()
            }
            requestAnimationFrame(frame)
          })
        }
      }

      // La lettre fautive se retourne comme dans un miroir : à mi-chemin, vue
      // par la tranche, elle devient la bonne (le q est le p dans un miroir)
      // et change de couleur.
      async function mirror(svg, answer) {
        const turn = (from, to, easing) =>
          svg.animate(
            [
              { transform: `perspective(500px) rotateY(${from}deg)` },
              { transform: `perspective(500px) rotateY(${to}deg)` },
            ],
            { duration: 320, easing },
          ).finished
        if (!reducedMotion()) await turn(0, 90, "ease-in")
        svg.classList.remove("warm")
        drawLetter(svg, answer)
        if (!reducedMotion()) await turn(-90, 0, "ease-out")
      }

      // La comète part de la bulle et file vers la case, en arc.
      function comet(from, to) {
        if (reducedMotion()) return Promise.resolve()
        const center = (el) => {
          const r = el.getBoundingClientRect()
          return [r.left + r.width / 2, r.top + r.height / 2]
        }
        const [x0, y0] = center(from)
        const [x1, y1] = center(to)
        const dot = document.createElement("div")
        dot.className = "comet"
        document.body.appendChild(dot)
        const at = (x, y, s) => ({
          transform: `translate(${x}px, ${y}px) scale(${s})`,
        })
        return dot
          .animate(
            [
              at(x0, y0, 0.6),
              at((x0 + x1) / 2 + (x0 < x1 ? -40 : 40), (y0 + y1) / 2 - 60, 1.2),
              at(x1, y1, 1),
            ],
            { duration: 380, easing: "ease-in" },
          )
          .finished.then(() => dot.remove())
      }

      // Une gerbe d'étincelles autour de la case.
      function sparkle(around) {
        if (reducedMotion()) return
        for (let i = 0; i < 12; i++) {
          const spark = document.createElement("span")
          spark.className = "spark"
          around.appendChild(spark)
          const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.4
          const distance = 60 + Math.random() * 40
          spark
            .animate(
              [
                { transform: "translate(0, 0) scale(1)", opacity: 1 },
                {
                  transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0.2)`,
                  opacity: 0,
                },
              ],
              { duration: 650 + Math.random() * 250, easing: "ease-out" },
            )
            .finished.then(() => spark.remove())
        }
      }

      // ===== Les petits sons =====

      let soundOn = true
      try {
        soundOn = localStorage.getItem(SOUND_KEY) !== "off"
      } catch (e) {
        // navigation privée : le son reste allumé
      }

      // Des notes douces : un carillon pour une bonne réponse, un glissé qui
      // monte quand la lettre se retourne.
      function chime(notes, glide = 1) {
        if (!soundOn) return
        const ctx = Voice.wake(1200)
        if (!ctx) return
        notes.forEach((freq, i) => {
          const t = ctx.currentTime + i * 0.09
          const osc = ctx.createOscillator()
          const gain = ctx.createGain()
          osc.type = "sine"
          osc.frequency.setValueAtTime(freq, t)
          osc.frequency.exponentialRampToValueAtTime(freq * glide, t + 0.4)
          gain.gain.setValueAtTime(0, t)
          gain.gain.linearRampToValueAtTime(0.12, t + 0.02)
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6)
          osc.connect(gain)
          gain.connect(ctx.destination)
          osc.start(t)
          osc.stop(t + 0.65)
        })
      }

      function renderSoundToggle() {
        $("soundToggle").textContent =
          "Petits sons : " + (soundOn ? "oui" : "non")
        $("soundToggle").setAttribute("aria-pressed", soundOn)
      }

      function toggleSound() {
        soundOn = !soundOn
        try {
          localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off")
        } catch (e) {
          // navigation privée : le réglage ne sera pas gardé
        }
        renderSoundToggle()
        chime([1047])
      }

      // ===== Chrono et scores =====

      function formatTime(ms) {
        const minutes = Math.floor(ms / 60000)
        const seconds = Math.floor((ms % 60000) / 1000)
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
      }

      function updateTime() {
        $("timer").textContent = formatTime(Date.now() - startTime)
      }

      function startTimer() {
        startTime = Date.now()
        clearInterval(timerInterval)
        timerInterval = setInterval(updateTime, 1000)
        updateTime()
      }

      function readScores() {
        try {
          return JSON.parse(localStorage.getItem(SCORES_KEY) || "[]")
        } catch (e) {
          return []
        }
      }

      function saveScore(score, time) {
        const scores = readScores()
        // Identifiant unique pour retrouver la partie qu'on vient de jouer
        // dans le tableau et la mettre en évidence.
        const id = Date.now()
        scores.push({
          id,
          date: new Date().toLocaleDateString("fr-FR"),
          score,
          time,
        })
        scores.sort((a, b) => b.score - a.score || a.time.localeCompare(b.time))
        scores.splice(10)
        try {
          localStorage.setItem(SCORES_KEY, JSON.stringify(scores))
        } catch (e) {
          // navigation privée : le score ne sera pas gardé
        }
        updateScoreboard(id)
      }

      function updateScoreboard(highlightId) {
        const scores = readScores()
        $("scoreboardBody").innerHTML = scores.length
          ? scores
              .map((s) => {
                const isCurrent = highlightId && s.id === highlightId
                return `<tr class="${isCurrent ? "current" : ""}">
                  <td>${isCurrent ? "→ " : ""}${s.date}</td>
                  <td>${s.score} / ${NUMBER_OF_WORDS}</td>
                  <td>${s.time}</td>
                </tr>`
              })
              .join("")
          : `<tr><td class="empty" colspan="3">Pas encore de partie.</td></tr>`
      }

      // ===== Partie =====

      function shuffleWords() {
        for (let i = words.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[words[i], words[j]] = [words[j], words[i]]
        }
      }

      function updateStats() {
        const right = countRight()
        $("goodCount").textContent = right
        $("badCount").textContent = results.length - right
      }

      function displayWord() {
        const { word } = words[currentIndex]
        $("wordNumber").textContent = currentIndex + 1
        $("picture").src = WordImage.src(word)
        $("word").innerHTML = ""
        $("slotLetter").innerHTML = ""
        $("slot").classList.remove("filled")
        // Les bulles changent de côté d'un mot à l'autre : on lit la lettre,
        // pas sa place.
        $("orbs").style.flexDirection =
          Math.random() < 0.5 ? "row" : "row-reverse"
        Voice.load(word)
      }

      // Le mot entier, une fois la lettre écrite : sa première lettre en
      // lumière, les autres qui arrivent une à une.
      function revealWord(word) {
        $("word").innerHTML = [...word]
          .map(
            (c, i) =>
              `<span class="${i ? "" : "first"}" style="animation-delay: ${i * 45}ms">${c}</span>`,
          )
          .join("")
      }

      async function checkAnswer(orb) {
        if (busy) return
        busy = true
        const { word, answer } = words[currentIndex]
        const choice = orb.dataset.letter
        const isCorrect = choice === answer
        results.push({ word, answer, choice })
        // Le toucher débloque le son ; après une erreur, il reste éveillé
        // jusqu'à ce que la voix ait dit le mot.
        Voice.wake(isCorrect ? 1500 : 7000)
        // La partie est engagée dès la première réponse.
        if (window.ExitGuard) ExitGuard.setActive(true)

        const slot = $("slot")
        const letter = $("slotLetter")
        orb.classList.add("chosen")
        await comet(orb, slot)
        slot.classList.add("filled")
        letter.classList.toggle("warm", !isCorrect)
        await traceLetter(letter, choice)
        $("track").children[currentIndex].className = isCorrect ? "ok" : "ko"
        updateStats()

        if (isCorrect) {
          chime([784, 1175])
          sparkle(slot)
          revealWord(word)
          await wait(900)
        } else {
          // Rien à lire : la lettre se retourne et devient la bonne, et la
          // voix dit le mot.
          await wait(300)
          chime([523], 2)
          await mirror(letter, answer)
          revealWord(word)
          await Voice.say(word)
          await wait(700)
        }

        orb.classList.remove("chosen")
        busy = false
        currentIndex++
        if (currentIndex >= NUMBER_OF_WORDS) showGameEnd()
        else displayWord()
      }

      function startGame() {
        currentIndex = 0
        results = []
        $("track").innerHTML = "<span></span>".repeat(NUMBER_OF_WORDS)
        // Une nouvelle partie n'est engagée qu'à la première réponse.
        if (window.ExitGuard) ExitGuard.setActive(false)
        showScreen("game")
        shuffleWords()
        updateStats()
        displayWord()
        startTimer()
      }

      // ===== Fin de partie =====

      // Vingt étoiles en vague ; une ligne relie deux bonnes réponses qui se
      // suivent, comme les étoiles d'une constellation.
      function drawConstellation() {
        const stars = results.map((r, i) => ({
          x: 18 + i * 15,
          y: 85 + 48 * Math.sin(i * 0.85) + 18 * Math.cos(i * 2.1),
          ok: r.choice === r.answer,
        }))
        const lines = stars
          .slice(1)
          .map((s, i) => [stars[i], s])
          .filter(([a, b]) => a.ok && b.ok)
          .map(
            ([a, b]) =>
              `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" />`,
          )
        const dots = stars.map((s) =>
          s.ok
            ? `<circle class="halo-star" cx="${s.x}" cy="${s.y}" r="9" /><circle class="star" cx="${s.x}" cy="${s.y}" r="3.5" />`
            : `<circle class="missed-star" cx="${s.x}" cy="${s.y}" r="2.2" />`,
        )
        $("constellation").innerHTML = lines.join("") + dots.join("")
      }

      function showGameEnd() {
        const finalTime = $("timer").textContent
        const score = countRight()
        clearInterval(timerInterval)
        if (window.ExitGuard) ExitGuard.setActive(false)
        saveScore(score, finalTime)

        const verdict =
          score === NUMBER_OF_WORDS
            ? "Parfait !"
            : score >= NUMBER_OF_WORDS - 3
              ? "Bravo !"
              : score >= NUMBER_OF_WORDS / 2
                ? "Bien joué"
                : "Continue !"
        drawConstellation()
        $("score").innerHTML =
          `${score} / ${NUMBER_OF_WORDS}<small>${verdict} · en ${finalTime}</small>`

        // Chaque mot ; une erreur garde sa lettre barrée devant la bonne.
        $("endWords").innerHTML = results
          .map(({ word, answer, choice }) => {
            const missed =
              choice !== answer ? `<span class="missed">${choice}</span>` : ""
            return `<li>${missed}<span class="first">${answer}</span>${word.slice(1)}</li>`
          })
          .join("")

        showScreen("end")
        window.scrollTo(0, 0)
        if (score === NUMBER_OF_WORDS) showConfetti()
      }

      // ===== Départ =====

      document.querySelectorAll(".orb").forEach((orb) => {
        drawLetter(orb.querySelector("svg"), orb.dataset.letter)
        orb.addEventListener("click", () => checkAnswer(orb))
      })
      $("listen").addEventListener("click", () =>
        Voice.say(words[currentIndex].word),
      )
      $("soundToggle").addEventListener("click", toggleSound)
      for (const id of ["startBtn", "replayBtn"]) {
        $(id).addEventListener("click", () => {
          Voice.wake(300)
          startGame()
        })
      }
      renderSoundToggle()
      updateScoreboard()
      // L'accueil écrit son titre en lumière.
      traceLetter($("titleP"), "p").then(() => traceLetter($("titleQ"), "q"))
      // Écran d'accueil : aucune partie en cours.
      if (window.ExitGuard) ExitGuard.setActive(false)
    </script>
  </body>
</html>
